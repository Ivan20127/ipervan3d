let audioCtx=null;

function startAudio(){
    if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function beep(freq,duration=.08,type="square",volume=.05){
    if(!audioCtx)return;

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type=type;
    o.frequency.value=freq;

    g.gain.setValueAtTime(volume,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    o.stop(audioCtx.currentTime+duration);
}

        "C"

        game.started &&
        !game.over &&
        !world.finished
    ){

    }

});

window.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

    for(const p of data.platforms){
        addPlatform(
            p[0],
            p[1],
            p[2],
            25
        );
    }

    /* SPIKES */

    for(const s of data.spikes){
        addSpike(
            s[0],
            s[1],
            s[2]
        );
    }

    /* BLOCKS */

    for(const b of data.blocks){
        addBlock(
            b[0],
            b[1]
        );
    }

    /* FILAMENT */

    for(
        let x=120;
        x<data.width-180;
        x+=190
    ){

        const y=
            370-
            ((x/190)%3)*35;

        addFilament(x,y);
    }

    /* PLATFORM FILAMENT */

    for(const p of data.platforms){

        for(
            let x=p[0]+20;
            x<p[0]+p[2]-10;
            x+=48
        ){

            addFilament(
                x,
                p[1]-28
            );
        }
    }

    /* ENEMIES */

    for(const e of data.enemies){
        addEnemy(e[0],e[1]);
    }

    /* =====================================================
       EXACTLY TWO POWERUPS PER LEVEL
    ===================================================== */

    const set=powerupSets[number-1];

    const p1=data.platforms[
        Math.floor(data.platforms.length*.30)
    ];

    const p2=data.platforms[
        Math.floor(data.platforms.length*.72)
    ];

    addPowerup(
        p1[0]+p1[2]/2-17,
        p1[1]-58,
        set[0]
    );

    addPowerup(
        p2[0]+p2[2]/2-17,
        p2[1]-58,
        set[1]
    );

    /* PLAYER */

    player.x=100;
    player.y=350;
    player.vx=0;
    player.vy=0;

    player.invincible=120;
    player.checkpoint=100;

    player.extraJumpUsed=false;

    player.big=false;
    player.starTimer=0;

    /* IMPORTANT:
       Powerups reset when starting a new level.
       They are NOT automatically given to the player.
    */

    game.fireball=false;
    game.extraJump=false;

    /* LEVEL INTRO TEXT */

    addText(
        player.x+300,
        150,
        "LEVEL "+number,
        "#60a5fa",
        30
    );

    addText(
        player.x+300,
        185,
        data.name,
        "#e2e8f0",
        18
    );

    beep(350,.12);

}


/* =========================================================
   COLLISION
========================================================= */

function overlap(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !game.started ||
        game.over ||
        world.finished
    ){
        return;
    }

    /* NORMAL JUMP */

    if(player.onGround){

        player.vy=-player.jumpPower;

        player.onGround=false;

        player.extraJumpUsed=false;

        beep(500,.07);

        return;
    }

    /* EXTRA JUMP */

    if(
        game.extraJump &&
        !player.extraJumpUsed
    ){

        player.vy=-player.jumpPower;

        player.extraJumpUsed=true;

        burst(
            player.x+player.w/2,
            player.y+player.h,
            "#c084fc",
            14
        );

        addText(
            player.x,
            player.y-10,
            "EXTRA JUMP!",
            "#c084fc",
            14
        );

        beep(750,.09,"sine");

    }

}


/* =========================================================
   DASH
========================================================= */

function dash(){

    if(
        player.dashCooldown>0 ||
        !game.started ||
        game.over ||
        world.finished
    ){
        return;
    }

    player.dashTimer=12;
    player.dashCooldown=70;

    player.vx=player.facing*13;

    burst(
        player.x,
        player.y+25,
        "#60a5fa",
        12
    );

    beep(
        180,
        .1,
        "sawtooth"
    );
}


/* =========================================================
   FIREBALL SHOOTING
========================================================= */

function shootFireball(){

    if(
        !game.fireball ||
        !game.started ||
        game.over ||
        world.finished
    ){
        return;
    }

    fireballs.push({

        x:
            player.x+
            (player.facing===1
                ?player.w
                :-14),

        y:player.y+20,

        w:18,
        h:18,

        vx:player.facing*9,

        vy:0,

        life:100,

        rotation:0

    });

    game.fireballsShot++;

    burst(
        player.x+player.w/2,
        player.y+20,
        "#f97316",
        7
    );

    beep(
        280,
        .08,
        "sawtooth"
    );
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    if(keys["ArrowLeft"]){

        player.vx-=player.acceleration;
        player.facing=-1;

    }

    if(keys["ArrowRight"]){

        player.vx+=player.acceleration;
        player.facing=1;

    }

    if(
        !keys["ArrowLeft"] &&
        !keys["ArrowRight"]
    ){

        player.vx*=player.friction;

    }

    player.vx=Math.max(
        -player.maxSpeed,
        Math.min(
            player.maxSpeed,
            player.vx
        )
    );

    if(player.dashTimer>0){

        player.dashTimer--;

        player.vx*=.97;

    }

    if(player.dashCooldown>0){
        player.dashCooldown--;
    }

    /* GRAVITY */

    player.vy+=.6;

    const oldBottom=
        player.y+player.h;

    player.x+=player.vx;
    player.y+=player.vy;

    player.onGround=false;

    /* PLATFORM COLLISION */

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            oldBottom<=p.y &&
            player.y+player.h>=p.y &&
            player.vy>=0
        ){

            player.y=p.y-player.h;
            player.vy=0;
            player.onGround=true;
            player.extraJumpUsed=false;

        }
    }

    /* WORLD WALL */

    player.x=Math.max(
        0,
        Math.min(
            world.width-player.w,
            player.x
        )
    );

    /* SPIKES */

    for(const spike of spikes){

        if(
            overlap(
                player,
                {
                    x:spike.x,
                    y:spike.y,
                    w:spike.w,
                    h:spike.h
                }
            )
        ){

            loseLife();
            return;
        }
    }

    /* FALL */

    if(player.y>620){

        loseLife();
        return;
    }

    /* CAMERA */

    world.cameraX=
        player.x-300;

    world.cameraX=Math.max(
        0,
        Math.min(
            world.width-WIDTH,
            world.cameraX
        )
    );

    if(player.invincible>0){
        player.invincible--;
    }

}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        enemy.vy+=.55;

        const oldBottom=
            enemy.y+enemy.h;

        enemy.y+=enemy.vy;

        enemy.onGround=false;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                oldBottom<=p.y &&
                enemy.y+enemy.h>=p.y &&
                enemy.vy>=0
            ){

                enemy.y=p.y-enemy.h;
                enemy.vy=0;
                enemy.onGround=true;

            }
        }

        enemy.x+=
            enemy.direction*
            enemy.speed;

        /* KEEP ENEMY ON PLATFORM */

        let support=null;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                Math.abs(
                    enemy.y+enemy.h-p.y
                )<8
            ){

                support=p;
                break;
            }
        }

        if(support){

            const left=support.x;
            const right=
                support.x+
                support.w-
                enemy.w;

            if(enemy.x<=left){

                enemy.x=left;
                enemy.direction=1;

            }

            if(enemy.x>=right){

                enemy.x=right;
                enemy.direction=-1;

            }
        }

        /* JUMPER */

        if(enemy.type==="jumper"){

            enemy.jumpTimer--;

            if(
                enemy.jumpTimer<=0 &&
                enemy.onGround
            ){

                enemy.direction=
                    player.x>enemy.x
                    ?1
                    :-1;

                enemy.vy=
                    -10-
                    game.level*.35;

                enemy.jumpTimer=
                    90+
                    Math.random()*80;

                burst(
                    enemy.x+17,
                    enemy.y+34,
                    "#c084fc",
                    7
                );

            }
        }

        /* FIRE ENEMY */

        if(enemy.type==="fire"){

            enemy.fireTimer--;

            if(enemy.fireTimer<=0){

                spitFire(enemy);

                enemy.fireTimer=
                    110-
                    game.level*5+
                    Math.random()*70;
            }
        }

        /* PLAYER */

        if(overlap(player,enemy)){

            const playerBottom=
                player.y+player.h;

            /* STOMP */

            if(
                player.vy>0 &&
                playerBottom-enemy.y<20
            ){

                killEnemy(enemy);

                player.vy=-10;

            }

            /* STAR */

            else if(player.starTimer>0){

                killEnemy(enemy);

            }

            /* FIREBALL POWER */

            else{

                loseLife();

            }
        }
    }

    enemies=enemies.filter(e=>e.alive);
}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy){

    enemy.alive=false;

    game.enemiesDefeated++;

    game.score+=150;

    burst(
        enemy.x+17,
        enemy.y+17,
        "#facc15",
        15
    );

    addText(
        enemy.x+17,
        enemy.y-10,
        "+150",
        "#facc15",
        14
    );

    beep(700,.07);

}


/* =========================================================
   ENEMY FIRE
========================================================= */

function spitFire(enemy){

    if(
        Math.abs(
            player.x-enemy.x
        )>700
    ){
        return;
    }

    const direction=
        player.x>enemy.x
        ?1
        :-1;

    fireballs.push({

        x:enemy.x+17,
        y:enemy.y+8,

        w:16,
        h:16,

        vx:
            direction*
            (4.5+
            game.level*.25),

        vy:-2,

        life:180,

        enemy:true,

        rotation:0
    });

}


/* =========================================================
   FIREBALL UPDATE
========================================================= */

function updateFireballs(){

    for(const fire of fireballs){

        fire.x+=fire.vx;
        fire.y+=fire.vy;

        if(!fire.enemy){
            fire.vy+=.04;
        }else{
            fire.vy+=.1;
        }

        fire.rotation+=.2;

        fire.life--;

        /* PLAYER */

        if(
            fire.enemy &&
            overlap(player,fire)
        ){

            fire.life=0;

            loseLife();

        }

        /* PLAYER FIREBALL HITS ENEMY */

        if(!fire.enemy){

            for(const enemy of enemies){

                if(
                    enemy.alive &&
                    overlap(fire,enemy)
                ){

                    fire.life=0;

                    killEnemy(enemy);

                    break;
                }
            }
        }

        /* PLATFORM */

        for(const p of platforms){

            if(overlap(fire,p)){

                fire.life=0;

                burst(
                    fire.x,
                    fire.y,
                    "#fb923c",
                    7
                );

            }
        }
    }

    fireballs=
        fireballs.filter(
            f=>f.life>0
        );
}


/* =========================================================
   BLOCKS
========================================================= */

function updateBlocks(){

    for(const block of blocks){

        if(block.used)continue;

        if(
            player.vy<0 &&
            player.x+player.w>block.x &&
            player.x<block.x+block.w &&
            player.y<block.y+block.h &&
            player.y+player.h>block.y
        ){

            block.used=true;

            game.filament+=5;
            game.score+=100;

            addText(
                block.x+21,
                block.y-10,
                "+5 FILAMENT",
                "#60a5fa",
                13
            );

            burst(
                block.x+21,
                block.y+20,
                "#facc15",
                8
            );

            beep(650,.08);

        }
    }
}


/* =========================================================
   COLLECT FILAMENT
========================================================= */

function updateCollectibles(){

    for(const item of collectibles){

        if(item.collected)continue;

        const box={
            x:item.x-9,
            y:item.y-9,
            w:18,
            h:18
        };

        if(overlap(player,box)){

            item.collected=true;

            game.filament++;
            game.score+=50;

            addText(
                item.x,
                item.y-15,
                "+1",
                "#60a5fa"
            );

            beep(
                850,
                .06,
                "sine"
            );
        }
    }
}


/* =========================================================
   POWER-UP COLLECTION
   POWER ONLY OBTAINS WHEN TOUCHING ORB
========================================================= */

function updatePowerups(){

    for(const item of powerups){

        if(item.collected)continue;

        item.pulse+=.08;

        if(overlap(player,item)){

            item.collected=true;

            if(item.type==="fireball"){

                game.fireball=true;

                game.score+=500;

                addText(
                    player.x,
                    player.y-20,
                    "🔥 FIREBALL!",
                    "#f97316",
                    19
                );

                burst(
                    item.x+17,
                    item.y+17,
                    "#ef4444",
                    22
                );

                beep(400,.12);

            }

            if(item.type==="extraJump"){

                game.extraJump=true;

                game.score+=500;

                addText(
                    player.x,
                    player.y-20,
                    "🪽 EXTRA JUMP!",
                    "#c084fc",
                    19
                );

                burst(
                    item.x+17,
                    item.y+17,
                    "#c084fc",
                    22
                );

                beep(750,.12);

            }
        }
    }
}


/* =========================================================
   CHECKPOINT
========================================================= */

function updateCheckpoint(){

    const checkpoint=
        Math.floor(player.x/1000)*1000+
        100;

    if(
        checkpoint>player.checkpoint &&
        checkpoint<world.width-100
    ){

        player.checkpoint=checkpoint;

        addText(
            checkpoint,
            300,
            "CHECKPOINT!",
            "#4ade80",
            16
        );

        beep(
            600,
            .08,
            "sine"
        );
    }
}


/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(){

    if(player.invincible>0)return;

    player.lives--;

    player.invincible=120;

    game.score=Math.max(
        0,
        game.score-200
    );

    player.x=player.checkpoint;
    player.y=300;

    player.vx=0;
    player.vy=-8;

    player.extraJumpUsed=false;

    /* IMPORTANT:
       Dying does NOT destroy your collected
       power-ups. */

    beep(
        120,
        .2,
        "sawtooth"
    );

    if(player.lives<=0){

        gameOver();

    }
}

/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,color,amount=10){

    for(let i=0;i<amount;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-.5)*8,
            vy:(Math.random()-.5)*8,

            size:2+Math.random()*4,

            color,

            life:25+Math.random()*30
        });
    }
}

function updateParticles(){

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.18;

        p.life--;

    }

    particles=
        particles.filter(
            p=>p.life>0
        );
}


/* =========================================================
   FLOATING TEXT
========================================================= */

function addText(
    x,
    y,
    text,
    color="white",
    size=16
){

    texts.push({
        x,
        y,
        text,
        color,
        size,
        life:65
    });
}

function updateTexts(){

    for(const t of texts){

        t.y-=.6;
        t.life--;

    }

    texts=
        texts.filter(
            t=>t.life>0
        );
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const theme=
        levels[game.level-1].theme;

    let top="#071426";
    let bottom="#172554";

    if(theme==="warehouse"){
        top="#111827";
        bottom="#312e81";
    }

    if(theme==="canyon"){
        top="#431407";
        bottom="#7c2d12";
    }

    if(theme==="lab"){
        top="#071e2f";
        bottom="#164e63";
    }

    if(theme==="mega"){
        top="#1e1b4b";
        bottom="#312e81";
    }

    const gradient=
        ctx.createLinearGradient(
            0,0,0,HEIGHT
        );

    gradient.addColorStop(0,top);
    gradient.addColorStop(1,bottom);

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    /* BUILDINGS */

    for(let i=0;i<35;i++){

        const x=
            i*80-
            (world.cameraX*.18%80);

        const h=
            70+
            (i*47)%140;

        ctx.fillStyle=
            i%2
            ?"rgba(15,27,46,.9)"
            :"rgba(20,34,56,.9)";

        ctx.fillRect(
            x,
            450-h,
            65,
            h
        );

        ctx.fillStyle=
            i%3===0
            ?"rgba(250,204,21,.8)"
            :"rgba(56,189,248,.8)";

        for(
            let y=470-h;
            y<420;
            y+=23
        ){

            ctx.fillRect(
                x+10,
                y,
                6,
                8
            );

            ctx.fillRect(
                x+30,
                y,
                6,
                8
            );

            ctx.fillRect(
                x+50,
                y,
                6,
                8
            );
        }
    }

}


/* =========================================================
   PLATFORM DRAW
========================================================= */

function drawPlatform(p){

    ctx.fillStyle="#334155";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );

    ctx.fillStyle="#64748b";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        7
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.08)";

    ctx.lineWidth=2;

    for(
        let x=p.x+10;
        x<p.x+p.w;
        x+=15
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            p.y+10
        );

        ctx.lineTo(
            x,
            p.y+p.h
        );

        ctx.stroke();
    }
}


/* =========================================================
   SPIKES
========================================================= */

function drawSpike(s){

    const count=
        Math.max(
            1,
            Math.floor(s.w/18)
        );

    const spikeW=s.w/count;

    for(let i=0;i<count;i++){

        const x=
            s.x+i*spikeW;

        ctx.fillStyle="#cbd5e1";

        ctx.beginPath();

        ctx.moveTo(
            x,
            s.y+s.h
        );

        ctx.lineTo(
            x+spikeW/2,
            s.y
        );

        ctx.lineTo(
            x+spikeW,
            s.y+s.h
        );

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle="#64748b";
        ctx.stroke();
    }
}


/* =========================================================
   BLOCK
========================================================= */

function drawBlock(block){

    ctx.fillStyle=
        block.used
        ?" #475569"
        :"#f59e0b";

    ctx.fillRect(
        block.x,
        block.y,
        block.w,
        block.h
    );

    ctx.strokeStyle="#111827";
    ctx.lineWidth=3;

    ctx.strokeRect(
        block.x+2,
        block.y+2,
        block.w-4,
        block.h-4
    );

    ctx.fillStyle=
        block.used
        ?" #64748b"
        :"#fff7ae";

    ctx.font="bold 24px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        block.used?"✓":"?",
        block.x+21,
        block.y+29
    );

    ctx.textAlign="left";
}


/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(enemy){

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        enemy.x+17,
        enemy.y+37,
        22,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    if(enemy.type==="jumper"){

        ctx.strokeStyle="#c084fc";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            enemy.x+8,
            enemy.y+34
        );

        ctx.lineTo(
            enemy.x+12,
            enemy.y+39
        );

        ctx.lineTo(
            enemy.x+17,
            enemy.y+34
        );

        ctx.lineTo(
            enemy.x+22,
            enemy.y+39
        );

        ctx.lineTo(
            enemy.x+27,
            enemy.y+34
        );

        ctx.stroke();
    }

    ctx.fillStyle=
        enemy.type==="fire"
        ?" #ef4444"
        :
        enemy.type==="jumper"
        ?" #a855f7"
        :"#f97316";

    ctx.fillStyle=
        enemy.type==="fire"
        ?"#ef4444"
        :
        enemy.type==="jumper"
        ?"#a855f7"
        :"#f97316";

    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.w,
        enemy.h,
        7
    );

    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.2)";
    ctx.lineWidth=2;

    for(
        let y=enemy.y+8;
        y<enemy.y+enemy.h;
        y+=7
    ){

        ctx.beginPath();

        ctx.moveTo(
            enemy.x+4,
            y
        );

        ctx.lineTo(
            enemy.x+enemy.w-4,
            y
        );

        ctx.stroke();
    }

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        enemy.x+10,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        enemy.x+24,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    if(enemy.type==="fire"){

        ctx.font="12px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "🔥",
            enemy.x+17,
            enemy.y-9
        );
    }

    if(enemy.type==="jumper"){

        ctx.font="12px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "⬆",
            enemy.x+17,
            enemy.y-9
        );
    }

    ctx.fillStyle="#e2e8f0";
    ctx.font="10px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        enemy.name,
        enemy.x+17,
        enemy.y-22
    );

    ctx.textAlign="left";
}


/* =========================================================
   FILAMENT DRAW
========================================================= */

function drawFilament(item){

    ctx.shadowColor="#60a5fa";
    ctx.shadowBlur=10;

    ctx.strokeStyle="#60a5fa";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        item.r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.strokeStyle="#dbeafe";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        4,
        0,
        Math.PI*2
    );

    ctx.stroke();
}


/* =========================================================
   POWERUP ORB DRAW
   MAKES THEM STICK OUT
========================================================= */

function drawPowerup(item){

    const pulse=
        1+
        Math.sin(item.pulse)*.13;

    const cx=
        item.x+item.w/2;

    const cy=
        item.y+item.h/2;

    const color=
        item.type==="fireball"
        ?" #ef4444"
        :"#a855f7";

    const glow=
        item.type==="fireball"
        ?"rgba(239,68,68,.8)"
        :"rgba(168,85,247,.8)";

    /* OUTER GLOW */

    ctx.save();

    ctx.shadowColor=glow;
    ctx.shadowBlur=30;

    ctx.fillStyle=
        item.type==="fireball"
        ?"rgba(239,68,68,.25)"
        :"rgba(168,85,247,.25)";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        30*pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* ORB */

    ctx.fillStyle=
        item.type==="fireball"
        ?" #ef4444"
        :"#a855f7";

    ctx.fillStyle=
        item.type==="fireball"
        ?"#ef4444"
        :"#a855f7";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        17*pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /* WHITE CENTER */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        cx-5,
        cy-5,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* ICON */

    ctx.font="bold 20px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        item.type==="fireball"
        ?"🔥"
        :"🪽",
        cx,
        cy+7
    );

    ctx.textAlign="left";

    /* LABEL */

    ctx.fillStyle="white";
    ctx.font="bold 11px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        item.type==="fireball"
        ?"FIREBALL"
        :"EXTRA JUMP",
        cx,
        item.y-10
    );

    ctx.textAlign="left";

    ctx.restore();
}


/* =========================================================
   FIREBALL DRAW
========================================================= */

function drawFireball(fire){

    ctx.save();

    ctx.translate(
        fire.x+8,
        fire.y+8
    );

    ctx.rotate(
        fire.rotation
    );

    ctx.shadowColor="#f97316";
    ctx.shadowBlur=15;

    ctx.fillStyle="#ef4444";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.restore();
}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(player.invincible/6)%2===0
    ){
        return;
    }

    const x=player.x;
    const y=player.y;

    const width=
        player.big
        ?36
        :30;

    const height=
        player.big
        ?62
        :52;

    let bodyColor="#60a5fa";

    const skinColors={

        default:"#60a5fa",
        red:"#ef4444",
        green:"#22c55e",
        purple:"#a855f7",
        gold:"#facc15",
        cyan:"#22d3ee",
        orange:"#f97316"

    };

    bodyColor=
        skinColors[
            game.currentSkin
        ] ||
        "#60a5fa";

    if(game.extraJump){

        ctx.shadowColor="#c084fc";
        ctx.shadowBlur=15;

    }

    if(game.fireball){

        ctx.shadowColor="#f97316";
        ctx.shadowBlur=18;

    }

    /* BODY */

    ctx.fillStyle=bodyColor;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y+15,
        width,
        height-15,
        7
    );

    ctx.fill();

    /* HEAD */

    ctx.fillStyle="#f8fafc";

    ctx.beginPath();

    ctx.arc(
        x+width/2,
        y+10,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* VISOR */

    ctx.fillStyle="#0f172a";

    ctx.fillRect(
        x+5,
        y+5,
        width-10,
        7
    );

    /* BACKPACK */

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.facing===1
        ?x-5
        :x+width,
        y+22,
        7,
        22
    );

    /* LEGS */

    ctx.strokeStyle="#e2e8f0";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        x+9,
        y+height-3
    );

    ctx.lineTo(
        x+5,
        y+height+7
    );

    ctx.moveTo(
        x+width-9,
        y+height-3
    );

    ctx.lineTo(
        x+width-5,
        y+height+7
    );

    ctx.stroke();

    ctx.shadowBlur=0;
}


/* =========================================================
   FINISH PRINTER
========================================================= */

function drawFinish(){

    const x=world.finishX;

    ctx.fillStyle="#1e293b";

    ctx.fillRect(
        x+45,
        350,
        120,
        100
    );

    ctx.fillStyle="#475569";

    ctx.fillRect(
        x+60,
        320,
        90,
        35
    );

    ctx.fillStyle="#60a5fa";

    ctx.fillRect(
        x+75,
        330,
        60,
        8
    );

    ctx.strokeStyle="#a78bfa";
    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
        x+105,
        355
    );

    ctx.lineTo(
        x+105,
        410
    );

    ctx.stroke();

    /* FLAG */

    ctx.fillStyle="#e2e8f0";

    ctx.fillRect(
        x,
        190,
        8,
        260
    );

    ctx.fillStyle="#a78bfa";

    ctx.beginPath();

    ctx.moveTo(
        x+8,
        200
    );

    ctx.lineTo(
        x+105,
        230
    );

    ctx.lineTo(
        x+8,
        260
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="bold 14px Arial";

    ctx.fillText(
        "PRINT!",
        x+30,
        235
    );
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBackground();

    ctx.save();

    ctx.translate(
        -world.cameraX,
        0
    );

    for(const p of platforms){
        drawPlatform(p);
    }

    for(const s of spikes){
        drawSpike(s);
    }

    for(const b of blocks){
        drawBlock(b);
    }

    for(const item of collectibles){

        if(!item.collected){
            drawFilament(item);
        }
    }

    for(const item of powerups){

        if(!item.collected){
            drawPowerup(item);
        }
    }

    for(const enemy of enemies){
        drawEnemy(enemy);
    }

    for(const fire of fireballs){
        drawFireball(fire);
    }

    drawFinish();

    drawPlayer();

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/40
            );

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;

    for(const t of texts){

        ctx.globalAlpha=
            Math.min(
                1,
                t.life/20
            );

        ctx.fillStyle=t.color;

        ctx.font=
            `bold ${t.size}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.globalAlpha=1;
    ctx.textAlign="left";

    ctx.restore();

    /* POWER SCREEN EFFECT */

    if(game.fireball){

        ctx.fillStyle=
            "rgba(249,115,22,.025)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }

    if(game.extraJump){

        ctx.fillStyle=
            "rgba(168,85,247,.025)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }
}

/* =========================================================
   BUY SKIN
========================================================= */

function buySkin(id){

    if(
        game.ownedSkins.includes(id)
    ){
        return;
    }

    if(game.filament<2000){

        beep(100,.15,"sawtooth");

        return;
    }

    game.filament-=2000;

    game.ownedSkins.push(id);

    game.currentSkin=id;

    beep(800,.12);

    openShop();
}

   EQUIP SKIN
========================================================= */

function equipSkin(id){

    if(
        !game.ownedSkins.includes(id)
    ){
        return;
    }

    game.currentSkin=id;

    beep(600,.08);

    openShop();
}

        <br><br>

        <small>
            Skins cost 2,000 Filament each.
        </small>

        <div class="shopGrid">

            ${skins.map(skin=>{

                const owned=
                    game.ownedSkins.includes(
                        skin.id
                    );

                const selected=
                    game.currentSkin===
                    skin.id;

                return `

                    <div class="skinCard">

                        <div
                            class="skinPreview"
                            style="
                                background:${skin.color};
                                box-shadow:
                                0 0 20px
                                ${skin.color};
                            "
                        >
                            ${skin.emoji}
                        </div>

                        <strong>
                            ${skin.name}
                        </strong>

                        <br><br>

                        ${
                            selected
                            ?`
                                <button disabled>
                                    EQUIPPED
                                </button>
                            `
                            :
                            owned
                            ?`
                                <button
                                    onclick="
                                    equipBetween('${skin.id}',${nextLevel})
                                    "
                                >
                                    EQUIP
                                </button>
                            `
                            :
                            `
                                <button
                                    ${
                                        game.filament<2000
                                        ?"disabled"
                                        :""
                                    }
                                    onclick="
                                    buyBetween('${skin.id}',${nextLevel})
                                    "
                                >
                                    2,000 🧵
                                </button>
                            `
                        }

                    </div>

                `;

            }).join("")}

        </div>

        <br>

        <button
            class="mainButton secondaryButton"
            onclick="
                showLevelPreview(${nextLevel})
            "
        >
            ← BACK TO LEVEL
        </button>
    `;

    startButton.classList.add("hidden");
}


/* =========================================================
   SHOP BETWEEN BUY
========================================================= */

function buyBetween(id,nextLevel){

    if(
        game.ownedSkins.includes(id)
    ){
        return;
    }

    if(game.filament<2000){

        beep(100,.15);

        return;
    }

    game.filament-=2000;

    game.ownedSkins.push(id);

    game.currentSkin=id;

    beep(800,.12);

    openShopFromBetweenLevels(nextLevel);
}


function equipBetween(id,nextLevel){

    if(
        !game.ownedSkins.includes(id)
    ){
        return;
    }

    game.currentSkin=id;

    beep(600,.08);

    openShopFromBetweenLevels(nextLevel);
}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(){

    if(
        game.started &&
        !game.over &&
        !world.finished
    ){

        updatePlayer();
        updateCheckpoint();
        updateEnemies();
        updateFireballs();
        updateBlocks();
        updateCollectibles();
        updatePowerups();
        checkFinish();

    }

    updateParticles();
    updateTexts();
    updateHUD();
}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   FIX LEVEL COMPLETE FLOW
========================================================= */

function goToNextLevel(){

    const next=game.level+1;

    if(next>game.totalLevels){

        gameWon();
        return;
    }

    showLevelPreview(next);
}


/* =========================================================
   OVERRIDE FINISH FUNCTION
========================================================= */

function handleLevelFinished(){

    if(game.level<game.totalLevels){

        showBetweenLevelMenu();

    }else{

        gameWon();

    }
}


/* Replace finishLevel behavior */

finishLevel=function(){

    if(world.finished)return;

    world.finished=true;

    game.score+=2500*game.level;

    handleLevelFinished();
};


/* =========================================================
   INITIALIZE
========================================================= */

createLevel(1);

updateHUD();

showWelcome();

loop();

</script>

</body>
</html>
