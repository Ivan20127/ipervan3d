=<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Print Wars</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050b16;

    user-select:none;
}

canvas{
    display:block;
    margin:auto;

}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    z-index:20;
    background:rgba(2,6,23,.86);

    border-radius:14px;

.controlGroup{

.touchButton{

    height:64px;

    border:2px solid rgba(255,255,255,.25);
    background:rgba(15,23,42,.82);

    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;

.touchButton:active{

    transform:scale(.94);
}

#message{
    position:fixed;
    z-index:50;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(94%,620px);
    max-height:92vh;
    overflow:auto;
    padding:28px;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    border:2px solid #475569;
    border-radius:22px;
    text-align:center;
    box-shadow:0 25px 100px rgba(0,0,0,.75);
}

#message h1{
    margin:0 0 15px;
    font-size:36px;
    color:#60a5fa;
}

#messageText{
    line-height:1.6;

}

button.menuButton{
    margin:7px;
    padding:12px 24px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.menuButton:hover{
    background:#3b82f6;
}

button.green{
    background:#16a34a;
}

button.green:hover{
    background:#22c55e;
}

button.purple{
    background:#7c3aed;
}

button.red{
    background:#dc2626;
}

.hidden{
    display:none!important;
}

.powerPreview{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:18px 0;
}

.powerCard{
    width:150px;
    padding:14px 10px;

    background:#172033;
    border:2px solid #334155;
}

.powerIcon{
    font-size:36px;
    margin-bottom:5px;
}

.powerName{
    color:#facc15;
    font-weight:bold;
}

.powerDescription{
    color:#cbd5e1;
    font-size:12px;
    margin-top:5px;
}

.shopGrid{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

}

.skinCard{
    width:145px;
    padding:12px;
    background:#172033;
    border:2px solid #334155;
    border-radius:14px;
}

.skinPreview{
    width:45px;
    height:55px;

    border-radius:12px;
}

.coinText{
    color:#facc15;
    font-weight:bold;
}

.bossBar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,65%);
    z-index:19;
    display:none;
    text-align:center;
}

.bossTitle{
    color:#fca5a5;
    font-weight:bold;
    text-shadow:0 2px 5px black;
    margin-bottom:4px;
}

.bossOuter{
    height:18px;
    background:#450a0a;
    border:2px solid #fecaca;
    border-radius:12px;
    overflow:hidden;
}

#bossHealth{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ef4444,#f97316);
}

@media(max-width:700px){

    #ui{
        font-size:11px;
        padding:8px 10px;
        min-width:150px;
    }

    .touchButton{
        width:58px;
        height:58px;
    }

    #message h1{
        font-size:28px;
    }

    .powerCard{
        width:125px;
    }
}
</style>
</head>

<body>

<div id="ui">
    <div>🖨️ <strong>PRINT WARS</strong></div>
    <div>Level: <span id="level">1-1</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>🧵 Filament: <span id="coins">0</span></div>
    <div>❤️ Lives: <span id="lives">♥ ♥ ♥</span></div>
    <div>⚡ Power: <span id="power" class="power">Normal</span></div>
    <div>🎨 Skin: <span id="skinName">Blue</span></div>
</div>

<div id="bossBar" class="bossBar">
    <div class="bossTitle">🔥 MEGA PRINTING MACHINE 🔥</div>
    <div class="bossOuter">
        <div id="bossHealth"></div>
    </div>
</div>

<canvas id="game" width="960" height="540"></canvas>

<div id="mobileControls">

    <div class="controlGroup">
        <button class="touchButton" data-key="ArrowLeft">◀</button>
        <button class="touchButton" data-key="ArrowRight">▶</button>
    </div>

    <div class="controlGroup">
        <button class="touchButton" data-key=" ">▲</button>
        <button class="touchButton" data-key="f">🔥</button>
        <button class="touchButton" data-key="x">⚡</button>
    </div>

</div>

<div id="message">

    <h1>🖨️ PRINT WARS</h1>

    <div id="messageText">
        Welcome to the secret 3D-printing factory!
        <br><br>
        Run, jump, collect filament, grab power-up orbs
        and defeat the rogue products.
    </div>

    <button id="startButton" class="menuButton">
        START GAME
    </button>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const WIDTH=960;
const HEIGHT=540;


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function startAudio(){

    if(!audioCtx){
        audioCtx=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function beep(freq=440,duration=.08,type="square",volume=.04){

    if(!audioCtx)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration);
}


/* =========================================================
   INPUT
========================================================= */

const keys={};

window.addEventListener("keydown",e=>{

    if([
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        " ",
        "x",
        "X",
        "f",
        "F"
    ].includes(e.key)){
        e.preventDefault();
    }

    keys[e.key]=true;

    if(
        (e.key===" " || e.key==="ArrowUp") &&
        game.playing
    ){
        jump();
    }

    if(
        (e.key==="x" || e.key==="X") &&
        game.playing
    ){
        dash();
    }

    if(
        (e.key==="f" || e.key==="F") &&
        game.playing
    ){
        useFireball();
    }

});

window.addEventListener("keyup",e=>{
    keys[e.key]=false;
});


document.querySelectorAll(".touchButton").forEach(button=>{

    const key=button.dataset.key;

    button.addEventListener("pointerdown",e=>{

        e.preventDefault();

        keys[key]=true;

        if(key===" ")jump();
        if(key==="x")dash();
        if(key==="f")useFireball();

    });

    button.addEventListener("pointerup",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    button.addEventListener("pointercancel",()=>{
        keys[key]=false;
    });

});


/* =========================================================
   GAME STATE
========================================================= */

const game={

    started:false,
    playing:false,
    over:false,

    level:1,
    totalLevels:5,

    score:0,
    filament:0,

    enemiesDefeated:0,

    skin:"blue",

    ownedSkins:["blue"],

    levelPowers:[],

    activePowers:[],

    doubleCoins:false,

    boss:null

};


/* =========================================================
   WORLD
========================================================= */

const world={

    width:5000,
    cameraX:0,
    groundY:450,
    finishX:4800,
    finished:false

};


/* =========================================================
   PLAYER
========================================================= */

const player={

    x:100,
    y:350,

    w:30,
    h:52,

    vx:0,
    vy:0,

    maxSpeed:6,
    acceleration:.65,
    friction:.78,

    jumpPower:13,

    onGround:false,

    jumpsUsed:0,

    facing:1,

    lives:3,

    invincible:0,

    dashCooldown:0,
    dashTimer:0,

    fireCooldown:0,

    checkpoint:100

};


/* =========================================================
   ARRAYS
========================================================= */

let platforms=[];
let spikes=[];
let enemies=[];
let collectibles=[];
let powerups=[];
let fireballs=[];
let particles=[];
let texts=[];


/* =========================================================
   SKINS
========================================================= */

const skins={

    blue:{
        name:"Blue",
        color:"#60a5fa",
        price:0
    },

    red:{
        name:"Red",
        color:"#ef4444",
        price:2000
    },

    purple:{
        name:"Purple",
        color:"#a855f7",
        price:2000
    },

    green:{
        name:"Green",
        color:"#22c55e",
        price:2000
    },

    gold:{
        name:"Gold",
        color:"#facc15",
        price:2000
    },

    cyan:{
        name:"Cyan",
        color:"#22d3ee",
        price:2000
    },

    orange:{
        name:"Orange",
        color:"#f97316",
        price:2000
    },

    pink:{
        name:"Pink",
        color:"#ec4899",
        price:2000
    }

};


/* =========================================================
   POWERUPS
========================================================= */

const POWER_INFO={

    fireball:{
        icon:"🔥",
        name:"Fireball",
        description:"Press F or 🔥 to shoot a fireball."
    },

    extraJump:{
        icon:"🪽",
        name:"Extra Jump",
        description:"Jump twice before landing."
    },

    shield:{
        icon:"🛡️",
        name:"Shield",
        description:"Blocks one hit from an enemy or hazard."
    },

    speed:{
        icon:"⚡",
        name:"Speed Boost",
        description:"Run much faster for a limited time."
    },

    magnet:{
        icon:"🧲",
        name:"Coin Magnet",
        description:"Nearby filament automatically flies to you."
    },

    doubleCoins:{
        icon:"💰",
        name:"Double Filament",
        description:"Every filament pickup gives double coins."
    },

    dash:{
        icon:"💨",
        name:"Mega Dash",
        description:"Press X to dash farther and faster."
    },

    star:{
        icon:"⭐",
        name:"Star Power",
        description:"Become temporarily invincible."
    }

};


/* =========================================================
   LEVELS
========================================================= */

const levelData=[

    {
        name:"Factory Floor",
        theme:"factory",
        width:5000,
        difficulty:1,
        powers:["extraJump","fireball","shield"]
    },

    {
        name:"Filament Warehouse",
        theme:"warehouse",
        width:5500,
        difficulty:2,
        powers:["speed","magnet","dash"]
    },

    {
        name:"3D Print Canyon",
        theme:"canyon",
        width:6000,
        difficulty:3,
        powers:["star","fireball","doubleCoins"]
    },

    {
        name:"Prototype Lab",
        theme:"lab",
        width:6500,
        difficulty:4,
        powers:["shield","speed","extraJump"]
    },

    {
        name:"Mega Printer",
        theme:"mega",
        width:7000,
        difficulty:5,
        powers:["fireball","star","dash"]
    }

];


/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(min,max){
    return Math.random()*(max-min)+min;
}


/* =========================================================
   COLLISION
========================================================= */

function overlap(a,b){

    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );

}


/* =========================================================
   CREATE LEVEL
========================================================= */

function createLevel(number){

    const data=levelData[number-1];

    platforms=[];
    spikes=[];
    enemies=[];
    collectibles=[];
    powerups=[];
    fireballs=[];
    particles=[];
    texts=[];

    world.width=data.width;
    world.finishX=data.width-160;
    world.finished=false;
    world.cameraX=0;

    game.levelPowers=[...data.powers];
    game.activePowers=[];
    game.doubleCoins=false;

    player.x=100;
    player.y=350;
    player.vx=0;
    player.vy=0;
    player.invincible=120;
    player.dashCooldown=0;
    player.fireCooldown=0;
    player.checkpoint=100;
    player.jumpsUsed=0;

    /* ground sections */

    const gapSize=
        Math.max(100,70+data.difficulty*20);

    let x=0;

    while(x<data.width){

        const groundWidth=
            600+Math.random()*250;

        addPlatform(
            x,
            450,
            groundWidth,
            100
        );

        x+=groundWidth+gapSize;

    }

    /* platforms */

    for(
        let px=300;
        px<data.width-250;
        px+=
            230+
            Math.random()*130
    ){

        const py=
            260+
            Math.random()*110;

        const pw=
            120+
            Math.random()*80;

        addPlatform(
            px,
            py,
            pw,
            25
        );

    }

    /* spikes */

    const spikeCount=
        7+
        data.difficulty*4;

    for(let i=0;i<spikeCount;i++){

        const sx=
            500+
            i*
            ((data.width-900)/spikeCount);

        addSpike(
            sx,
            425,
            60+
            Math.random()*50
        );

    }

    /* filament */

    for(
        let fx=150;
        fx<data.width-180;
        fx+=150
    ){

        addFilament(
            fx,
            390-
            Math.random()*70
        );

    }

    /* platform filament */

    for(const p of platforms){

        if(p.y<440){

            for(
                let fx=p.x+20;
                fx<p.x+p.w-10;
                fx+=45
            ){

                addFilament(
                    fx,
                    p.y-25
                );

            }

        }

    }

    /* enemies */

    const enemyCount=
        7+
        data.difficulty*5;

    for(let i=0;i<enemyCount;i++){

        const ex=
            450+
            i*
            ((data.width-700)/enemyCount);

        let type="patrol";

        if(data.difficulty>=2 && i%3===0)
            type="jumper";

        if(data.difficulty>=3 && i%4===0)
            type="fire";

        addEnemy(ex,type);

    }

    /* POWER ORBS */

    /*
       EXACTLY THREE POWERUPS PER LEVEL.
    */

    const orbPositions=[
        Math.floor(data.width*.25),
        Math.floor(data.width*.50),
        Math.floor(data.width*.75)
    ];

    for(let i=0;i<3;i++){

        const px=orbPositions[i];

        const power=data.powers[i];

        addPowerup(
            px,
            330,
            power
        );

    }

    /* BOSS */

    if(number===5){

        createBoss();

    }

}


/* =========================================================
   PLATFORM
========================================================= */

function addPlatform(x,y,w,h){

    platforms.push({
        x,y,w,h
    });

}


/* =========================================================
   SPIKES
========================================================= */

function addSpike(x,y,w){

    spikes.push({
        x,
        y,
        w,
        h:25
    });

}


/* =========================================================
   FILAMENT
========================================================= */

function addFilament(x,y){

    collectibles.push({

        x,
        y,
        r:9,
        collected:false

    });

}


/* =========================================================
   POWER ORB
========================================================= */

function addPowerup(x,y,type){

    powerups.push({

        x,
        y,
        w:36,
        h:36,
        type,
        collected:false,
        pulse:Math.random()*Math.PI*2

    });

}


/* =========================================================
   ENEMY
========================================================= */

function addEnemy(x,type){

    const difficulty=
        levelData[game.level-1].difficulty;

    enemies.push({

        x,
        y:390,

        w:34,
        h:34,

        vx:0,
        vy:0,

        direction:
            Math.random()>.5?1:-1,

        speed:
            1+
            difficulty*.22,

        type,

        alive:true,

        onGround:false,

        jumpTimer:
            70+Math.random()*80,

        fireTimer:
            80+Math.random()*80,

        name:
            [
                "Gear",
                "Dragon",
                "Pig",
                "Shark",
                "Bot",
                "Cactus",
                "Knight"
            ][
                Math.floor(Math.random()*7)
            ]

    });

}


/* =========================================================
   BOSS
========================================================= */

function createBoss(){

    game.boss={

        x:world.width-600,
        y:300,

        w:110,
        h:120,

        health:100,
        maxHealth:100,

        direction:-1,

        fireTimer:100,

        active:false

    };

}


/* =========================================================
   START LEVEL SCREEN
========================================================= */

function showLevelScreen(){

    game.playing=false;

    const data=levelData[game.level-1];

    const cards=game.levelPowers.map(type=>{

        const p=POWER_INFO[type];

        return `
            <div class="powerCard">
                <div class="powerIcon">${p.icon}</div>
                <div class="powerName">${p.name}</div>
                <div class="powerDescription">
                    ${p.description}
                </div>
            </div>
        `;

    }).join("");

    let bossText="";

    if(game.level===5){

        bossText=`
            <br>
            <strong style="color:#f87171;font-size:20px">
                ⚠️ BOSS LEVEL ⚠️
            </strong>
            <br>
            Defeat the Mega Printing Machine!
            <br>
            It has a health bar and shoots fireballs.
        `;

    }

    messageText.innerHTML=`

        <strong style="color:#60a5fa;font-size:27px">
            LEVEL ${game.level}
        </strong>

        <br>

        <strong style="font-size:21px">
            ${data.name}
        </strong>

        <br><br>

        Difficulty:
        <strong style="color:#facc15">
            ${"★".repeat(data.difficulty)}
        </strong>

        <br><br>

        <strong style="color:#c084fc">
            POWER-UPS IN THIS LEVEL
        </strong>

        <div class="powerPreview">
            ${cards}
        </div>

        ${bossText}

        <br>

        <strong>
            Your level will NOT start until you press
            START LEVEL.
        </strong>
    `;

    startButton.textContent="START LEVEL";
    startButton.className="menuButton green";

    message.classList.remove("hidden");

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!game.playing)return;

    const hasExtra=
        game.activePowers.includes("extraJump");

    const maxJumps=
        hasExtra?2:1;

    if(player.jumpsUsed<maxJumps){

        player.vy=-player.jumpPower;

        player.onGround=false;

        player.jumpsUsed++;

        beep(520,.07);

    }

}


/* =========================================================
   DASH
========================================================= */

function dash(){

    if(!game.playing)return;

    if(!game.activePowers.includes("dash"))return;

    if(player.dashCooldown>0)return;

    player.dashTimer=15;

    player.dashCooldown=60;

    player.vx=
        player.facing*
        15;

    burst(
        player.x,
        player.y+25,
        "#22d3ee",
        15
    );

    beep(180,.1,"sawtooth");

}


/* =========================================================
   FIREBALL POWER
========================================================= */

function useFireball(){

    if(!game.playing)return;

    if(!game.activePowers.includes("fireball"))
        return;

    if(player.fireCooldown>0)
        return;

    fireballs.push({

        x:
            player.x+
            (player.facing===1?player.w:-18),

        y:
            player.y+18,

        w:18,
        h:18,

        vx:
            player.facing*9,

        vy:0,

        life:120,

        friendly:true

    });

    player.fireCooldown=25;

    beep(700,.08,"sawtooth");

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    if(keys["ArrowLeft"]){

        player.vx-=player.acceleration;
        player.facing=-1;

    }

    if(keys["ArrowRight"]){

        player.vx+=player.acceleration;
        player.facing=1;

    }

    if(
        !keys["ArrowLeft"] &&
        !keys["ArrowRight"]
    ){

        player.vx*=player.friction;

    }

    let speedLimit=player.maxSpeed;

    if(game.activePowers.includes("speed")){
        speedLimit=10;
    }

    player.vx=
        Math.max(
            -speedLimit,
            Math.min(speedLimit,player.vx)
        );

    if(player.dashTimer>0){

        player.dashTimer--;
        player.vx*=.97;

    }

    if(player.dashCooldown>0)
        player.dashCooldown--;

    if(player.fireCooldown>0)
        player.fireCooldown--;

    player.vy+=.6;

    const oldBottom=
        player.y+player.h;

    player.x+=player.vx;
    player.y+=player.vy;

    player.onGround=false;

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            oldBottom<=p.y &&
            player.y+player.h>=p.y &&
            player.vy>=0
        ){

            player.y=p.y-player.h;
            player.vy=0;
            player.onGround=true;
            player.jumpsUsed=0;

        }

    }

    player.x=
        Math.max(
            0,
            Math.min(
                world.width-player.w,
                player.x
            )
        );

    /* SPIKES */

    for(const spike of spikes){

        if(
            overlap(
                player,
                spike
            )
        ){

            loseLife();

        }

    }

    /* FALL */

    if(player.y>600){

        loseLife();

    }

    /* CAMERA */

    world.cameraX=
        player.x-300;

    world.cameraX=
        Math.max(
            0,
            Math.min(
                world.width-WIDTH,
                world.cameraX
            )
        );

    if(player.invincible>0)
        player.invincible--;

    /* MAGNET */

    if(game.activePowers.includes("magnet")){

        for(const item of collectibles){

            if(item.collected)continue;

            const dx=player.x-item.x;
            const dy=player.y-item.y;

            const distance=
                Math.sqrt(dx*dx+dy*dy);

            if(distance<170){

                item.x+=dx*.08;
                item.y+=dy*.08;

            }

        }

    }

}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        enemy.vy+=.55;

        const oldBottom=
            enemy.y+enemy.h;

        enemy.y+=enemy.vy;

        enemy.onGround=false;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                oldBottom<=p.y &&
                enemy.y+enemy.h>=p.y &&
                enemy.vy>=0
            ){

                enemy.y=
                    p.y-enemy.h;

                enemy.vy=0;
                enemy.onGround=true;

            }

        }

        enemy.x+=
            enemy.direction*
            enemy.speed;

        let support=null;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                Math.abs(
                    enemy.y+enemy.h-p.y
                )<8
            ){

                support=p;
                break;

            }

        }

        if(support){

            const left=support.x;
            const right=
                support.x+
                support.w-
                enemy.w;

            if(enemy.x<=left){

                enemy.x=left;
                enemy.direction=1;

            }

            if(enemy.x>=right){

                enemy.x=right;
                enemy.direction=-1;

            }

        }

        if(enemy.type==="jumper"){

            enemy.jumpTimer--;

            if(
                enemy.jumpTimer<=0 &&
                enemy.onGround
            ){

                enemy.direction=
                    player.x>enemy.x?1:-1;

                enemy.vy=
                    -10-
                    game.level*.3;

                enemy.jumpTimer=
                    80+
                    Math.random()*70;

            }

        }

        if(enemy.type==="fire"){

            enemy.fireTimer--;

            if(enemy.fireTimer<=0){

                enemyFire(enemy);

                enemy.fireTimer=
                    90+
                    Math.random()*90;

            }

        }

        if(
            overlap(player,enemy)
        ){

            if(
                player.vy>0 &&
                player.y+player.h-enemy.y<20
            ){

                killEnemy(enemy);

                player.vy=-10;

            }
            else{

                damagePlayer();

            }

        }

    }

    enemies=
        enemies.filter(e=>e.alive);

}


/* =========================================================
   ENEMY FIRE
========================================================= */

function enemyFire(enemy){

    const direction=
        player.x>enemy.x?1:-1;

    fireballs.push({

        x:enemy.x+17,
        y:enemy.y+8,

        w:18,
        h:18,

        vx:direction*5,
        vy:-1,

        life:180,

        friendly:false

    });

}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy){

    if(!enemy.alive)return;

    enemy.alive=false;

    game.enemiesDefeated++;

    game.score+=100;

    burst(
        enemy.x+17,
        enemy.y+17,
        "#facc15",
        14
    );

    addText(
        enemy.x+17,
        enemy.y-10,
        "+100",
        "#facc15",
        15
    );

    beep(720,.08);

}


/* =========================================================
   FIREBALLS
========================================================= */

function updateFireballs(){

    for(const fire of fireballs){

        fire.x+=fire.vx;
        fire.y+=fire.vy;

        fire.vy+=.05;

        fire.life--;

        if(fire.friendly){

            /* HIT ENEMIES */

            for(const enemy of enemies){

                if(
                    enemy.alive &&
                    overlap(fire,enemy)
                ){

                    fire.life=0;
                    killEnemy(enemy);

                }

            }

            /* HIT BOSS */

            if(
                game.boss &&
                game.boss.active &&
                overlap(fire,game.boss)
            ){

                fire.life=0;

                game.boss.health-=4;

                burst(
                    fire.x,
                    fire.y,
                    "#f97316",
                    8
                );

                beep(300,.04);

                if(game.boss.health<=0){

                    game.boss.health=0;
                    bossDefeated();

                }

            }

        }
        else{

            if(
                overlap(player,fire)
            ){

                fire.life=0;

                damagePlayer();

            }

        }

        for(const p of platforms){

            if(overlap(fire,p)){

                fire.life=0;

            }

        }

    }

    fireballs=
        fireballs.filter(
            f=>f.life>0
        );

}


/* =========================================================
   POWERUPS
========================================================= */

function updatePowerups(){

    for(const orb of powerups){

        if(orb.collected)
            continue;

        orb.pulse+=.08;

        if(
            overlap(player,orb)
        ){

            orb.collected=true;

            activatePower(orb.type);

        }

    }

}


/* =========================================================
   ACTIVATE POWER
========================================================= */

function activatePower(type){

    if(
        !game.activePowers.includes(type)
    ){

        game.activePowers.push(type);

    }

    addText(
        player.x,
        player.y-25,
        POWER_INFO[type].icon+
        " "+
        POWER_INFO[type].name,
        "#facc15",
        20
    );

    burst(
        player.x+15,
        player.y+20,
        "#c084fc",
        20
    );

    beep(900,.12);

    if(type==="doubleCoins"){

        game.doubleCoins=true;

    }

    if(type==="shield"){

        player.invincible=60;

    }

}


/* =========================================================
   COLLECTIBLES
========================================================= */

function updateCollectibles(){

    for(const item of collectibles){

        if(item.collected)
            continue;

        const box={
            x:item.x-10,
            y:item.y-10,
            w:20,
            h:20
        };

        if(overlap(player,box)){

            item.collected=true;

            const amount=
                game.doubleCoins?2:1;

            game.filament+=amount;

            game.score+=50*amount;

            addText(
                item.x,
                item.y-15,
                "+"+amount,
                "#60a5fa"
            );

            beep(850,.05,"sine");

        }

    }

}


/* =========================================================
   CHECKPOINT
========================================================= */

function updateCheckpoint(){

    const checkpoint=
        Math.floor(player.x/1000)*1000+100;

    if(
        checkpoint>
        player.checkpoint &&
        checkpoint<
        world.width-200
    ){

        player.checkpoint=checkpoint;

        addText(
            checkpoint,
            300,
            "CHECKPOINT!",
            "#4ade80",
            16
        );

        beep(600,.08);

    }

}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(){

    if(player.invincible>0)
        return;

    if(
        game.activePowers.includes("shield")
    ){

        game.activePowers=
            game.activePowers.filter(
                p=>p!=="shield"
            );

        player.invincible=120;

        addText(
            player.x,
            player.y-20,
            "SHIELD BLOCKED!",
            "#60a5fa",
            18
        );

        beep(500,.1);

        return;

    }

    loseLife();

}


/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(){

    if(player.invincible>0)
        return;

    player.lives--;

    player.invincible=120;

    game.score=
        Math.max(
            0,
            game.score-200
        );

    player.x=player.checkpoint;
    player.y=300;
    player.vx=0;
    player.vy=-8;
    player.jumpsUsed=0;

    beep(120,.2,"sawtooth");

    if(player.lives<=0){

        gameOver();

    }

}


/* =========================================================
   BOSS UPDATE
========================================================= */

function updateBoss(){

    if(!game.boss)
        return;

    const boss=game.boss;

    if(
        player.x>
        world.width-1200
    ){

        boss.active=true;

    }

    if(!boss.active)
        return;

    boss.fireTimer--;

    if(boss.fireTimer<=0){

        bossFire();

        boss.fireTimer=
            65+
            Math.random()*60;

    }

    boss.x+=boss.direction*1.3;

    if(
        boss.x<
        world.width-750
    ){

        boss.direction=1;

    }

    if(
        boss.x>
        world.width-250
    ){

        boss.direction=-1;

    }

}


/* =========================================================
   BOSS FIRE
========================================================= */

function bossFire(){

    const boss=game.boss;

    const direction=
        player.x>boss.x?1:-1;

    fireballs.push({

        x:boss.x+boss.w/2,
        y:boss.y+45,

        w:26,
        h:26,

        vx:direction*6,
        vy:-2,

        life:220,

        friendly:false

    });

    fireballs.push({

        x:boss.x+boss.w/2,
        y:boss.y+45,

        w:22,
        h:22,

        vx:direction*5,
        vy:-4,

        life:220,

        friendly:false

    });

}


/* =========================================================
   BOSS DEFEATED
========================================================= */

function bossDefeated(){

    if(world.finished)
        return;

    world.finished=true;

    game.score+=10000;

    burst(
        game.boss.x+50,
        game.boss.y+60,
        "#facc15",
        80
    );

    setTimeout(()=>{
        gameWon();
    },800);

}


/* =========================================================
   FINISH
========================================================= */

function checkFinish(){

    if(game.level===5){

        if(
            game.boss &&
            game.boss.health>0
        ){

            return;

        }

    }

    if(
        player.x>=world.finishX
    ){

        finishLevel();

    }

}


/* =========================================================
   FINISH LEVEL
========================================================= */

function finishLevel(){

    if(world.finished)
        return;

    world.finished=true;

    game.score+=
        2500*
        game.level;

    game.playing=false;

    if(
        game.level<
        game.totalLevels
    ){

        showLevelComplete();

    }
    else{

        gameWon();

    }

}

/* =========================================================
   SHOP
========================================================= */

function showShop(){

    game.playing=false;

    let cards="";

    for(const id in skins){

        const skin=skins[id];

        const owned=
            game.ownedSkins.includes(id);

        const selected=
            game.skin===id;

        let button="";

        if(selected){

            button=`
                <button
                    class="menuButton"
                    disabled
                >
                    EQUIPPED
                </button>
            `;

        }
        else if(owned){

            button=`
                <button
                    class="menuButton"
                    onclick="equipSkin('${id}')"
                >
                    EQUIP
                </button>
            `;

        }
        else{

            button=`
                <button
                    class="menuButton green"
                    onclick="buySkin('${id}')"
                >
                    BUY 2,000 🧵
                </button>
            `;

        }

        cards+=`

            <div class="skinCard">

                <div
                    class="skinPreview"
                    style="background:${skin.color}"
                ></div>

                <strong>
                    ${skin.name}
                </strong>

                <br><br>

                ${button}

            </div>

        `;

    }

    messageText.innerHTML=`

        <strong
            style="
            color:#facc15;
            font-size:30px;
            "
        >
            🛒 PRINT SHOP
        </strong>

        <br><br>

        Your Filament:
        <strong
            style="
            color:#60a5fa;
            font-size:20px;
            "
        >
            ${game.filament} 🧵
        </strong>

        <div class="shopGrid">
            ${cards}
        </div>

        <br>

        <button
            class="menuButton purple"
            onclick="closeShop()"
        >
            ← BACK TO LEVEL
        </button>
    `;

    startButton.classList.add("hidden");

    message.classList.remove("hidden");

}


/* =========================================================
   BUY SKIN
========================================================= */

function buySkin(id){

    const skin=skins[id];

    if(game.ownedSkins.includes(id)){

        equipSkin(id);
        return;

    }

    if(game.filament<skin.price){

        beep(100,.2);

        alert(
            "You need 2,000 filament to buy this skin!"
        );

        return;

    }

    game.filament-=skin.price;

    game.ownedSkins.push(id);

    game.skin=id;

    beep(800,.1);

    showShop();

}


/* =========================================================
   EQUIP SKIN
========================================================= */

function equipSkin(id){

    if(!game.ownedSkins.includes(id))
        return;

    game.skin=id;

    beep(600,.08);

    showShop();

}


/* =========================================================
   CLOSE SHOP
========================================================= */

function closeShop(){

    startButton.classList.remove("hidden");

    showLevelScreen();

}


/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,color,amount=10){

    for(let i=0;i<amount;i++){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*8,

            vy:
                (Math.random()-.5)*8,

            size:
                2+
                Math.random()*4,

            color,

            life:
                25+
                Math.random()*30

        });

    }

}


function updateParticles(){

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.18;

        p.life--;

    }

    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =========================================================
   TEXT
========================================================= */

function addText(
    x,
    y,
    text,
    color="white",
    size=16
){

    texts.push({

        x,
        y,
        text,
        color,
        size,
        life:65

    });

}


function updateTexts(){

    for(const t of texts){

        t.y-=.6;
        t.life--;

    }

    texts=
        texts.filter(
            t=>t.life>0
        );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    let top="#071426";
    let bottom="#172554";

    const theme=
        levelData[game.level-1].theme;

    if(theme==="warehouse"){

        top="#111827";
        bottom="#312e81";

    }

    if(theme==="canyon"){

        top="#431407";
        bottom="#9a3412";

    }

    if(theme==="lab"){

        top="#06202f";
        bottom="#155e75";

    }

    if(theme==="mega"){

        top="#1e1b4b";
        bottom="#4c1d95";

    }

    const gradient=
        ctx.createLinearGradient(
            0,0,0,HEIGHT
        );

    gradient.addColorStop(0,top);
    gradient.addColorStop(1,bottom);

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,WIDTH,HEIGHT
    );

    for(let i=0;i<30;i++){

        const x=
            i*90-
            (world.cameraX*.15%90);

        const h=
            70+
            (i*47)%160;

        ctx.fillStyle=
            i%2
            ?"#0f1b2e"
            :"#142238";

        ctx.fillRect(
            x,
            450-h,
            70,
            h
        );

        ctx.fillStyle=
            i%3===0
            ?"#facc15"
            :"#38bdf8";

        for(
            let y=470-h;
            y<420;
            y+=25
        ){

            ctx.fillRect(
                x+12,
                y,
                7,
                9
            );

            ctx.fillRect(
                x+32,
                y,
                7,
                9
            );

            ctx.fillRect(
                x+52,
                y,
                7,
                9
            );

        }

    }

}


/* =========================================================
   PLATFORM DRAW
========================================================= */

function drawPlatform(p){

    ctx.fillStyle="#334155";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );

    ctx.fillStyle="#64748b";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        7
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.08)";

    ctx.lineWidth=2;

    for(
        let x=p.x+10;
        x<p.x+p.w;
        x+=15
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            p.y+10
        );

        ctx.lineTo(
            x,
            p.y+p.h
        );

        ctx.stroke();

    }

}


/* =========================================================
   SPIKE DRAW
========================================================= */

function drawSpike(s){

    const count=
        Math.max(
            1,
            Math.floor(s.w/18)
        );

    const sw=s.w/count;

    for(let i=0;i<count;i++){

        const x=
            s.x+i*sw;

        ctx.fillStyle="#e2e8f0";

        ctx.beginPath();

        ctx.moveTo(
            x,
            s.y+s.h
        );

        ctx.lineTo(
            x+sw/2,
            s.y
        );

        ctx.lineTo(
            x+sw,
            s.y+s.h
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =========================================================
   FILAMENT DRAW
========================================================= */

function drawFilament(item){

    ctx.strokeStyle="#60a5fa";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        item.r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.strokeStyle="#dbeafe";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        4,
        0,
        Math.PI*2
    );

    ctx.stroke();

}


/* =========================================================
   POWER ORB DRAW
========================================================= */

function drawPowerOrb(orb){

    const info=
        POWER_INFO[orb.type];

    const pulse=
        Math.sin(orb.pulse)*4;

    ctx.save();

    ctx.shadowColor=
        orb.type==="fireball"
        ?" #ef4444"
        :"#c084fc";

    ctx.shadowBlur=
        20+
        pulse;

    ctx.fillStyle="#7c3aed";

    ctx.beginPath();

    ctx.arc(
        orb.x+18,
        orb.y+18,
        18+pulse*.25,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="white";

    ctx.font="23px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        info.icon,
        orb.x+18,
        orb.y+26
    );

    ctx.fillStyle="#facc15";

    ctx.font="bold 11px Arial";

    ctx.fillText(
        info.name,
        orb.x+18,
        orb.y-7
    );

    ctx.textAlign="left";

    ctx.restore();

}


/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(enemy){

    ctx.fillStyle=
        enemy.type==="fire"
        ?" #ef4444"
        :
        enemy.type==="jumper"
        ?" #a855f7"
        :"#f97316";

    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.w,
        enemy.h,
        7
    );

    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        enemy.x+10,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        enemy.x+24,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#e2e8f0";

    ctx.font="10px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        enemy.name,
        enemy.x+17,
        enemy.y-8
    );

    ctx.textAlign="left";

}


/* =========================================================
   FIREBALL DRAW
========================================================= */

function drawFireball(fire){

    ctx.fillStyle=
        fire.friendly
        ?" #60a5fa"
        :"#ef4444";

    ctx.shadowColor=
        fire.friendly
        ?" #60a5fa"
        :"#ef4444";

    ctx.shadowBlur=15;

    ctx.beginPath();

    ctx.arc(
        fire.x+fire.w/2,
        fire.y+fire.h/2,
        fire.w/2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

}


/* =========================================================
   BOSS DRAW
========================================================= */

function drawBoss(){

    if(!game.boss)
        return;

    const boss=game.boss;

    if(!boss.active)
        return;

    ctx.fillStyle="#7f1d1d";

    ctx.beginPath();

    ctx.roundRect(
        boss.x,
        boss.y,
        boss.w,
        boss.h,
        15
    );

    ctx.fill();

    ctx.fillStyle="#dc2626";

    ctx.fillRect(
        boss.x+10,
        boss.y+20,
        boss.w-20,
        45
    );

    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(
        boss.x+30,
        boss.y+42,
        8,
        0,
        Math.PI*2
    );

    ctx.arc(
        boss.x+80,
        boss.y+42,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.font="bold 14px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "MEGA PRINTER",
        boss.x+55,
        boss.y-15
    );

    ctx.textAlign="left";

}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(
            player.invincible/6
        )%2===0
    ){

        return;

    }

    const color=
        skins[game.skin].color;

    const x=player.x;
    const y=player.y;

    const w=player.w;

    ctx.save();

    if(
        game.activePowers.includes("star")
    ){

        ctx.shadowColor="#facc15";
        ctx.shadowBlur=30;

    }

    if(
        game.activePowers.includes("shield")
    ){

        ctx.strokeStyle="#38bdf8";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+25,
            30,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y+15,
        w,
        37,
        7
    );

    ctx.fill();

    ctx.fillStyle="#f8fafc";

    ctx.beginPath();

    ctx.arc(
        x+w/2,
        y+10,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#0f172a";

    ctx.fillRect(
        x+5,
        y+5,
        w-10,
        7
    );

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.facing===1
        ?x-5
        :x+w,
        y+22,
        7,
        22
    );

    ctx.strokeStyle="#e2e8f0";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        x+9,
        y+48
    );

    ctx.lineTo(
        x+5,
        y+60
    );

    ctx.moveTo(
        x+w-9,
        y+48
    );

    ctx.lineTo(
        x+w-5,
        y+60
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   FINISH
========================================================= */

function drawFinish(){

    const x=world.finishX;

    ctx.fillStyle="#1e293b";

    ctx.fillRect(
        x+45,
        350,
        120,
        100
    );

    ctx.fillStyle="#475569";

    ctx.fillRect(
        x+60,
        320,
        90,
        35
    );

    ctx.fillStyle="#60a5fa";

    ctx.fillRect(
        x+75,
        330,
        60,
        8
    );

    ctx.fillStyle="#e2e8f0";

    ctx.fillRect(
        x,
        190,
        8,
        260
    );

    ctx.fillStyle="#a78bfa";

    ctx.beginPath();

    ctx.moveTo(
        x+8,
        200
    );

    ctx.lineTo(
        x+105,
        230
    );

    ctx.lineTo(
        x+8,
        260
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";

    ctx.font="bold 14px Arial";

    ctx.fillText(
        "PRINT!",
        x+30,
        235
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBackground();

    ctx.save();

    ctx.translate(
        -world.cameraX,
        0
    );

    for(const p of platforms)
        drawPlatform(p);

    for(const s of spikes)
        drawSpike(s);

    for(const item of collectibles){

        if(!item.collected)
            drawFilament(item);

    }

    for(const orb of powerups){

        if(!orb.collected)
            drawPowerOrb(orb);

    }

    for(const enemy of enemies)
        drawEnemy(enemy);

    for(const fire of fireballs)
        drawFireball(fire);

    drawFinish();

    drawBoss();

    drawPlayer();

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life/40);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

    for(const t of texts){

        ctx.globalAlpha=
            Math.min(
                1,
                t.life/20
            );

        ctx.fillStyle=t.color;

        ctx.font=
            `bold ${t.size}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );

    }

    ctx.globalAlpha=1;
    ctx.textAlign="left";

    ctx.restore();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("score")
        .textContent=
        game.score.toLocaleString();

    document.getElementById("coins")
        .textContent=
        game.filament;

    document.getElementById("level")
        .textContent=
        game.level+"-"+game.level;

    document.getElementById("lives")
        .textContent=
        "♥ ".repeat(
            Math.max(
                0,
                player.lives
            )
        ).trim();

    document.getElementById("skinName")
        .textContent=
        skins[game.skin].name;

    let power="Normal";

    if(game.activePowers.length){

        power=
            game.activePowers
            .map(
                p=>POWER_INFO[p].name
            )
            .join(", ");

    }

    document.getElementById("power")
        .textContent=power;

    if(
        game.boss &&
        game.boss.active &&
        game.boss.health>0
    ){

        document.getElementById(
            "bossBar"
        ).style.display="block";

        document.getElementById(
            "bossHealth"
        ).style.width=
            (
                game.boss.health/
                game.boss.maxHealth*
                100
            )+"%";

    }
    else{

        document.getElementById(
            "bossBar"
        ).style.display="none";

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        game.playing &&
        !game.over &&
        !world.finished
    ){

        updatePlayer();
        updateCheckpoint();
        updateEnemies();
        updateFireballs();
        updatePowerups();
        updateCollectibles();
        updateBoss();
        checkFinish();

    }

    updateParticles();
    updateTexts();
    updateHUD();

}


/* =========================================================
   START BUTTON
========================================================= */

const message=
    document.getElementById("message");

const messageText=
    document.getElementById("messageText");

const startButton=
    document.getElementById("startButton");


startButton.addEventListener(
    "click",
    ()=>{

        startAudio();

        /* PLAY AGAIN */

        if(game.over){

            game.started=true;
            game.playing=false;
            game.over=false;

            game.level=1;
            game.score=0;
            game.filament=0;
            game.enemiesDefeated=0;

            game.skin="blue";
            game.ownedSkins=["blue"];

            player.lives=3;

            createLevel(1);

            showLevelScreen();

            return;

        }

        /* NEXT LEVEL */

        if(world.finished){

            if(
                game.level<
                game.totalLevels
            ){

                game.level++;

                createLevel(
                    game.level
                );

                startButton.classList.remove(
                    "hidden"
                );

                showLevelScreen();

            }

            return;

        }

        /* FIRST START */

        if(!game.started){

            game.started=true;
            game.over=false;
            game.level=1;
            game.score=0;
            game.filament=0;
            game.enemiesDefeated=0;

            player.lives=3;

            createLevel(1);

            showLevelScreen();

            return;

        }

        /*
           THIS IS THE IMPORTANT PART:

           The game ONLY starts when the
           player presses START LEVEL.
        */

        if(
            game.started &&
            !game.playing &&
            !world.finished
        ){

            game.playing=true;

            message.classList.add(
                "hidden"
            );

            startButton.className=
                "menuButton green";

            beep(440,.1);

            setTimeout(()=>{
                beep(660,.1);
            },100);

        }

    }
);


/* =========================================================
   ADD SHOP BUTTON
========================================================= */

function addShopButton(){

    const existing=
        document.getElementById(
            "shopButton"
        );

    if(existing)return;

    const button=
        document.createElement("button");

    button.id="shopButton";

    button.textContent=
        "🛒 SHOP";

    button.className=
        "menuButton purple";

    button.style.position="fixed";
    button.style.right="15px";
    button.style.top="15px";
    button.style.zIndex="40";

    button.onclick=()=>{

        if(!game.started)
            return;

        if(game.playing){

            game.playing=false;

        }

        showShop();

    };

    document.body.appendChild(button);

}

addShopButton();


/* =========================================================
   INITIAL LEVEL
========================================================= */

createLevel(1);

game.started=false;
game.playing=false;

message.classList.remove("hidden");

startButton.textContent="START GAME";

updateHUD();


/* =========================================================
   LOOP
========================================================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

loop();

</script>
