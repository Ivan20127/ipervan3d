let audioCtx=null;

function startAudio(){
    if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function beep(freq,duration=.08,type="square",volume=.04){
    if(!audioCtx)return;

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type=type;
    o.frequency.value=freq;

    g.gain.setValueAtTime(volume,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    o.stop(audioCtx.currentTime+duration);
}

/* =========================================================

========================================================= */

function addPlatform(x,y,w,h=25){
    platforms.push({x,y,w,h});
}

function addSpike(x,y,w){
    spikes.push({x,y,w,h:25});
}

function addBlock(x,y){
    blocks.push({
        x,y,w:42,h:42,used:false
    });
}

function addFilament(x,y){
    collectibles.push({
        x,y,r:9,collected:false
    });
}

function addPowerup(x,y,type){
    powerups.push({
        x,y,w:32,h:32,
        type,
        collected:false,
        pulse:Math.random()*6
    });
}

function addEnemy(x,type){

    enemies.push({
        x,
        y:390,
        w:34,
        h:34,

        vx:0,
        vy:0,

        direction:Math.random()>.5?1:-1,

        speed:
            type==="jumper"
            ?1.15+game.level*.1
            :1.2+game.level*.12,

        type,
        alive:true,
        onGround:false,

        jumpTimer:80+Math.random()*100,
        fireTimer:80+Math.random()*100,

        name:[
            "Gear Fidget",
            "Dragon",
            "Pig",
            "Otter",
            "Shark",
            "Knight Holder",
            "Cactus",
            "Air Tank"
        ][Math.floor(Math.random()*8)]
    });
}

    world.finished=false;

    for(const g of data.grounds){
        addPlatform(g[0],450,g[1],100);
    }

    for(const p of data.platforms){
        addPlatform(p[0],p[1],p[2],25);
    }

    for(const s of data.spikes){
        addSpike(s[0],s[1],s[2]);
    }

    for(const b of data.platforms){
        if(Math.random()<.45){
            addBlock(b[0]+20,b[1]-60);
        }
    }

    for(let x=120;x<data.width-200;x+=180){

        const y=370-((x/180)%3)*30;

        addFilament(x,y);
    }

    for(const p of data.platforms){

        for(
            let x=p[0]+25;
            x<p[0]+p[2]-10;
            x+=55
        ){

            addFilament(x,p[1]-25);
        }
    }

    for(const e of data.enemies){
        addEnemy(e[0],e[1]);
    }

    /* EXACTLY THREE POWER ORBS */

    const powerPositions=[
        [data.platforms[2][0]+40,data.platforms[2][1]-60],
        [data.platforms[Math.floor(data.platforms.length/2)][0]+40,
         data.platforms[Math.floor(data.platforms.length/2)][1]-60],
        [data.platforms[data.platforms.length-3][0]+45,
         data.platforms[data.platforms.length-3][1]-60]
    ];

    data.powers.forEach((type,i)=>{
        addPowerup(
            powerPositions[i][0],
            powerPositions[i][1],
            type
        );
    });

    player.x=100;
    player.y=350;
    player.vx=0;
    player.vy=0;

    player.invincible=100;
    player.checkpoint=100;
    player.onGround=false;
    player.jumpsUsed=0;

    /* RESET TEMPORARY POWERS */

    player.currentPower=null;

    player.fireballTimer=0;
    player.fireballCooldown=0;
    player.speedTimer=0;
    player.shield=false;
    player.magnetTimer=0;
    player.smashTimer=0;
    player.freezeTimer=0;
    player.freezeCooldown=0;

    player.ghostTimer=0;
    player.multiplierTimer=0;

    if(data.boss){
        createBoss();
    }

    addText(
        player.x+300,
        150,
        "LEVEL "+number,
        "#60a5fa",
        30
    );

    addText(
        player.x+300,
        185,
        data.name,
        "#e2e8f0",
        18
    );

    beep(350,.12);
}


/* =========================================================
   POWER-UP COLLECTION
========================================================= */

function collectPower(type){

    const p=POWERUPS[type];

    player.currentPower=type;

    addText(
        player.x+player.w/2,
        player.y-25,
        p.icon+" "+p.name+"!",
        p.color,
        18
    );

    burst(
        player.x+15,
        player.y+20,
        p.color,
        20
    );

    beep(700,.12,"sine");

    switch(type){

        case "fireball":
            player.fireballTimer=999999;
            break;

        case "extraJump":
            break;

        case "speed":
            player.speedTimer=900;
            break;

        case "shield":
            player.shield=true;
            break;

        case "magnet":
            player.magnetTimer=1000;
            break;

        case "smash":
            player.smashTimer=1000;
            break;

        case "freeze":
            player.freezeTimer=1000;
            break;

        case "superDash":
            player.superDashTimer=1000;
            break;

        case "star":
            player.starTimer=900;
            player.invincible=900;
            break;

        case "life":
            player.lives++;
            break;

        case "ghost":
            player.ghostTimer=800;
            break;

        case "multiplier":
            player.multiplierTimer=1200;
            break;
    }
}


/* =========================================================
   COLLISION
========================================================= */

function overlap(a,b){

    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !game.started ||
        game.over ||
        world.finished
    )return;

    if(player.onGround){

        player.vy=-player.jumpPower;
        player.onGround=false;
        player.jumpsUsed=1;

        beep(500,.07);
        return;
    }

    /* EXTRA JUMP */

    if(
        levels[game.level-1].powers.includes("extraJump") &&
        player.jumpsUsed<2
    ){

        player.vy=-player.jumpPower;
        player.jumpsUsed=2;

        burst(
            player.x+15,
            player.y+45,
            "#a78bfa",
            10
        );

        beep(750,.09);
    }
}


/* =========================================================
   DASH
========================================================= */

function dash(){

    if(player.dashCooldown>0)return;

    const superDash=
        player.superDashTimer>0;

    player.dashTimer=
        superDash?20:12;

    player.dashCooldown=
        superDash?45:70;

    player.vx=
        player.facing*
        (superDash?18:13);

    burst(
        player.x,
        player.y+25,
        superDash?"#c084fc":"#60a5fa",
        12
    );

    beep(
        superDash?260:180,
        .1,
        "sawtooth"
    );
}


/* =========================================================
   FIREBALL POWER
========================================================= */

function useFireball(){

    if(player.fireballTimer<=0)return;
    if(player.fireballCooldown>0)return;

    player.fireballCooldown=25;

    playerShots.push({

        x:player.x+player.w/2,
        y:player.y+20,

        w:18,
        h:18,

        vx:player.facing*9,
        life:120
    });

    beep(520,.08,"sawtooth");
}


/* =========================================================
   GROUND SMASH
========================================================= */

function groundSmash(){

    if(player.smashTimer<=0)return;
    if(player.onGround)return;

    player.vy=18;

    burst(
        player.x+15,
        player.y+50,
        "#f97316",
        12
    );
}


/* =========================================================
   FREEZE RAY
========================================================= */

function freezeRay(){

    if(player.freezeTimer<=0)return;
    if(player.freezeCooldown>0)return;

    player.freezeCooldown=100;

    for(const enemy of enemies){

        if(
            Math.abs(enemy.x-player.x)<450
        ){
            enemy.frozen=180;
        }
    }

    if(boss && Math.abs(boss.x-player.x)<600){
        boss.frozen=100;
    }

    addText(
        player.x,
        player.y-35,
        "❄️ FROZEN!",
        "#67e8f9",
        20
    );

    beep(300,.18,"sine");
}


/* =========================================================
   GHOST MODE
========================================================= */

function ghostMode(){

    if(player.ghostTimer<=0)return;

    /* If ghost power is active, pressing V toggles it */

    if(player.ghostTimer>400){
        player.ghostTimer=1;
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    if(keys["ArrowLeft"]){

        player.vx-=player.acceleration;
        player.facing=-1;
    }

    if(keys["ArrowRight"]){

        player.vx+=player.acceleration;
        player.facing=1;
    }

    if(
        !keys["ArrowLeft"] &&
        !keys["ArrowRight"]
    ){

        player.vx*=player.friction;
    }

    const maxSpeed=
        player.speedTimer>0
        ?10
        :6;

    player.vx=Math.max(
        -maxSpeed,
        Math.min(maxSpeed,player.vx)
    );

    if(player.dashTimer>0){

        player.dashTimer--;
        player.vx*=.97;
    }

    if(player.dashCooldown>0)
        player.dashCooldown--;

    if(player.fireballCooldown>0)
        player.fireballCooldown--;

    if(player.freezeCooldown>0)
        player.freezeCooldown--;

    if(player.speedTimer>0)
        player.speedTimer--;

    if(player.magnetTimer>0)
        player.magnetTimer--;

    if(player.smashTimer>0)
        player.smashTimer--;

    if(player.freezeTimer>0)
        player.freezeTimer--;

    if(player.superDashTimer>0)
        player.superDashTimer--;

    if(player.starTimer>0)
        player.starTimer--;

    if(player.ghostTimer>0)
        player.ghostTimer--;

    if(player.multiplierTimer>0)
        player.multiplierTimer--;

    player.vy+=.6;

    const oldBottom=
        player.y+player.h;

    player.x+=player.vx;
    player.y+=player.vy;

    player.onGround=false;

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            oldBottom<=p.y &&
            player.y+player.h>=p.y &&
            player.vy>=0
        ){

            player.y=p.y-player.h;
            player.vy=0;
            player.onGround=true;
            player.jumpsUsed=0;
        }
    }

    player.x=Math.max(
        0,
        Math.min(
            world.width-player.w,
            player.x
        )
    );

    if(player.onGround===false && player.vy<0){
        /* no-op */
    }

    for(const spike of spikes){

        if(
            overlap(
                player,
                {
                    x:spike.x,
                    y:spike.y,
                    w:spike.w,
                    h:spike.h
                }
            )
        ){
            loseLife();
        }
    }

    if(player.y>600){
        loseLife();
    }

    world.cameraX=
        player.x-300;

    world.cameraX=Math.max(
        0,
        Math.min(
            world.width-WIDTH,
            world.cameraX
        )
    );

    if(player.invincible>0)
        player.invincible--;
}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        if(enemy.frozen>0){
            enemy.frozen--;
            continue;
        }

        enemy.vy+=.55;

        const oldBottom=
            enemy.y+enemy.h;

        enemy.y+=enemy.vy;

        enemy.onGround=false;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                oldBottom<=p.y &&
                enemy.y+enemy.h>=p.y &&
                enemy.vy>=0
            ){

                enemy.y=p.y-enemy.h;
                enemy.vy=0;
                enemy.onGround=true;
            }
        }

        enemy.x+=enemy.direction*enemy.speed;

        let support=null;

        for(const p of platforms){

            if(
                enemy.x+enemy.w>p.x &&
                enemy.x<p.x+p.w &&
                Math.abs(
                    enemy.y+enemy.h-p.y
                )<8
            ){
                support=p;
                break;
            }
        }

        if(support){

            const left=support.x;
            const right=
                support.x+
                support.w-
                enemy.w;

            if(enemy.x<=left){
                enemy.x=left;
                enemy.direction=1;
            }

            if(enemy.x>=right){
                enemy.x=right;
                enemy.direction=-1;
            }
        }

        if(enemy.type==="jumper"){

            enemy.jumpTimer--;

            if(
                enemy.jumpTimer<=0 &&
                enemy.onGround
            ){

                enemy.direction=
                    player.x>enemy.x?1:-1;

                enemy.vy=
                    -10-game.level*.3;

                enemy.jumpTimer=
                    80+Math.random()*90;
            }
        }

        if(enemy.type==="fire"){

            enemy.fireTimer--;

            if(enemy.fireTimer<=0){

                spitFire(enemy);

                enemy.fireTimer=
                    100-game.level*4+
                    Math.random()*70;
            }
        }

        if(
            overlap(player,enemy) &&
            player.ghostTimer<=0
        ){

            if(
                player.vy>0 &&
                player.y+player.h-enemy.y<20
            ){

                killEnemy(enemy);

                player.vy=-10;
            }
            else if(player.starTimer>0){

                killEnemy(enemy);
            }
            else{

                loseLife();
            }
        }
    }

    enemies=enemies.filter(e=>e.alive);
}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy){

    enemy.alive=false;

    game.enemiesDefeated++;
    game.score+=150;

    burst(
        enemy.x+17,
        enemy.y+17,
        "#facc15",
        15
    );

    beep(700,.06);
}


/* =========================================================
   ENEMY FIRE
========================================================= */

function spitFire(enemy){

    fireballs.push({

        x:enemy.x+17,
        y:enemy.y+10,

        w:16,
        h:16,

        vx:
            (player.x>enemy.x?1:-1)*
            (4.5+game.level*.25),

        vy:-2,

        life:180,
        rotation:0
    });
}


/* =========================================================
   PLAYER FIREBALLS
========================================================= */

function updatePlayerShots(){

    for(const shot of playerShots){

        shot.x+=shot.vx;
        shot.life--;

        for(const enemy of enemies){

            if(
                enemy.alive &&
                overlap(shot,enemy)
            ){

                killEnemy(enemy);
                shot.life=0;
                break;
            }
        }

        if(boss && boss.alive && overlap(shot,boss)){

            boss.health-=5;
            shot.life=0;

            burst(
                shot.x,
                shot.y,
                "#facc15",
                8
            );

            if(boss.health<=0){
                defeatBoss();
            }
        }
    }

    playerShots=
        playerShots.filter(
            s=>s.life>0
        );
}


/* =========================================================
   FIREBALL UPDATE
========================================================= */

function updateFireballs(){

    for(const fire of fireballs){

        fire.x+=fire.vx;
        fire.y+=fire.vy;

        fire.vy+=.1;
        fire.life--;
        fire.rotation+=.2;

        if(
            overlap(player,fire) &&
            player.ghostTimer<=0
        ){

            fire.life=0;

            if(player.starTimer>0){
                game.score+=100;
            }
            else{
                loseLife();
            }
        }

        for(const p of platforms){

            if(overlap(fire,p)){
                fire.life=0;
                break;
            }
        }
    }

    fireballs=
        fireballs.filter(
            f=>f.life>0
        );
}


/* =========================================================
   COLLECTIBLES
========================================================= */

function updateCollectibles(){

    for(const item of collectibles){

        if(item.collected)continue;

        /* MAGNET */

        if(
            player.magnetTimer>0 &&
            Math.abs(item.x-player.x)<230 &&
            Math.abs(item.y-player.y)<180
        ){

            item.x+=(player.x-item.x)*.08;
            item.y+=(player.y-item.y)*.08;
        }

        const box={
            x:item.x-9,
            y:item.y-9,
            w:18,
            h:18
        };

        if(overlap(player,box)){

            item.collected=true;

            const amount=
                player.multiplierTimer>0?2:1;

            game.filament+=amount;
            game.score+=50*amount;

            addText(
                item.x,
                item.y-15,
                "+"+(50*amount),
                "#60a5fa"
            );

            beep(850,.06,"sine");
        }
    }
}


/* =========================================================
   POWER ORBS
========================================================= */

function updatePowerups(){

    for(const item of powerups){

        if(item.collected)continue;

        item.pulse+=.08;

        if(overlap(player,item)){

            item.collected=true;

            collectPower(item.type);
        }
    }
}


/* =========================================================
   BLOCKS
========================================================= */

function updateBlocks(){

    for(const block of blocks){

        if(block.used)continue;

        if(
            player.vy<0 &&
            player.x+player.w>block.x &&
            player.x<block.x+block.w &&
            player.y<block.y+block.h &&
            player.y+player.h>block.y
        ){

            block.used=true;

            game.filament++;
            game.score+=100;

            burst(
                block.x+21,
                block.y+20,
                "#facc15",
                8
            );

            beep(650,.08);
        }
    }
}


/* =========================================================
   BOSS UPDATE
========================================================= */

function updateBoss(){

    if(!boss || !boss.alive)return;

    if(boss.frozen>0){
        boss.frozen--;
        return;
    }

    boss.phase=
        boss.health<50?2:1;

    boss.vy+=.5;

    boss.y+=boss.vy;

    if(boss.y+boss.h>=450){

        boss.y=450-boss.h;
        boss.vy=0;
    }

    /* FOLLOW PLAYER */

    if(player.x<boss.x){
        boss.vx=-(
            boss.phase===2?2.3:1.5
        );
    }
    else{
        boss.vx=(
            boss.phase===2?2.3:1.5
        );
    }

    boss.x+=boss.vx;

    boss.x=Math.max(
        world.width-850,
        Math.min(
            world.width-200,
            boss.x
        )
    );

    boss.fireTimer--;

    if(boss.fireTimer<=0){

        bossShoot();

        boss.fireTimer=
            boss.phase===2
            ?35
            :65;
    }

    boss.jumpTimer--;

    if(
        boss.jumpTimer<=0 &&
        boss.y+boss.h>=450
    ){

        boss.vy=
            boss.phase===2
            ?-13
            :-11;

        boss.jumpTimer=
            boss.phase===2
            ?100
            :160;
    }

    if(
        overlap(player,boss) &&
        player.starTimer<=0 &&
        player.ghostTimer<=0
    ){

        loseLife();
    }
}


/* =========================================================
   BOSS FIREBALLS
========================================================= */

function bossShoot(){

    const count=
        boss.phase===2?3:1;

    for(let i=0;i<count;i++){

        const targetY=
            player.y+20+
            (i-1)*60;

        const dx=
            player.x-boss.x;

        const dy=
            targetY-(boss.y+40);

        const length=
            Math.sqrt(dx*dx+dy*dy)||1;

        bossFireballs.push({

            x:boss.x+boss.w/2,
            y:boss.y+40,

            w:20,
            h:20,

            vx:dx/length*
                (5+game.level*.4),

            vy:dy/length*
                (5+game.level*.4),

            life:180,
            rotation:0
        });
    }

    beep(120,.12,"sawtooth");
}


function updateBossFireballs(){

    for(const fire of bossFireballs){

        fire.x+=fire.vx;
        fire.y+=fire.vy;
        fire.life--;
        fire.rotation+=.2;

        if(
            overlap(player,fire) &&
            player.ghostTimer<=0
        ){

            fire.life=0;

            if(player.starTimer<=0){
                loseLife();
            }
        }
    }

    bossFireballs=
        bossFireballs.filter(
            f=>f.life>0
        );
}


/* =========================================================
   DEFEAT BOSS
========================================================= */

function defeatBoss(){

    if(!boss || !boss.alive)return;

    boss.alive=false;

    game.score+=10000;

    burst(
        boss.x+45,
        boss.y+50,
        "#facc15",
        80
    );

    addText(
        boss.x+45,
        boss.y-20,
        "💥 BOSS DEFEATED!",
        "#facc15",
        26
    );

    beep(500,.2);
    setTimeout(()=>beep(800,.2),150);
    setTimeout(()=>beep(1100,.25),300);

    setTimeout(()=>{
        finishLevel();
    },1200);
}


/* =========================================================
   FINISH
========================================================= */

function checkFinish(){

    if(
        game.level===5 &&
        boss &&
        boss.alive
    ){
        return;
    }

    if(player.x>=world.finishX){
        finishLevel();
    }
}


function finishLevel(){

    if(world.finished)return;

    world.finished=true;

    game.score+=2500*game.level;

    if(game.level<game.totalLevels){

        message.classList.remove("hidden");

        showLevelComplete();

    }
    else{

        gameWon();
    }
}

/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(){

    if(player.invincible>0)return;

    /* SHIELD */

    if(player.shield){

        player.shield=false;
        player.invincible=100;

        addText(
            player.x,
            player.y-20,
            "🛡️ BLOCKED!",
            "#38bdf8",
            18
        );

        burst(
            player.x+15,
            player.y+25,
            "#38bdf8",
            20
        );

        beep(800,.12);

        return;
    }

    player.lives--;

    player.invincible=120;

    game.score=Math.max(
        0,
        game.score-200
    );

    player.x=player.checkpoint;
    player.y=300;

    player.vx=0;
    player.vy=-8;

    beep(120,.2,"sawtooth");

    if(player.lives<=0){
        gameOver();
    }
}


/* =========================================================
   CHECKPOINT
========================================================= */

function updateCheckpoint(){

    const checkpoint=
        Math.floor(player.x/1000)*1000+100;

    if(
        checkpoint>player.checkpoint &&
        checkpoint<world.width-100
    ){

        player.checkpoint=checkpoint;

        addText(
            checkpoint,
            300,
            "CHECKPOINT!",
            "#4ade80",
            16
        );

        beep(600,.08,"sine");
    }
}

   GAME OVER
========================================================= */

        ">

        </strong>

        <br><br>

        The products took over the factory.

        <br><br>

        You reached Level
        <strong>${game.level}</strong>.

        <br><br>

        Score:
        <strong style="color:#facc15">
            ${game.score.toLocaleString()}
        </strong>

        <br><br>

        Products defeated:
        ${game.enemiesDefeated}

    `;

    startButton.textContent="TRY AGAIN";
}


/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,color,amount=10){

    for(let i=0;i<amount;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-.5)*8,
            vy:(Math.random()-.5)*8,

            size:2+Math.random()*4,

            color,

            life:25+Math.random()*30
        });
    }
}


function updateParticles(){

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.18;

        p.life--;
    }

    particles=
        particles.filter(
            p=>p.life>0
        );
}


/* =========================================================
   FLOATING TEXT
========================================================= */

function addText(
    x,y,text,
    color="white",
    size=16
){

    texts.push({
        x,y,text,color,size,
        life:65
    });
}


function updateTexts(){

    for(const t of texts){

        t.y-=.6;
        t.life--;
    }

    texts=
        texts.filter(
            t=>t.life>0
        );
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const theme=
        levels[game.level-1].theme;

    let top="#071426";
    let bottom="#172554";

    if(theme==="warehouse"){
        top="#111827";
        bottom="#312e81";
    }

    if(theme==="canyon"){
        top="#431407";
        bottom="#7c2d12";
    }

    if(theme==="lab"){
        top="#071e2f";
        bottom="#164e63";
    }

    if(theme==="mega"){
        top="#1e1b4b";
        bottom="#312e81";
    }

    const gradient=
        ctx.createLinearGradient(
            0,0,0,HEIGHT
        );

    gradient.addColorStop(0,top);
    gradient.addColorStop(1,bottom);

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,WIDTH,HEIGHT
    );

    for(let i=0;i<35;i++){

        const x=
            i*80-
            (world.cameraX*.18%80);

        const h=
            70+(i*47)%140;

        ctx.fillStyle=
            i%2
            ?"rgba(15,23,42,.85)"
            :"rgba(20,34,56,.85)";

        ctx.fillRect(
            x,
            450-h,
            65,
            h
        );

        ctx.fillStyle=
            i%3===0
            ?"rgba(250,204,21,.7)"
            :"rgba(56,189,248,.7)";

        for(
            let y=470-h;
            y<420;
            y+=23
        ){

            ctx.fillRect(
                x+10,y,6,8
            );

            ctx.fillRect(
                x+30,y,6,8
            );

            ctx.fillRect(
                x+50,y,6,8
            );
        }
    }
}


/* =========================================================
   DRAW PLATFORM
========================================================= */

function drawPlatform(p){

    ctx.fillStyle="#334155";

    ctx.fillRect(
        p.x,p.y,p.w,p.h
    );

    ctx.fillStyle="#64748b";

    ctx.fillRect(
        p.x,p.y,p.w,7
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.08)";

    for(
        let x=p.x+10;
        x<p.x+p.w;
        x+=15
    ){

        ctx.beginPath();

        ctx.moveTo(x,p.y+10);
        ctx.lineTo(x,p.y+p.h);

        ctx.stroke();
    }
}


/* =========================================================
   DRAW SPIKE
========================================================= */

function drawSpike(s){

    const count=
        Math.max(
            1,
            Math.floor(s.w/18)
        );

    const spikeW=s.w/count;

    for(let i=0;i<count;i++){

        const x=
            s.x+i*spikeW;

        ctx.fillStyle="#cbd5e1";

        ctx.beginPath();

        ctx.moveTo(
            x,
            s.y+s.h
        );

        ctx.lineTo(
            x+spikeW/2,
            s.y
        );

        ctx.lineTo(
            x+spikeW,
            s.y+s.h
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   DRAW BLOCK
========================================================= */

function drawBlock(block){

    ctx.fillStyle=
        block.used
        ?" #475569"
        :"#f59e0b";

    ctx.fillRect(
        block.x,
        block.y,
        block.w,
        block.h
    );

    ctx.strokeStyle="#111827";
    ctx.lineWidth=3;

    ctx.strokeRect(
        block.x+2,
        block.y+2,
        block.w-4,
        block.h-4
    );

    ctx.fillStyle="white";
    ctx.font="bold 24px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        block.used?"✓":"?",
        block.x+21,
        block.y+29
    );

    ctx.textAlign="left";
}


/* =========================================================
   DRAW FILAMENT
========================================================= */

function drawFilament(item){

    ctx.strokeStyle="#60a5fa";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        item.r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.strokeStyle="#dbeafe";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        4,
        0,
        Math.PI*2
    );

    ctx.stroke();
}


/* =========================================================
   DRAW POWER ORB
========================================================= */

function drawPowerup(item){

    const p=POWERUPS[item.type];

    const pulse=
        Math.sin(item.pulse)*5;

    const cx=
        item.x+item.w/2;

    const cy=
        item.y+item.h/2;

    /* OUTER GLOW */

    ctx.save();

    ctx.shadowColor=p.color;
    ctx.shadowBlur=25+pulse;

    ctx.fillStyle=
        p.color;

    ctx.globalAlpha=.25;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        25+pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

    /* ORB */

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        p.icon,
        cx,
        cy+7
    );

    /* LABEL */

    ctx.font="bold 10px Arial";
    ctx.fillStyle="white";

    ctx.fillText(
        p.name,
        cx,
        cy-28
    );

    ctx.restore();

    ctx.textAlign="left";
}


/* =========================================================
   DRAW ENEMY
========================================================= */

function drawEnemy(enemy){

    ctx.fillStyle=
        enemy.frozen>0
        ?"rgba(103,232,249,.9)"
        :"#f97316";

    if(enemy.type==="fire")
        ctx.fillStyle="#ef4444";

    if(enemy.type==="jumper")
        ctx.fillStyle="#a855f7";

    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.w,
        enemy.h,
        7
    );

    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        enemy.x+10,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        enemy.x+24,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#e2e8f0";
    ctx.font="10px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        enemy.name,
        enemy.x+17,
        enemy.y-10
    );

    if(enemy.frozen>0){

        ctx.font="16px Arial";

        ctx.fillText(
            "❄️",
            enemy.x+17,
            enemy.y-24
        );
    }

    ctx.textAlign="left";
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(player.invincible/6)%2===0
    ){
        return;
    }

    const x=player.x;
    const y=player.y;

    /* STAR */

    if(player.starTimer>0){

        ctx.shadowColor="#facc15";
        ctx.shadowBlur=30;
    }

    /* GHOST */

    if(player.ghostTimer>0){

        ctx.globalAlpha=.45;
    }

    /* SHIELD */

    if(player.shield){

        ctx.strokeStyle="#38bdf8";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            x+15,
            y+27,
            30,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    ctx.fillStyle=
        player.starTimer>0
        ?" #facc15"
        :"#60a5fa";

    ctx.fillRect(
        x,
        y+15,
        30,
        37
    );

    ctx.fillStyle="#f8fafc";

    ctx.beginPath();

    ctx.arc(
        x+15,
        y+10,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#0f172a";

    ctx.fillRect(
        x+5,
        y+5,
        20,
        7
    );

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.facing===1
        ?x-5
        :x+30,
        y+22,
        7,
        22
    );

    ctx.strokeStyle="#e2e8f0";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(x+9,y+49);
    ctx.lineTo(x+5,y+59);

    ctx.moveTo(x+21,y+49);
    ctx.lineTo(x+25,y+59);

    ctx.stroke();

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}


/* =========================================================
   DRAW PLAYER SHOTS
========================================================= */

function drawPlayerShots(){

    for(const shot of playerShots){

        ctx.shadowColor="#ef4444";
        ctx.shadowBlur=18;

        ctx.fillStyle="#ef4444";

        ctx.beginPath();

        ctx.arc(
            shot.x+9,
            shot.y+9,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#facc15";

        ctx.beginPath();

        ctx.arc(
            shot.x+9,
            shot.y+9,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }
}


/* =========================================================
   DRAW FIREBALL
========================================================= */

function drawFireball(fire){

    ctx.save();

    ctx.translate(
        fire.x+8,
        fire.y+8
    );

    ctx.rotate(
        fire.rotation
    );

    ctx.fillStyle="#ef4444";

    ctx.beginPath();

    ctx.arc(
        0,0,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(
        0,0,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DRAW BOSS
========================================================= */

function drawBoss(){

    if(!boss || !boss.alive)return;

    /* BOSS GLOW */

    ctx.shadowColor=
        boss.phase===2
        ?"red"
        :"#a855f7";

    ctx.shadowBlur=25;

    ctx.fillStyle=
        boss.phase===2
        ?" #dc2626"
        :"#7c3aed";

    ctx.beginPath();

    ctx.roundRect(
        boss.x,
        boss.y,
        boss.w,
        boss.h,
        15
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /* EYES */

    ctx.fillStyle="#f8fafc";

    ctx.beginPath();

    ctx.arc(
        boss.x+25,
        boss.y+30,
        8,
        0,
        Math.PI*2
    );

    ctx.arc(
        boss.x+65,
        boss.y+30,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* PRINT LAYERS */

    ctx.strokeStyle=
        "rgba(255,255,255,.3)";

    for(
        let y=boss.y+15;
        y<boss.y+boss.h;
        y+=12
    ){

        ctx.beginPath();

        ctx.moveTo(
            boss.x+8,
            y
        );

        ctx.lineTo(
            boss.x+boss.w-8,
            y
        );

        ctx.stroke();
    }

    /* NAME */

    ctx.fillStyle="white";
    ctx.font="bold 15px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "MEGA PRINTER BOSS",
        boss.x+45,
        boss.y-18
    );

    ctx.textAlign="left";

    /* HEALTH BAR */

    const barW=180;

    ctx.fillStyle="#450a0a";

    ctx.fillRect(
        boss.x-45,
        boss.y-45,
        barW,
        18
    );

    ctx.fillStyle=
        boss.health<50
        ?"red"
        :"#22c55e";

    ctx.fillRect(
        boss.x-45,
        boss.y-45,
        barW*
        (boss.health/boss.maxHealth),
        18
    );

    ctx.strokeStyle="white";

    ctx.strokeRect(
        boss.x-45,
        boss.y-45,
        barW,
        18
    );

    ctx.fillStyle="white";
    ctx.font="bold 11px Arial";

    ctx.fillText(
        Math.max(0,Math.ceil(boss.health))+
        " / "+
        boss.maxHealth,
        boss.x+25,
        boss.y-31
    );
}


/* =========================================================
   DRAW BOSS FIREBALLS
========================================================= */

function drawBossFireballs(){

    for(const fire of bossFireballs){

        ctx.save();

        ctx.translate(
            fire.x+10,
            fire.y+10
        );

        ctx.rotate(
            fire.rotation
        );

        ctx.shadowColor="red";
        ctx.shadowBlur=25;

        ctx.fillStyle="#ef4444";

        ctx.beginPath();

        ctx.arc(
            0,0,
            13,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#facc15";

        ctx.beginPath();

        ctx.arc(
            0,0,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW FINISH
========================================================= */

function drawFinish(){

    if(
        game.level===5 &&
        boss &&
        boss.alive
    ){
        return;
    }

    const x=world.finishX;

    ctx.fillStyle="#1e293b";

    ctx.fillRect(
        x+45,
        350,
        120,
        100
    );

    ctx.fillStyle="#475569";

    ctx.fillRect(
        x+60,
        320,
        90,
        35
    );

    ctx.fillStyle="#60a5fa";

    ctx.fillRect(
        x+75,
        330,
        60,
        8
    );

    ctx.fillStyle="#a78bfa";

    ctx.fillRect(
        x,
        190,
        8,
        260
    );

    ctx.fillStyle="#a78bfa";

    ctx.beginPath();

    ctx.moveTo(x+8,200);
    ctx.lineTo(x+105,230);
    ctx.lineTo(x+8,260);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="bold 14px Arial";

    ctx.fillText(
        "PRINT!",
        x+30,
        235
    );
}


/* =========================================================
   DRAW PARTICLES + TEXT
========================================================= */

function drawEffects(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/40
            );

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;

    for(const t of texts){

        ctx.globalAlpha=
            Math.min(
                1,
                t.life/20
            );

        ctx.fillStyle=t.color;

        ctx.font=
            `bold ${t.size}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.globalAlpha=1;
    ctx.textAlign="left";
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBackground();

    ctx.save();

    ctx.translate(
        -world.cameraX,
        0
    );

    for(const p of platforms)
        drawPlatform(p);

    for(const s of spikes)
        drawSpike(s);

    for(const b of blocks)
        drawBlock(b);

    for(const item of collectibles){

        if(!item.collected)
            drawFilament(item);
    }

    for(const item of powerups){

        if(!item.collected)
            drawPowerup(item);
    }

    for(const enemy of enemies)
        drawEnemy(enemy);

    drawPlayerShots();

    for(const fire of fireballs)
        drawFireball(fire);

    drawBossFireballs();

    drawBoss();

    drawFinish();

    drawPlayer();

    drawEffects();

    ctx.restore();

    /* STAR EFFECT */

    if(player.starTimer>0){

        ctx.fillStyle=
            "rgba(250,204,21,.06)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }

    /* BOSS WARNING */

    if(
        game.level===5 &&
        boss &&
        boss.alive
    ){

        ctx.fillStyle=
            "rgba(255,0,0,.08)";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("score")
        .textContent=
        game.score.toLocaleString();

    document.getElementById("coins")
        .textContent=
        game.filament;

    document.getElementById("level")
        .textContent=
        game.level+"-"+
        game.level;

    document.getElementById("lives")
        .textContent=
        "♥ ".repeat(
            Math.max(
                0,
                player.lives
            )
        ).trim();

    let power="Normal";

    if(player.currentPower){

        power=
            POWERUPS[
                player.currentPower
            ].icon+
            " "+
            POWERUPS[
                player.currentPower
            ].name;
    }

    document.getElementById("power")
        .textContent=power;

    let timer="";

    const timers=[
        ["Speed",player.speedTimer],
        ["Magnet",player.magnetTimer],
        ["Smash",player.smashTimer],
        ["Freeze",player.freezeTimer],
        ["Super Dash",player.superDashTimer],
        ["Star",player.starTimer],
        ["Ghost",player.ghostTimer],
        ["Multiplier",player.multiplierTimer]
    ];

    for(const [name,value] of timers){

        if(value>0){

            timer+=
                `<div style="color:#facc15">
                    ${name}: ${Math.ceil(value/60)}s
                </div>`;

            break;
        }
    }

    if(player.shield){

        timer+=
            `<div style="color:#38bdf8">
                🛡️ Shield Ready
            </div>`;
    }

    document.getElementById("powerTimer")
        .innerHTML=timer;
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        game.started &&
        !game.over &&
        !world.finished
    ){

        updatePlayer();
        updateCheckpoint();

        updateEnemies();
        updateFireballs();
        updatePlayerShots();

        updateCollectibles();
        updatePowerups();
        updateBlocks();

        if(
            game.level===5 &&
            boss &&
            boss.alive
        ){

            updateBoss();
            updateBossFireballs();
        }

        checkFinish();
    }

    updateParticles();
    updateTexts();

    updateHUD();
}


/* =========================================================
   LEVEL PREVIEW
========================================================= */

function showLevelPreview(){

    const data=levels[game.level-1];

    let cards="";

    for(const type of data.powers){

        const p=POWERUPS[type];

        cards+=`

            <div class="preview">

                <div class="previewIcon">
                    ${p.icon}
                </div>

                <div class="previewName"
                     style="color:${p.color}">
                    ${p.name}
                </div>

                <div class="previewHelp">
                    ${p.help}
                </div>

            </div>
        `;
    }

    messageText.innerHTML=`

        <strong style="
            color:#60a5fa;
            font-size:27px;
        ">
            LEVEL ${game.level}
        </strong>

        <br>

        <strong>
            ${data.name}
        </strong>

        <br><br>

        ${
            game.level===5
            ?`
                <strong style="color:#fb7185">
                    ⚠️ WARNING: BOSS FIGHT
                </strong>
                <br>
                The Mega Printer has
                <strong>100 HP</strong>
                and launches fireballs!
                <br><br>
            `
            :""
        }

        <strong style="color:#facc15">
            ⚡ POWER-UPS IN THIS LEVEL
        </strong>

        <div class="powerPreview">
            ${cards}
        </div>

        <br>

        <span style="color:#94a3b8">
            Touch an orb during the level
            to activate its power.
        </span>
    `;

    startButton.textContent=
        game.started
        ? "START LEVEL"
        : "START GAME";
}


/* =========================================================
   START BUTTON
========================================================= */

const message=
    document.getElementById("message");

const messageText=
    document.getElementById("messageText");

const startButton=
    document.getElementById("startButton");


startButton.addEventListener("click",()=>{

    startAudio();

    /* PLAY AGAIN */

    if(game.over){

        game.score=0;
        game.filament=0;
        game.enemiesDefeated=0;
        game.level=1;

        game.started=true;
        game.over=false;

        player.lives=3;

        createLevel(1);

        showLevelPreview();

        return;
    }

    /* NEXT LEVEL */

    if(world.finished){

        game.level++;

        createLevel(game.level);

        showLevelPreview();

        return;
    }

    /* FIRST START */

    if(!game.started){

        game.started=true;
        game.over=false;

        game.level=1;
        game.score=0;
        game.filament=0;
        game.enemiesDefeated=0;

        player.lives=3;

        createLevel(1);

        showLevelPreview();

        return;
    }

    /* START CURRENT LEVEL */

    message.classList.add("hidden");

    beep(440,.1);

    setTimeout(
        ()=>beep(660,.1),
        100
    );
});


/* =========================================================
   INITIALIZE
========================================================= */

createLevel(1);

updateHUD();

showLevelPreview();

loop();


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

</script>
