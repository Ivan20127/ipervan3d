<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print Wars Fixed</title>

<style>
body{
margin:0;
overflow:hidden;
background:#0b1220;
font-family:Arial;
color:white;
}

canvas{
display:block;
background:#111827;
}

#ui{
position:fixed;
top:10px;
left:10px;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
font-size:14px;
}
</style>
</head>

<body>

<div id="ui">
Controls: ← → move | SPACE jump<br>
Enemies: <span id="count">0</span>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script>

// ================= SAFE AUDIO (NO FREEZE) =================
let audioCtx = null;

function beep(freq){
if(!audioCtx){
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

const o = audioCtx.createOscillator();
const g = audioCtx.createGain();

o.connect(g);
g.connect(audioCtx.destination);

o.frequency.value = freq;
g.gain.value = 0.1;

o.start();

g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
o.stop(audioCtx.currentTime + 0.1);
}

// ================= CANVAS =================
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// ================= INPUT =================
let keys = {};

addEventListener("keydown", e => keys[e.key] = true);
addEventListener("keyup", e => keys[e.key] = false);

// ================= PLAYER =================
let player = {
x:100,
y:300,
vx:0,
vy:0,
w:18,
h:40,
onGround:false,
lives:3
};

// ================= PRODUCTS (ENEMIES) =================
const productNames = [
"Gear Fidget","Dragon","Pig","Otter","Shark",
"Knight Holder","Cactus","Air Tank"
];

let enemies = [];

// ================= PLATFORM =================
const groundY = 420;

// ================= SPAWN =================
function spawnEnemies(){
enemies = [];

for(let i=0;i<6;i++){
enemies.push({
x:200 + i*120,
y:groundY,
vx:1.2,
name: productNames[Math.floor(Math.random()*productNames.length)]
});
}
}

spawnEnemies();

// ================= COLLISION =================
function hit(a,b){
return a.x < b.x + 25 &&
a.x + 18 > b.x &&
a.y < b.y + 25 &&
a.y + 40 > b.y;
}

// ================= DAMAGE =================
function damage(){
player.lives--;
beep(120);

if(player.lives <= 0){
alert("GAME OVER");
location.reload();
}
}

// ================= JUMP =================
function jump(){
if(player.onGround){
player.vy = -11;
player.onGround = false;
beep(300);
}
}

// ================= UPDATE =================
function update(){

// movement
if(keys["ArrowLeft"]) player.vx = -4;
else if(keys["ArrowRight"]) player.vx = 4;
else player.vx *= 0.8;

// gravity
player.vy += 0.5;

player.x += player.vx;
player.y += player.vy;

// ground
if(player.y >= groundY){
player.y = groundY;
player.vy = 0;
player.onGround = true;
}

// ENEMIES (STABLE AI)
for(let e of enemies){

// simple chase AI
if(player.x < e.x) e.x -= e.vx;
else e.x += e.vx;

// damage player
if(Math.abs(player.x - e.x) < 20){
damage();
}

// stomp kill
if(player.vy > 0 && hit(player,e)){
e.dead = true;
player.vy = -8;
beep(200);
}
}

// remove dead
enemies = enemies.filter(e => !e.dead);

// respawn if cleared
if(enemies.length === 0){
spawnEnemies();
}

// bounds
player.x = Math.max(0, Math.min(880, player.x));
}

// ================= DRAW =================
function draw(){

ctx.clearRect(0,0,900,500);

// ground
ctx.fillStyle="#334155";
ctx.fillRect(0,groundY+40,900,60);

// player (stick figure)
ctx.strokeStyle="white";
ctx.lineWidth=3;

ctx.beginPath();
ctx.arc(player.x, player.y-20, 10, 0, Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x, player.y-10);
ctx.lineTo(player.x, player.y+20);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x, player.y+20);
ctx.lineTo(player.x-10, player.y+40);
ctx.moveTo(player.x, player.y+20);
ctx.lineTo(player.x+10, player.y+40);
ctx.stroke();

// enemies (YOUR PRODUCTS)
ctx.fillStyle="#f97316";

for(let e of enemies){
ctx.fillRect(e.x, e.y, 25, 25);

ctx.fillStyle="white";
ctx.font="10px Arial";
ctx.fillText(e.name, e.x-10, e.y-5);
ctx.fillStyle="#f97316";
}

// UI
document.getElementById("count").innerText = enemies.length;
}

// ================= LOOP =================
function loop(){
update();
draw();
requestAnimationFrame(loop);
}

addEventListener("keydown", e=>{
if(e.key === " ") jump();
});

loop();

</script>

</body>
</html>
