<script>
// ────────────────────────────────────────────────
// DEFAULT DATA
// ────────────────────────────────────────────────
const defaultProducts = [
  {
    id: "dragon-fidget",
    name: "Dragon Fidget",
    description: "Articulated 3D printed dragon fidget toy – posable wings, flexible body, great for stress relief or display.",
    price: 19.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/2c3e50/ffffff?text=Dragon+Fidget"
  },
  {
    id: "star-fidget",
    name: "Star Fidget",
    description: "Expanding sensory star fidget – collapses and expands with satisfying motion, optional handle for extra spin.",
    price: 14.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/34495e/ffffff?text=Star+Fidget"
  },
  {
    id: "gear-fidget",
    name: "Gear Fidget",
    description: "Print-in-place gear spinner – multiple interlocking gears for smooth, quiet mechanical fidgeting.",
    price: 11.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/7f8c8d/ffffff?text=Gear+Fidget"
  },
  {
    id: "heart-dish",
    name: "Heart Dish",
    description: "Cute heart-shaped dish – perfect for jewelry, keys, soap, candies, or small trinkets.",
    price: 15.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/e74c3c/ffffff?text=Heart+Dish"
  },
  {
    id: "cactus-toothpick",
    name: "Cactus Toothpick Holder",
    description: "Fun 3D printed cactus – push mechanism pops toothpicks out like spines, great for desk or parties.",
    price: 8.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/27ae60/ffffff?text=Cactus+Holder"
  },
  {
    id: "teacher-gifts",
    name: "Names and Teacher Gifts",
    description: "Personalized teacher appreciation set – custom tumblers, keychains, pouches, signs with names/messages.",
    price: 24.99,
    inStock: true,
    image: "https://via.placeholder.com/300x220/3498db/ffffff?text=Teacher+Gifts"
  }
];

const defaultColors = [
  { name: "Red",       hex: "#ff0000" },
  { name: "Blue",      hex: "#0000ff" },
  { name: "Black",     hex: "#000000" },
  { name: "Glow Green",hex: "#39ff14" },
  { name: "Purple",    hex: "#9b59b6" },
  { name: "Gold",      hex: "#ffd700" }
];

// ────────────────────────────────────────────────
// STATE & DOM REFERENCES
// ────────────────────────────────────────────────
let products = [];
let colors   = [];

let dom = {
  productsContainer: null,
  colorsContainer:   null,
  saveBtn:           null,
  savedMsg:          null,
  email:             null,
  footerText:        null,
  darkMode:          null,
  accentColor:       null,
  headerBg:          null
};

// ────────────────────────────────────────────────
// UTILITY
// ────────────────────────────────────────────────
function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

// ────────────────────────────────────────────────
// RENDERING
// ────────────────────────────────────────────────
function renderProducts() {
  if (!dom.productsContainer) return;
  dom.productsContainer.innerHTML = '';

  products.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'product-item';
    div.innerHTML = `
      <div style="flex:1; min-width:320px;">
        <label>Product Name</label>
        <input type="text" value="${escapeHtml(p.name)}" data-idx="${i}" data-field="name">

        <label>Description</label>
        <textarea rows="3" data-idx="${i}" data-field="description">${escapeHtml(p.description||'')}</textarea>

        <label>Price ($)</label>
        <input type="number" step="0.01" min="0" value="${p.price.toFixed(2)}" data-idx="${i}" data-field="price">

        <label>Image URL</label>
        <input type="text" value="${escapeHtml(p.image)}" data-idx="${i}" data-field="image">

        <div class="switch-container" style="margin:12px 0;">
          <label class="switch">
            <input type="checkbox" ${p.inStock?'checked':''} data-idx="${i}" data-field="inStock">
            <span class="slider"></span>
          </label>
          <span class="status-badge ${p.inStock?'in-stock':'out-of-stock'}">
            ${p.inStock ? 'In Stock' : 'Out of Stock'}
          </span>
        </div>

        <button style="background:#e74c3c; color:white;" onclick="removeProduct(${i})">Remove Product</button>
      </div>
      <div style="margin-left:20px; text-align:center;">
        <img src="${p.image}" alt="${escapeHtml(p.name)}" class="product-preview"
             onerror="this.src='https://via.placeholder.com/120?text=No+Image';this.style.border='2px dashed #ccc';">
      </div>
    `;
    dom.productsContainer.appendChild(div);
  });

  // attach live listeners
  dom.productsContainer.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('input',  handleProductInput);
    el.addEventListener('change', handleProductInput);
  });
}

function renderColors() {
  if (!dom.colorsContainer) return;
  dom.colorsContainer.innerHTML = '';

  colors.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'color-item';
    div.innerHTML = `
      <input type="text"   value="${escapeHtml(c.name)}" data-idx="${i}" data-field="name"  data-type="color">
      <input type="color"  value="${c.hex}"             data-idx="${i}" data-field="hex"   data-type="color">
      <button onclick="removeColor(${i})">Remove</button>
    `;
    dom.colorsContainer.appendChild(div);
  });

  dom.colorsContainer.querySelectorAll('input').forEach(el => {
    el.addEventListener('input', handleColorInput);
  });
}

// ────────────────────────────────────────────────
// EVENT HANDLERS
// ────────────────────────────────────────────────
function handleProductInput(e) {
  const idx   = parseInt(e.target.dataset.idx);
  const field = e.target.dataset.field;
  if (isNaN(idx)) return;

  let value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (field === 'price') value = parseFloat(value) || 0;

  products[idx][field] = value;

  if (field === 'inStock') {
    const badge = e.target.closest('.product-item')?.querySelector('.status-badge');
    if (badge) {
      badge.textContent = value ? 'In Stock' : 'Out of Stock';
      badge.className   = `status-badge ${value ? 'in-stock' : 'out-of-stock'}`;
    }
  }
}

function handleColorInput(e) {
  const idx   = parseInt(e.target.dataset.idx);
  const field = e.target.dataset.field;
  if (isNaN(idx)) return;
  colors[idx][field] = e.target.value;
}

function addNewProduct() {
  const nameEl = document.getElementById('new-name');
  if (!nameEl?.value.trim()) return alert('Please enter a product name');

  const item = {
    id:          'custom-' + Date.now(),
    name:        nameEl.value.trim(),
    description: document.getElementById('new-desc')?.value.trim() || '',
    price:       parseFloat(document.getElementById('new-price')?.value) || 9.99,
    inStock:     document.getElementById('new-stock')?.checked ?? true,
    image:       document.getElementById('new-image')?.value.trim() || 'https://via.placeholder.com/300x220?text=New+Product'
  };

  products.push(item);
  renderProducts();

  // clear form
  nameEl.value = '';
  document.getElementById('new-desc').value  = '';
  document.getElementById('new-price').value = '9.99';
  document.getElementById('new-image').value = '';
  document.getElementById('new-stock').checked = true;
}

function removeProduct(idx) {
  if (!confirm('Remove this product permanently?')) return;
  products.splice(idx, 1);
  renderProducts();
}

function removeColor(idx) {
  if (!confirm('Remove this filament color?')) return;
  colors.splice(idx, 1);
  renderColors();
}

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
window.addEventListener('load', () => {
  try {
    // 1. Load data
    products = JSON.parse(localStorage.getItem('pervanProducts')) || defaultProducts;
    colors   = JSON.parse(localStorage.getItem('pervanColors'))   || defaultColors;

    // 2. Get DOM elements
    dom.productsContainer = document.getElementById('products-container');
    dom.colorsContainer   = document.getElementById('colors-container');
    dom.saveBtn           = document.getElementById('saveAll');
    dom.savedMsg          = document.getElementById('savedMsg');

    dom.email      = document.getElementById('email');
    dom.footerText = document.getElementById('footer-text');
    dom.darkMode   = document.getElementById('dark-mode');
    dom.accentColor = document.getElementById('accent-color');
    dom.headerBg   = document.getElementById('header-bg');

    if (!dom.productsContainer || !dom.colorsContainer) {
      throw new Error("Missing required containers: #products-container and/or #colors-container");
    }

    // 3. Restore general settings
    if (dom.email)      dom.email.value      = localStorage.getItem('pervanEmail')      || '';
    if (dom.footerText) dom.footerText.value = localStorage.getItem('pervanFooter')     || '© 2026 Pervan 3-D. All rights reserved.';
    if (dom.darkMode)   dom.darkMode.checked = localStorage.getItem('pervanDarkMode')   === 'true';
    if (dom.accentColor)dom.accentColor.value = localStorage.getItem('pervanAccent')    || '#ff6600';
    if (dom.headerBg)   dom.headerBg.value   = localStorage.getItem('pervanHeaderBg')   || '#111111';

    // 4. Inject "Add New Product" form
    const addForm = document.createElement('div');
    addForm.style.cssText = 'background:#f0f8ff; padding:20px; border-radius:8px; margin-bottom:25px; border:1px solid #ddd;';
    addForm.innerHTML = `
      <h3 style="margin-top:0;">Add New Product</h3>
      <label>Name</label><input type="text" id="new-name" placeholder="e.g. New Fidget Toy"><br>
      <label>Description</label><textarea id="new-desc" rows="2" placeholder="Short description"></textarea><br>
      <label>Price ($)</label><input type="number" step="0.01" id="new-price" value="9.99"><br>
      <label>Image URL</label><input type="text" id="new-image" placeholder="https://... (optional)"><br>
      <div class="switch-container">
        <label class="switch"><input type="checkbox" id="new-stock" checked><span class="slider"></span></label> In Stock
      </div>
      <button onclick="addNewProduct()">Add Product</button>
    `;
    dom.productsContainer.parentNode.insertBefore(addForm, dom.productsContainer);

    // 5. Initial render
    renderProducts();
    renderColors();

    // 6. Save button handler
    if (dom.saveBtn) {
      dom.saveBtn.addEventListener('click', () => {
        localStorage.setItem('pervanProducts', JSON.stringify(products));
        localStorage.setItem('pervanColors',   JSON.stringify(colors));

        if (dom.email)      localStorage.setItem('pervanEmail',     dom.email.value.trim());
        if (dom.footerText) localStorage.setItem('pervanFooter',    dom.footerText.value.trim());
        if (dom.darkMode)   localStorage.setItem('pervanDarkMode',  dom.darkMode.checked);
        if (dom.accentColor) localStorage.setItem('pervanAccent',   dom.accentColor.value);
        if (dom.headerBg)   localStorage.setItem('pervanHeaderBg',  dom.headerBg.value);

        if (dom.savedMsg) {
          dom.savedMsg.style.display = 'inline';
          setTimeout(() => dom.savedMsg.style.display = 'none', 5000);
        }
        alert('All changes saved!');
      });
    }

    console.log('Pervan 3-D Admin loaded successfully');

  } catch (err) {
    console.error('Admin load failed:', err);
    alert('Error loading admin panel:\n' + err.message + '\n\nCheck browser console (F12) for details.');
  }
});
</script>
