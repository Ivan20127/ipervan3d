<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Clicker</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111827;
    color:white;
}

.container{
    display:flex;
    min-height:100vh;
}

.left{
    width:60%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.right{
    width:40%;
    background:#1f2937;
    padding:20px;
    overflow-y:auto;
}

h1{
    margin-bottom:10px;
}

#productBtn{
    width:250px;
    height:250px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:90px;
    background:#374151;
    transition:.1s;
}

#productBtn:active{
    transform:scale(.95);
}

.stat{
    font-size:24px;
    margin:10px;
}

.upgrade{
    background:#374151;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.upgrade button{
    width:100%;
    padding:10px;
    border:none;
    cursor:pointer;
    background:#10b981;
    color:white;
    border-radius:6px;
    font-weight:bold;
}

.upgrade button:hover{
    background:#059669;
}

.small{
    color:#9ca3af;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="left">
    <h1>🖨️ Print Clicker</h1>

    <div class="stat">
        Products Printed:
        <span id="prints">0</span>
    </div>

    <div class="stat">
        Prints / Second:
        <span id="pps">0</span>
    </div>

    <button id="productBtn">🐉</button>

    <div class="small">
        Click to print a dragon!
    </div>
</div>

<div class="right">

<h2>Upgrades</h2>

<div id="shop"></div>

</div>

</div>

<script>

let prints = 0;
let clickPower = 1;

const upgrades = [

{
name:"Better Filament",
cost:25,
pps:1,
owned:0,
emoji:"🧵"
},

{
name:"Second Printer",
cost:100,
pps:5,
owned:0,
emoji:"🖨️"
},

{
name:"Print Farm",
cost:500,
pps:25,
owned:0,
emoji:"🏭"
},

{
name:"Dragon Factory",
cost:2000,
pps:100,
owned:0,
emoji:"🐉"
},

{
name:"Robot Operator",
cost:10000,
pps:500,
owned:0,
emoji:"🤖"
},

{
name:"Mega Production Facility",
cost:50000,
pps:2500,
owned:0,
emoji:"🚀"
}

];

const printsEl = document.getElementById("prints");
const ppsEl = document.getElementById("pps");
const shopEl = document.getElementById("shop");

function updateDisplay(){

printsEl.textContent =
Math.floor(prints);

ppsEl.textContent =
getPPS();

renderShop();
}

function getPPS(){

let total = 0;

upgrades.forEach(u=>{
total += u.pps * u.owned;
});

return total;
}

document.getElementById("productBtn")
.addEventListener("click",()=>{

prints += clickPower;

updateDisplay();

});

function renderShop(){

shopEl.innerHTML = "";

upgrades.forEach((u,index)=>{

const div =
document.createElement("div");

div.className = "upgrade";

div.innerHTML = `
<h3>${u.emoji} ${u.name}</h3>
<p>Owned: ${u.owned}</p>
<p>+${u.pps} Prints/sec</p>
<p>Cost: ${Math.floor(u.cost)}</p>
<button onclick="buyUpgrade(${index})">
Buy
</button>
`;

shopEl.appendChild(div);

});

}

window.buyUpgrade = function(index){

const u = upgrades[index];

if(prints >= u.cost){

prints -= u.cost;

u.owned++;

u.cost *= 1.35;

updateDisplay();
}
}

setInterval(()=>{

prints += getPPS()/10;

updateDisplay();

},100);

updateDisplay();

</script>

</body>
</html>
