<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pervan 3-D Admin</title>

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f4f4;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{text-align:center}

.section{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:30px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select{
width:100%;
padding:8px;
margin-top:4px;
border:1px solid #ccc;
border-radius:4px;
}

button{
margin-top:15px;
background:#dc3545;
color:white;
border:none;
padding:12px 20px;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{background:#b92c3a}

.success{
color:green;
font-weight:bold;
display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Pervan 3-D Admin Panel</h1>

<div class="section">

<label>Select Product</label>
<select id="productSelect"></select>

<label>Product Name</label>
<input id="name">

<label>Price</label>
<input id="price" type="number">

<label>Image URL</label>
<input id="image">

<label>Colors (comma separated)</label>
<input id="colors">

<label>In Stock</label>
<select id="stock">
<option value="true">In Stock</option>
<option value="false">Out of Stock</option>
</select>

<button onclick="saveProduct()">Save Product</button>
<span id="saved" class="success">Saved!</span>

</div>

<div class="section">

<h2>Add New Product</h2>

<label>Name</label>
<input id="newName">

<label>Price</label>
<input id="newPrice" type="number">

<label>Image URL</label>
<input id="newImage">

<label>Colors</label>
<input id="newColors">

<button onclick="addNew()">Add Product</button>

</div>

</div>

<script>

/* ============================
   DATA
============================ */

let products = JSON.parse(localStorage.getItem("pervanProducts")) || [

{ name:"Tree Fidget", price:4, image:"treefidget.png", colors:"Red,Blue,Black", stock:true },
{ name:"Dragon Fidget", price:5, image:"dragon.png", colors:"Red,Blue,Black", stock:true },
{ name:"Star Fidget", price:5, image:"star.png", colors:"Red,Blue,Black", stock:true },
{ name:"Gear Fidget", price:2, image:"gearfidget.png", colors:"Red,Blue,Black", stock:true },
{ name:"Cactus Toothpick Holder", price:15, image:"cactus.png", colors:"Red,Blue,Black", stock:true },
{ name:"Names", price:3, image:"names.png", colors:"Red,Blue,Black", stock:true },
{ name:"Teacher Gift", price:6, image:"teachergift.png", colors:"Red,Blue,Black", stock:true },
{ name:"Heart Dish", price:6, image:"heartdish.png", colors:"Red,Blue,Black", stock:true },
{ name:"Spring Fidget", price:3, image:"spring.png", colors:"Red,Blue,Black", stock:true }

];

/* ============================
   LOAD DROPDOWN
============================ */

const select = document.getElementById("productSelect");

function loadDropdown(){
select.innerHTML="";
products.forEach((p,i)=>{
let o=document.createElement("option");
o.value=i;
o.textContent=p.name;
select.appendChild(o);
});
loadFields(0);
}

loadDropdown();

/* ============================
   LOAD FIELDS
============================ */

function loadFields(i){
let p=products[i];
name.value=p.name;
price.value=p.price;
image.value=p.image;
colors.value=p.colors;
stock.value=p.stock;
}

/* ============================
   SAVE EDIT
============================ */

function saveProduct(){
let i=productSelect.value;

products[i]={
name:name.value,
price:Number(price.value),
image:image.value,
colors:colors.value,
stock:stock.value==="true"
};

localStorage.setItem("pervanProducts",JSON.stringify(products));

saved.style.display="inline";
setTimeout(()=>saved.style.display="none",2000);

loadDropdown();
productSelect.value=i;
}

/* ============================
   ADD PRODUCT
============================ */

function addNew(){
products.push({
name:newName.value,
price:Number(newPrice.value),
image:newImage.value,
colors:newColors.value,
stock:true
});

localStorage.setItem("pervanProducts",JSON.stringify(products));

newName.value="";
newPrice.value="";
newImage.value="";
newColors.value="";

loadDropdown();
alert("Product Added");
}

/* ============================
   CHANGE SELECT
============================ */

productSelect.onchange=()=>{
loadFields(productSelect.value);
};

</script>

</body>
</html>
