<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3D Print Empire</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  background:#000;
}

button{
  cursor:pointer;
  padding:10px;
  margin-top:5px;
}

#click{
  font-size:30px;
  padding:20px;
  margin:20px auto;
  display:block;
}

#shop{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  padding:20px;
}

.card{
  background:#1f1f1f;
  padding:10px;
  border-radius:10px;
}

/* RARITIES */
.common{color:#ccc;}
.uncommon{color:#22c55e;}
.rare{color:#3b82f6;}
.epic{color:#a855f7;}
.legendary{
  color:#f59e0b;
  text-shadow:0 0 10px #f59e0b;
}
.mythic{
  color:#ef4444;
  text-shadow:0 0 10px red,0 0 20px red;
}
</style>
</head>

<body>

<header>
<h1>🖨️ Pervan 3D Print Empire</h1>
<div>Prints: <span id="prints">0</span></div>
<div>Prints/sec: <span id="pps">0</span></div>
</header>

<button id="click">🖨️ PRINT</button>

<div id="shop"></div>

<script>

// ===== PRODUCTS =====
const products = [
{name:"Gear Fidget",price:2,rarity:"Common",unlock:0,pps:1},
{name:"Spring Fidget",price:2,rarity:"Common",unlock:50,pps:2},
{name:"Whistle Keychain",price:2,rarity:"Common",unlock:100,pps:3},

{name:"Tree Fidget",price:3,rarity:"Uncommon",unlock:200,pps:5},
{name:"Clicker Fidget",price:3,rarity:"Uncommon",unlock:500,pps:8},
{name:"Articulated Shark",price:4,rarity:"Uncommon",unlock:1000,pps:15},

{name:"Dragon Fidget",price:5,rarity:"Rare",unlock:2000,pps:30},
{name:"Pig Keychain",price:5,rarity:"Rare",unlock:5000,pps:50},
{name:"Otter",price:5,rarity:"Rare",unlock:8000,pps:70},
{name:"Heart Dish",price:5,rarity:"Rare",unlock:12000,pps:90},

{name:"Knight Pen Holder",price:8,rarity:"Epic",unlock:20000,pps:200},
{name:"Alligator Fidget",price:7,rarity:"Epic",unlock:30000,pps:300},

{name:"Air Pressure Tank",price:11,rarity:"Legendary",unlock:80000,pps:1000},

{name:"Cactus Toothpick Holder",price:15,rarity:"Mythic",unlock:300000,pps:8000}
];

let prints = 0;
let total = 0;

const owned = {};
products.forEach(p=>owned[p.name]=0);

// ===== CLICK =====
document.getElementById("click").onclick=()=>{
prints++;
total++;
render();
};

// ===== PPS =====
function getPPS(){
let sum=0;
products.forEach(p=>{
sum += owned[p.name]*p.pps;
});
return sum;
}

// ===== BUY =====
function buy(i){
let p = products[i];
let cost = Math.floor(p.price*10*Math.pow(1.15,owned[p.name]));

if(prints>=cost){
prints-=cost;
owned[p.name]++;
render();
}
}

// ===== RENDER =====
function render(){

document.getElementById("prints").innerText=Math.floor(prints);
document.getElementById("pps").innerText=getPPS();

let shop=document.getElementById("shop");
shop.innerHTML="";

products.forEach((p,i)=>{

if(total>=p.unlock){

let cost=Math.floor(p.price*10*Math.pow(1.15,owned[p.name]));

shop.innerHTML+=`
<div class="card ${p.rarity.toLowerCase()}">
<h3>${p.name}</h3>
<p>${p.rarity}</p>
<p>Owned: ${owned[p.name]}</p>
<p>+${p.pps}/sec</p>
<p>Cost: ${cost}</p>
<button onclick="buy(${i})">Print</button>
</div>
`;

}

});

// mythic event
if(total>=300000 && !window.mythic){
window.mythic=true;
alert("🔥 MYTHIC UNLOCKED: CACTUS TOOTHPICK HOLDER 🔥");
document.body.style.background="#2a0000";
}

save();
}

// ===== SAVE =====
function save(){
localStorage.setItem("pervan3d",JSON.stringify({prints,total,owned}));
}

// ===== LOAD =====
function load(){
let data=JSON.parse(localStorage.getItem("pervan3d"));
if(!data)return;

prints=data.prints;
total=data.total;

Object.keys(data.owned).forEach(k=>{
owned[k]=data.owned[k];
});
}

// ===== LOOP =====
setInterval(()=>{
let income=getPPS()/10;
prints+=income;
total+=income;
render();
},100);

load();
render();

</script>

</body>
</html>
