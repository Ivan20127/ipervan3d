<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print Wars v2</title>
<style>
body{margin:0;overflow:hidden;background:#0b1020;font-family:Arial}
canvas{display:block}

/* UI */
#ui{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:16px;
z-index:10;
}

/* flashy hazard colors */
@keyframes flash{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(360deg)}
}
</style>
</head>
<body>

<div id="ui">
Level: <span id="level">1</span><br>
Lives: <span id="lives">3</span><br>
Power: <span id="power">None</span>
</div>

<canvas id="c" width="900" height="500"></canvas>

<script>

// ================= SOUND ENGINE =================
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function beep(freq,dur,type="sine"){
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
o.frequency.value=freq;
o.type=type;
o.connect(g);
g.connect(audioCtx.destination);
o.start();
g.gain.setValueAtTime(0.2,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
o.stop(audioCtx.currentTime+dur);
}

const SFX={
jump:()=>beep(300,0.1),
hit:()=>beep(120,0.2,"square"),
power:()=>beep(600,0.2),
boss:()=>beep(80,0.5,"sawtooth"),
fire:()=>beep(180,0.15,"triangle")
};

// ================= GAME =================
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let keys={};
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

let player={
x:100,y:300,w:20,h:40,
vx:0,vy:0,
onGround:false,
lives:3,
jumpBoost:1,
fireRes:false
};

const levels=[
{spikes:[[300,440],[500,440]],color:"#1e293b"},
{spikes:[[200,440],[600,440]],color:"#0f172a"},
{spikes:[[400,440]],color:"#1b263b"},
{spikes:[[250,440],[450,440],[650,440]],color:"#111827"},
{spikes:[],color:"#0b1020"}
];

let level=0;

let enemies=[];
let projectiles=[];
let boss=null;

let powerups=[
"PEBA","TPU","PETG"
];

// ================= INIT LEVEL =================
function loadLevel(l){
level=l;
document.getElementById("level").innerText=l+1;

enemies=[];
projectiles=[];
boss=null;

for(let i=0;i<3+l*2;i++){
enemies.push({
x:200+i*100,
y:100,
w:25,h:25,
type:Math.random()<0.3?"fly":"normal",
dir:Math.random()<0.5?-1:1
});
}

player.x=100;
player.y=300;
player.vy=0;
}

// ================= BOSS =================
function spawnBoss(){
boss={
x:700,y:200,w:80,h:80,
hp:20
};
SFX.boss();
}

// ================= POWER UPS =================
let activePower=null;
let powerTimer=0;

// ================= INPUT =================
addEventListener("keydown",e=>{
if(e.key===" ")jump();
});

function jump(){
if(player.onGround){
player.vy=-12*(player.jumpBoost||1);
player.onGround=false;
SFX.jump();
}
}

// ================= COLLISION =================
function hit(a,b){
return a.x<a.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y;
}

// ================= UPDATE =================
function update(){

// gravity
player.vy+=0.6;
player.y+=player.vy;

// move
if(keys["ArrowLeft"])player.x-=4;
if(keys["ArrowRight"])player.x+=4;

// ground
if(player.y>420){
player.y=420;
player.vy=0;
player.onGround=true;
}

// spikes
levels[level].spikes.forEach(s=>{
if(player.x<s[0]+20 && player.x+20>s[0] && player.y>420){
damage();
}
});

// enemies
enemies.forEach(e=>{
e.x+=e.dir*2;

// flying
if(e.type==="fly"){
e.y+=Math.sin(Date.now()/200)*2;
}

// fire breath
if(Math.random()<0.01){
SFX.fire();
projectiles.push({x:e.x,y:e.y,vx:e.dir*4});
}

// hit player
if(Math.abs(player.x-e.x)<20 && Math.abs(player.y-e.y)<20){
damage();
}

// stomp
if(player.y<e.y){
e.dead=true;
}
});

// projectiles
projectiles.forEach(p=>{
p.x+=p.vx;

if(Math.abs(p.x-player.x)<15){
if(!player.fireRes)damage();
}
});

// remove dead
enemies=enemies.filter(e=>!e.dead);

// boss spawn
if(level===4 && !boss && enemies.length===0){
spawnBoss();
}

// boss logic
if(boss){
if(player.x<boss.x)boss.x-=1;
else boss.x+=1;

// fire attack
if(Math.random()<0.05){
SFX.fire();
projectiles.push({x:boss.x,y:boss.y,vx:-4});
}

// hit boss
if(Math.abs(player.x-boss.x)<30 && player.y<boss.y){
boss.hp--;
SFX.hit();
if(boss.hp<=0){
alert("YOU DEFEATED THE MYTHIC PRINT BOSS!");
loadLevel(0);
player.lives=3;
}
}
}

// powerup timer
if(powerTimer>0){
powerTimer--;
if(powerTimer<=0){
activePower=null;
player.jumpBoost=1;
player.fireRes=false;
document.getElementById("power").innerText="None";
}
}
}

// ================= DAMAGE =================
function damage(){
if(player.fireRes)return;

player.lives--;
SFX.hit();
document.getElementById("lives").innerText=player.lives;

if(player.lives<=0){
alert("GAME OVER");
location.reload();
}
}

// ================= POWER UPS =================
function pickupPower(p){
SFX.power();

if(p==="PEBA"){
player.lives++;
activePower="PEBA +1 Life";
}

if(p==="TPU"){
player.jumpBoost=1.6;
activePower="TPU Jump Boost";
powerTimer=600;
}

if(p==="PETG"){
player.fireRes=true;
activePower="PETG Fire Resist";
powerTimer=600;
}

document.getElementById("power").innerText=activePower;
}

// ================= DRAW =================
function draw(){

ctx.fillStyle=levels[level].color;
ctx.fillRect(0,0,900,500);

// spikes
ctx.fillStyle="red";
levels[level].spikes.forEach(s=>{
ctx.fillRect(s[0],450,20,20);
});

// player
ctx.fillStyle="white";
ctx.fillRect(player.x,player.y,20,40);

// enemies
enemies.forEach(e=>{
ctx.fillStyle=e.type==="fly"?"cyan":"orange";
ctx.fillRect(e.x,e.y,25,25);
});

// boss
if(boss){
ctx.fillStyle="purple";
ctx.fillRect(boss.x,boss.y,boss.w,boss.h);
}

// fire
ctx.fillStyle="yellow";
projectiles.forEach(p=>{
ctx.fillRect(p.x,p.y,10,5);
});
}

// ================= LOOP =================
function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loadLevel(0);
loop();

</script>

</body>
</html>
