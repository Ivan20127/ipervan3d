<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pervan 3-D Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f8f9fa;color:#333;padding:20px;}
h1{text-align:center;margin-bottom:10px;}
.subtitle{text-align:center;color:#666;margin-bottom:40px;}
.container{max-width:1000px;margin:auto;}
.section{background:#fff;border-radius:10px;padding:30px;margin:30px 0;box-shadow:0 4px 12px rgba(0,0,0,.1);}
label{display:block;margin:10px 0 5px;font-weight:bold;}
input[type="text"],input[type="number"],input[type="file"],input[type="email"],input[type="color"]{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;}
.switch-container{display:flex;align-items:center;margin:10px 0;}
.switch{position:relative;display:inline-block;width:60px;height:34px;margin-right:10px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:34px;}
.slider:before{position:absolute;content:"";height:26px;width:26px;left:4px;bottom:4px;background:white;transition:.4s;border-radius:50%;}
input:checked + .slider{background:#28a745;}
input:checked + .slider:before{transform:translateX(26px);}
.status-badge{padding:4px 10px;border-radius:15px;font-size:.9em;font-weight:bold;margin-left:10px;}
.in-stock{background:#28a745;color:#fff;}
.out-of-stock{background:#dc3545;color:#fff;}
button{background:#ff6600;color:#fff;border:none;padding:12px 30px;border-radius:6px;font-size:1em;cursor:pointer;margin-top:10px;}
button:hover{background:#e65c00;}
.product-item,.color-item{display:flex;align-items:center;justify-content:space-between;background:#f9f9f9;padding:10px;border-radius:6px;margin:10px 0;flex-wrap:wrap;gap:10px;}
.product-preview{max-width:120px;border:1px solid #ddd;border-radius:6px;}
.size-price-row{display:flex;gap:20px;}
.size-price-row>div{flex:1;}
.saved{color:#28a745;font-weight:bold;margin-left:15px;display:none;}
</style>
</head>
<body>
<div class="container">
<h1>Pervan 3-D Admin</h1>
<p class="subtitle">Control products, prices, colors, and site appearance</p>

<div class="section">
<h2>Colors / Filaments</h2>
<div id="colors-container"></div>
</div>

<div class="section">
<h2>Products</h2>
<div id="products-container"></div>
</div>

<div class="section">
<h2>General Settings</h2>
<label>Email:</label><input type="email" id="email" placeholder="your@email.com">
<label>Footer Text:</label><input type="text" id="footer-text" placeholder="© 2026 Pervan 3-D. All rights reserved.">
<div class="switch-container">
<label class="switch"><input type="checkbox" id="dark-mode"><span class="slider"></span></label> Dark Mode
</div>
<label>Accent Color:</label><input type="color" id="accent-color" value="#ff6600">
<label>Header/Footer BG:</label><input type="color" id="header-bg" value="#111111">
<button id="saveAll">Save All Changes</button>
<span class="saved" id="savedMsg">✓ Changes Saved!</span>
</div>
</div>

<script>
