<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D Print Wars</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:#07111f;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    user-select:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    image-rendering:auto;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10;

    background:rgba(4,10,20,.82);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;

    padding:10px 14px;

    font-size:14px;
    line-height:1.55;

    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

#hud span{
    font-weight:bold;
}

#score{
    color:#facc15;
}

#coins{
    color:#60a5fa;
}

#level{
    color:#4ade80;
}

#lives{
    color:#fb7185;
}

#power{
    color:#c084fc;
}

#message{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(2,6,15,.55);
}

.panel{
    width:min(520px,90vw);

    text-align:center;

    padding:35px;

    background:rgba(8,15,30,.96);

    border:1px solid rgba(96,165,250,.35);

    border-radius:22px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);
}

.panel h1{
    margin:0 0 10px;

    font-size:46px;

    background:
        linear-gradient(
            90deg,
            #22d3ee,
            #60a5fa,
            #a78bfa,
            #f472b6
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.panel p{
    color:#cbd5e1;
    line-height:1.6;
}

button{
    border:0;
    border-radius:12px;

    padding:13px 28px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

.hidden{
    display:none!important;
}

#touch{
    position:fixed;
    left:0;
    right:0;
    bottom:18px;

    display:none;

    justify-content:space-between;

    padding:0 18px;

    z-index:15;

    pointer-events:none;
}

.touchGroup{
    display:flex;
    gap:10px;
}

.touchButton{
    width:58px;
    height:58px;

    border-radius:50%;

    background:rgba(15,23,42,.8);

    border:1px solid rgba(255,255,255,.2);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    pointer-events:auto;
    touch-action:none;
}

@media(max-width:700px){

    #touch{
        display:flex;
    }

    #hud{
        font-size:11px;
    }

    .panel h1{
        font-size:34px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    ❤️ Lives:
    <span id="lives">♥ ♥ ♥</span>

    <br>

    ⭐ Score:
    <span id="score">0</span>

    &nbsp;&nbsp;

    🧵 Filament:
    <span id="coins">0</span>

    <br>

    🌎 Level:
    <span id="level">1-1</span>

    &nbsp;&nbsp;

    🔥 Power:
    <span id="power">Normal</span>

    <br>

    <small style="color:#94a3b8">
        ← → Run &nbsp; SPACE Jump &nbsp; X Dash
    </small>

</div>

<div id="message">

    <div class="panel">

        <h1>3D PRINT WARS</h1>

        <p id="messageText">

            The factory has gone wild!<br><br>

            Run through the print factory,
            collect filament,
            stomp rogue prints,
            and reach the giant printer.

        </p>

        <button id="startButton">
            START PRINT
        </button>

    </div>

</div>

<div id="touch">

    <div class="touchGroup">

        <div class="touchButton" data-key="ArrowLeft">
            ◀
        </div>

        <div class="touchButton" data-key="ArrowRight">
            ▶
        </div>

    </div>

    <div class="touchGroup">

        <div class="touchButton" data-key=" ">
            ▲
        </div>

        <div class="touchButton" data-key="x">
            ⚡
        </div>

    </div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const VIEW_W = 960;
const VIEW_H = 540;

canvas.width = VIEW_W;
canvas.height = VIEW_H;


/* =========================================================
   AUDIO
========================================================= */

let audio = null;

function startAudio(){

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audio.state === "suspended"){
        audio.resume();
    }
}

function beep(
    frequency,
    duration=.08,
    type="square",
    volume=.05
){

    if(!audio) return;

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    osc.stop(
        audio.currentTime + duration
    );
}


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        if(
            ["ArrowLeft",
             "ArrowRight",
             " ",
             "ArrowUp",
             "x",
             "X"].includes(e.key)
        ){
            e.preventDefault();
        }

        keys[e.key] = true;

        if(
            e.key === " " ||
            e.key === "ArrowUp"
        ){
            jump();
        }

        if(
            e.key === "x" ||
            e.key === "X"
        ){
            dash();
        }
    }
);

window.addEventListener(
    "keyup",
    e => {
        keys[e.key] = false;
    }
);


/* =========================================================
   TOUCH
========================================================= */

document
.querySelectorAll(".touchButton")
.forEach(button => {

    const key =
        button.dataset.key;

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

            if(key === " "){
                jump();
            }

            if(key === "x"){
                dash();
            }
        }
    );

    button.addEventListener(
        "pointerup",
        () => {
            keys[key] = false;
        }
    );

    button.addEventListener(
        "pointercancel",
        () => {
            keys[key] = false;
        }
    );
});


/* =========================================================
   WORLD
========================================================= */

const world = {

    width:5000,

    groundY:450,

    cameraX:0,

    level:1,

    finished:false

};


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:100,

    y:350,

    w:30,

    h:52,

    vx:0,

    vy:0,

    acceleration:.65,

    maxSpeed:6,

    friction:.78,

    jumpPower:13,

    onGround:false,

    facing:1,

    lives:3,

    invincible:0,

    dashCooldown:0,

    dashTimer:0,

    big:false,

    starTimer:0

};


/* =========================================================
   GAME
========================================================= */

const game = {

    started:false,

    over:false,

    score:0,

    filament:0,

    enemiesDefeated:0

};


/* =========================================================
   OBJECT ARRAYS
========================================================= */

let platforms = [];
let blocks = [];
let enemies = [];
let collectibles = [];
let powerups = [];
let particles = [];
let texts = [];


/* =========================================================
   PRODUCT TYPES
========================================================= */

const products = [

    "Gear Fidget",
    "Dragon",
    "Pig",
    "Otter",
    "Shark",
    "Knight Holder",
    "Cactus",
    "Air Tank"

];


/* =========================================================
   LEVEL CREATION
========================================================= */

function createLevel(){

    platforms = [];
    blocks = [];
    enemies = [];
    collectibles = [];
    powerups = [];

    world.width = 5200;


    /*
       GROUND SECTIONS

       The gaps are intentional.
       Falling into one costs a life.
    */

    addPlatform(
        0,
        450,
        750,
        90
    );

    addPlatform(
        850,
        450,
        650,
        90
    );

    addPlatform(
        1620,
        450,
        600,
        90
    );

    addPlatform(
        2350,
        450,
        900,
        90
    );

    addPlatform(
        3400,
        450,
        800,
        90
    );

    addPlatform(
        4350,
        450,
        850,
        90
    );


    /*
       FLOATING PLATFORMS
    */

    addPlatform(430,360,170,25);
    addPlatform(650,300,130,25);

    addPlatform(980,350,150,25);
    addPlatform(1210,280,150,25);

    addPlatform(1740,350,150,25);
    addPlatform(1970,290,140,25);

    addPlatform(2500,340,180,25);
    addPlatform(2780,270,160,25);

    addPlatform(3050,350,150,25);

    addPlatform(3500,330,160,25);
    addPlatform(3750,270,160,25);

    addPlatform(4500,340,160,25);
    addPlatform(4770,280,160,25);


    /*
       QUESTION / PRINT BLOCKS
    */

    addBlock(500,300);
    addBlock(550,300);

    addBlock(1030,290);
    addBlock(1080,290);

    addBlock(1780,290);

    addBlock(2550,280);
    addBlock(2600,280);

    addBlock(3600,270);
    addBlock(3650,270);

    addBlock(4550,280);


    /*
       FILAMENT
    */

    filamentLine(180,390,7,45);

    filamentLine(460,320,4,45);

    filamentLine(880,390,8,50);

    filamentLine(1030,250,4,45);

    filamentLine(1640,390,8,50);

    filamentLine(1780,250,4,45);

    filamentLine(2400,390,10,50);

    filamentLine(2550,240,4,45);

    filamentLine(3450,390,9,50);

    filamentLine(3600,230,4,45);

    filamentLine(4400,390,10,50);

    filamentLine(4550,230,4,45);


    /*
       ENEMIES
    */

    addEnemy(380);
    addEnemy(720);

    addEnemy(1020);
    addEnemy(1160);

    addEnemy(1700);
    addEnemy(2020);

    addEnemy(2450);
    addEnemy(2920);
    addEnemy(3150);

    addEnemy(3500);
    addEnemy(3900);

    addEnemy(4420);
    addEnemy(4750);


    /*
       POWER UPS
    */

    addPowerup(
        555,
        250,
        "printer"
    );

    addPowerup(
        1840,
        240,
        "star"
    );

    addPowerup(
        3650,
        220,
        "printer"
    );


    /*
       FINAL PRINTER
    */

    world.finishX = 5000;
}


/* =========================================================
   LEVEL HELPERS
========================================================= */

function addPlatform(
    x,
    y,
    w,
    h
){

    platforms.push({
        x,
        y,
        w,
        h
    });

}


function addBlock(
    x,
    y
){

    blocks.push({

        x,
        y,

        w:42,
        h:42,

        used:false

    });

}


function filamentLine(
    x,
    y,
    amount,
    spacing
){

    for(let i=0;i<amount;i++){

        collectibles.push({

            x:x+i*spacing,

            y:y,

            r:9,

            collected:false

        });

    }

}


function addEnemy(x){

    enemies.push({

        x,

        y:390,

        w:34,

        h:34,

        vx:0,

        speed:
            1 +
            Math.random()*.5,

        direction:
            Math.random()>.5
                ?1
                :-1,

        alive:true,

        name:
            products[
                Math.floor(
                    Math.random()*
                    products.length
                )
            ]

    });

}


function addPowerup(
    x,
    y,
    type
){

    powerups.push({

        x,

        y,

        w:26,

        h:26,

        type,

        collected:false

    });

}


/* =========================================================
   COLLISION
========================================================= */

function overlap(a,b){

    return (

        a.x < b.x+b.w &&

        a.x+a.w > b.x &&

        a.y < b.y+b.h &&

        a.y+a.h > b.y

    );

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !game.started ||
        game.over
    ) return;

    if(player.onGround){

        player.vy =
            -player.jumpPower;

        player.onGround=false;

        beep(
            480,
            .08,
            "square"
        );

    }

}


/* =========================================================
   DASH
========================================================= */

function dash(){

    if(
        !game.started ||
        game.over
    ) return;

    if(
        player.dashCooldown <=0
    ){

        player.dashTimer=10;

        player.dashCooldown=65;

        player.vx =
            player.facing*13;

        beep(
            180,
            .1,
            "sawtooth"
        );

        burst(
            player.x,
            player.y+25,
            "#60a5fa",
            8
        );

    }

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(){

    /*
       Running
    */

    if(keys["ArrowLeft"]){

        player.vx -=
            player.acceleration;

        player.facing=-1;

    }

    if(keys["ArrowRight"]){

        player.vx +=
            player.acceleration;

        player.facing=1;

    }


    /*
       Friction
    */

    if(
        !keys["ArrowLeft"] &&
        !keys["ArrowRight"]
    ){

        player.vx *=
            player.friction;

    }


    player.vx =
        Math.max(
            -player.maxSpeed,
            Math.min(
                player.maxSpeed,
                player.vx
            )
        );


    /*
       Dash
    */

    if(player.dashTimer>0){

        player.dashTimer--;

        player.vx *= .96;

    }

    if(player.dashCooldown>0){
        player.dashCooldown--;
    }


    /*
       Gravity
    */

    player.vy += .6;


    /*
       Move horizontally
    */

    player.x += player.vx;


    /*
       Move vertically
    */

    const oldBottom =
        player.y+player.h;

    player.y += player.vy;

    player.onGround=false;


    /*
       Platform collision
    */

    for(
        const platform of platforms
    ){

        if(

            player.x+
            player.w >
            platform.x &&

            player.x <
            platform.x+
            platform.w &&

            oldBottom <=
            platform.y &&

            player.y+
            player.h >=
            platform.y &&

            player.vy>=0

        ){

            player.y =
                platform.y-
                player.h;

            player.vy=0;

            player.onGround=true;

        }

    }


    /*
       Bounds
    */

    if(player.x<0){
        player.x=0;
        player.vx=0;
    }


    /*
       Camera
    */

    world.cameraX =
        player.x-300;

    world.cameraX =
        Math.max(
            0,
            Math.min(
                world.width-
                VIEW_W,
                world.cameraX
            )
        );


    /*
       Falling into pit
    */

    if(player.y>600){

        loseLife();

    }


    /*
       Invincibility
    */

    if(player.invincible>0){
        player.invincible--;
    }

    if(player.starTimer>0){
        player.starTimer--;
    }

}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(){

    for(
        const enemy of enemies
    ){

        if(!enemy.alive)
            continue;


        /*
           Enemy movement
        */

        enemy.x +=
            enemy.direction*
            enemy.speed;


        /*
           Turn around at edges
        */

        let supported=false;

        for(
            const p of platforms
        ){

            if(

                enemy.x+
                enemy.w >
                p.x &&

                enemy.x <
                p.x+p.w &&

                Math.abs(
                    enemy.y+
                    enemy.h-
                    p.y
                )<5

            ){

                supported=true;

            }

        }

        if(!supported){

            enemy.direction*=-1;

        }


        /*
           Player collision
        */

        if(
            overlap(player,enemy)
        ){

            /*
               Jumping on enemy
            */

            const playerBottom =
                player.y+
                player.h;

            if(
                player.vy>0 &&
                playerBottom-
                enemy.y<20
            ){

                enemy.alive=false;

                player.vy=-9;

                game.score+=250;

                game.enemiesDefeated++;

                burst(
                    enemy.x+17,
                    enemy.y+17,
                    "#f97316",
                    14
                );

                addText(
                    enemy.x,
                    enemy.y-10,
                    "+250",
                    "#facc15"
                );

                beep(
                    280,
                    .08,
                    "square"
                );

            }

            /*
               Star power
            */

            else if(
                player.starTimer>0
            ){

                enemy.alive=false;

                game.score+=500;

                burst(
                    enemy.x,
                    enemy.y,
                    "#facc15",
                    20
                );

                beep(
                    800,
                    .1,
                    "square"
                );

            }

            /*
               Otherwise damage
            */

            else{

                loseLife();

            }

        }

    }

    enemies =
        enemies.filter(
            enemy =>
                enemy.alive
        );

}


/* =========================================================
   BLOCKS
========================================================= */

function updateBlocks(){

    for(
        const block of blocks
    ){

        if(
            block.used
        ) continue;


        /*
           Player hits underside
        */

        if(

            player.vy<0 &&

            player.x+
            player.w >
            block.x &&

            player.x <
            block.x+
            block.w &&

            player.y <
            block.y+
            block.h &&

            player.y+
            player.h >
            block.y

        ){

            block.used=true;

            /*
               Mostly filament,
               occasionally power.
            */

            if(
                Math.random()<.75
            ){

                game.filament++;

                game.score+=100;

                addText(
                    block.x,
                    block.y-15,
                    "+FILAMENT",
                    "#60a5fa"
                );

                beep(
                    650,
                    .08,
                    "square"
                );

            }else{

                addPowerup(
                    block.x+8,
                    block.y-35,
                    "printer"
                );

                beep(
                    500,
                    .08,
                    "square"
                );

            }

            burst(
                block.x+21,
                block.y+20,
                "#facc15",
                7
            );

        }

    }

}


/* =========================================================
   COLLECTIBLES
========================================================= */

function updateCollectibles(){

    for(
        const item of collectibles
    ){

        if(item.collected)
            continue;


        const box={
            x:item.x-9,
            y:item.y-9,
            w:18,
            h:18
        };


        if(
            overlap(
                player,
                box
            )
        ){

            item.collected=true;

            game.filament++;

            game.score+=50;

            addText(
                item.x,
                item.y-15,
                "+50",
                "#60a5fa"
            );

            beep(
                900,
                .06,
                "sine"
            );

        }

    }

}


/* =========================================================
   POWERUPS
========================================================= */

function updatePowerups(){

    for(
        const item of powerups
    ){

        if(item.collected)
            continue;


        item.y +=
            Math.sin(
                Date.now()/150+
                item.x
            )*.15;


        if(
            overlap(
                player,
                item
            )
        ){

            item.collected=true;


            if(
                item.type==="printer"
            ){

                player.big=true;

                game.score+=500;

                addText(
                    player.x,
                    player.y-20,
                    "PRINT POWER!",
                    "#c084fc",
                    20
                );

                beep(
                    500,
                    .12,
                    "square"
                );

            }


            if(
                item.type==="star"
            ){

                player.starTimer=
                    600;

                game.score+=1000;

                addText(
                    player.x,
                    player.y-20,
                    "3D STAR!",
                    "#facc15",
                    20
                );

                beep(
                    900,
                    .15,
                    "square"
                );

            }

        }

    }

}


/* =========================================================
   FINISH
========================================================= */

function checkFinish(){

    if(
        player.x>=world.finishX
    ){

        finishLevel();

    }

}


function finishLevel(){

    if(world.finished)
        return;

    world.finished=true;

    game.score+=5000;

    message.classList.remove(
        "hidden"
    );

    document
    .getElementById("messageText")
    .innerHTML=`

        <strong style="color:#4ade80">
            PRINT COMPLETE!
        </strong>

        <br><br>

        You reached the
        giant 3D printer!

        <br><br>

        Score:
        <strong style="color:#facc15">
            ${game.score.toLocaleString()}
        </strong>

    `;

    document
    .getElementById("startButton")
    .textContent=
        "PRINT LEVEL 2";

    beep(
        600,
        .15,
        "square"
    );

}


/* =========================================================
   DAMAGE
========================================================= */

function loseLife(){

    if(
        player.invincible>0
    ) return;


    player.lives--;

    player.invincible=120;

    player.x=
        Math.max(
            100,
            player.x-100
        );

    player.y=300;

    player.vx=0;

    player.vy=-8;

    game.score=
        Math.max(
            0,
            game.score-300
        );


    beep(
        120,
        .25,
        "sawtooth"
    );


    if(
        player.lives<=0
    ){

        gameOver();

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    game.over=true;

    document
    .getElementById("message")
    .classList.remove(
        "hidden"
    );

    document
    .getElementById("messageText")
    .innerHTML=`

        The print factory got you!

        <br><br>

        Final Score:
        <strong style="color:#facc15">
            ${game.score.toLocaleString()}
        </strong>

        <br><br>

        Products defeated:
        ${game.enemiesDefeated}

    `;

    document
    .getElementById("startButton")
    .textContent=
        "TRY AGAIN";

}


/* =========================================================
   PARTICLES
========================================================= */

function burst(
    x,
    y,
    color,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*8,

            vy:
                (Math.random()-.5)*8,

            size:
                2+
                Math.random()*4,

            color,

            life:
                25+
                Math.random()*30

        });

    }

}


function updateParticles(){

    for(
        const p of particles
    ){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.18;

        p.life--;

    }

    particles =
        particles.filter(
            p=>p.life>0
        );

}


/* =========================================================
   FLOATING TEXT
========================================================= */

function addText(
    x,
    y,
    text,
    color="white",
    size=16
){

    texts.push({

        x,
        y,

        text,

        color,

        size,

        life:60

    });

}


function updateTexts(){

    for(
        const t of texts
    ){

        t.y-=.6;
        t.life--;

    }

    texts =
        texts.filter(
            t=>t.life>0
        );

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            VIEW_H
        );

    gradient.addColorStop(
        0,
        "#081426"
    );

    gradient.addColorStop(
        1,
        "#172554"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        VIEW_W,
        VIEW_H
    );


    /*
       Factory skyline
    */

    for(
        let i=0;
        i<20;
        i++
    ){

        const x =
            i*80-
            (world.cameraX*.2%
            80);

        const h =
            80+
            (i*37)%100;

        ctx.fillStyle =
            i%2
                ? "#0f1b2e"
                : "#142238";

        ctx.fillRect(
            x,
            450-h,
            65,
            h
        );


        /*
           Windows
        */

        ctx.fillStyle=
            "#38bdf8";

        for(
            let wy=
                470-h;
            wy<430;
            wy+=20
        ){

            ctx.fillRect(
                x+10,
                wy,
                6,
                7
            );

            ctx.fillRect(
                x+30,
                wy,
                6,
                7
            );

            ctx.fillRect(
                x+50,
                wy,
                6,
                7
            );

        }

    }

}


/* =========================================================
   DRAW PLATFORM
========================================================= */

function drawPlatform(p){

    /*
       Dark base
    */

    ctx.fillStyle=
        "#334155";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );


    /*
       3D printed top
    */

    ctx.fillStyle=
        "#64748b";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        7
    );


    /*
       Print lines
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.08)";

    ctx.lineWidth=2;

    for(
        let x=p.x+10;
        x<p.x+p.w;
        x+=15
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            p.y+10
        );

        ctx.lineTo(
            x,
            p.y+p.h
        );

        ctx.stroke();

    }

}


/* =========================================================
   DRAW BLOCK
========================================================= */

function drawBlock(block){

    ctx.fillStyle=
        block.used
            ? "#475569"
            : "#f59e0b";

    ctx.fillRect(
        block.x,
        block.y,
        block.w,
        block.h
    );


    ctx.strokeStyle=
        "#111827";

    ctx.lineWidth=3;

    ctx.strokeRect(
        block.x+2,
        block.y+2,
        block.w-4,
        block.h-4
    );


    /*
       3D print symbol
    */

    ctx.fillStyle=
        block.used
            ? "#64748b"
            : "#fff7ae";

    ctx.font=
        "bold 24px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        block.used
            ? "✓"
            : "?",
        block.x+21,
        block.y+29
    );

    ctx.textAlign="left";

}


/* =========================================================
   DRAW ENEMY
========================================================= */

function drawEnemy(enemy){

    /*
       Shadow
    */

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        enemy.x+17,
        enemy.y+36,
        22,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Body
    */

    ctx.fillStyle=
        "#f97316";

    ctx.beginPath();

    ctx.roundRect(
        enemy.x,
        enemy.y,
        enemy.w,
        enemy.h,
        7
    );

    ctx.fill();


    /*
       Printed layer lines
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.18)";

    ctx.lineWidth=2;

    for(
        let y=enemy.y+9;
        y<enemy.y+enemy.h;
        y+=7
    ){

        ctx.beginPath();

        ctx.moveTo(
            enemy.x+4,
            y
        );

        ctx.lineTo(
            enemy.x+
            enemy.w-4,
            y
        );

        ctx.stroke();

    }


    /*
       Eyes
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        enemy.x+10,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        enemy.x+24,
        enemy.y+12,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Name
    */

    ctx.font=
        "10px Arial";

    ctx.textAlign="center";

    ctx.fillStyle=
        "#e2e8f0";

    ctx.fillText(
        enemy.name,
        enemy.x+17,
        enemy.y-7
    );

    ctx.textAlign="left";

}


/* =========================================================
   DRAW FILAMENT
========================================================= */

function drawFilament(item){

    ctx.strokeStyle=
        "#60a5fa";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        item.r,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.strokeStyle=
        "#dbeafe";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        item.x,
        item.y,
        4,
        0,
        Math.PI*2
    );

    ctx.stroke();

}


/* =========================================================
   DRAW POWERUP
========================================================= */

function drawPowerup(item){

    ctx.fillStyle=
        item.type==="star"
            ? "#facc15"
            : "#c084fc";

    ctx.beginPath();

    ctx.arc(
        item.x+13,
        item.y+13,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="white";

    ctx.font=
        "bold 15px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        item.type==="star"
            ? "★"
            : "P",
        item.x+13,
        item.y+19
    );

    ctx.textAlign="left";

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    if(
        player.invincible>0 &&
        Math.floor(
            player.invincible/6
        )%2===0
    ){

        return;

    }


    const x=player.x;
    const y=player.y;

    const width=
        player.big
            ? 36
            : 30;

    const height=
        player.big
            ? 62
            : 52;


    /*
       Star glow
    */

    if(player.starTimer>0){

        ctx.shadowColor=
            "#facc15";

        ctx.shadowBlur=20;

    }


    /*
       Body
    */

    ctx.fillStyle=
        player.big
            ? "#a78bfa"
            : "#60a5fa";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y+15,
        width,
        height-15,
        7
    );

    ctx.fill();


    /*
       Head
    */

    ctx.fillStyle=
        "#f8fafc";

    ctx.beginPath();

    ctx.arc(
        x+width/2,
        y+10,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Visor
    */

    ctx.fillStyle=
        "#0f172a";

    ctx.fillRect(
        x+5,
        y+5,
        width-10,
        7
    );


    /*
       Printer-pack
    */

    ctx.fillStyle=
        "#7c3aed";

    ctx.fillRect(
        player.facing===1
            ? x-5
            : x+width,
        y+22,
        7,
        22
    );


    /*
       Legs
    */

    ctx.strokeStyle=
        "#e2e8f0";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        x+9,
        y+height-3
    );

    ctx.lineTo(
        x+5,
        y+height+7
    );

    ctx.moveTo(
        x+width-9,
        y+height-3
    );

    ctx.lineTo(
        x+width-5,
        y+height+7
    );

    ctx.stroke();


    ctx.shadowBlur=0;

}


/* =========================================================
   DRAW FINISH
========================================================= */

function drawFinish(){

    const x=world.finishX;


    /*
       Pole
    */

    ctx.fillStyle=
        "#e2e8f0";

    ctx.fillRect(
        x,
        210,
        8,
        240
    );


    /*
       Printer flag
    */

    ctx.fillStyle=
        "#a78bfa";

    ctx.beginPath();

    ctx.moveTo(
        x+8,
        220
    );

    ctx.lineTo(
        x+95,
        245
    );

    ctx.lineTo(
        x+8,
        270
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle=
        "white";

    ctx.font=
        "bold 13px Arial";

    ctx.fillText(
        "PRINT!",
        x+25,
        249
    );


    /*
       Giant printer
    */

    ctx.fillStyle=
        "#1e293b";

    ctx.fillRect(
        x+50,
        390,
        110,
        60
    );

    ctx.fillStyle=
        "#475569";

    ctx.fillRect(
        x+65,
        365,
        80,
        30
    );

    ctx.fillStyle=
        "#60a5fa";

    ctx.fillRect(
        x+80,
        375,
        50,
        8
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        VIEW_W,
        VIEW_H
    );


    drawBackground();


    /*
       Camera
    */

    ctx.save();

    ctx.translate(
        -world.cameraX,
        0
    );


    /*
       World objects
    */

    for(
        const p of platforms
    ){

        if(
            p.x+p.w>
            world.cameraX &&
            p.x<
            world.cameraX+
            VIEW_W
        ){

            drawPlatform(p);

        }

    }


    for(
        const block of blocks
    ){

        drawBlock(block);

    }


    for(
        const item of collectibles
    ){

        if(
            !item.collected
        ){

            drawFilament(item);

        }

    }


    for(
        const item of powerups
    ){

        if(
            !item.collected
        ){

            drawPowerup(item);

        }

    }


    for(
        const enemy of enemies
    ){

        drawEnemy(enemy);

    }


    drawFinish();

    drawPlayer();


    /*
       Particles
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/40
            );

        ctx.fillStyle=
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;


    /*
       Floating text
    */

    for(
        const t of texts
    ){

        ctx.globalAlpha=
            Math.min(
                1,
                t.life/20
            );

        ctx.fillStyle=
            t.color;

        ctx.font=
            `bold ${t.size}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );

    }

    ctx.globalAlpha=1;

    ctx.textAlign="left";

    ctx.restore();


    /*
       Power indicator
    */

    if(player.starTimer>0){

        ctx.fillStyle=
            "rgba(250,204,21,.08)";

        ctx.fillRect(
            0,
            0,
            VIEW_W,
            VIEW_H
        );

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        game.started &&
        !game.over &&
        !world.finished
    ){

        updatePlayer();

        updateEnemies();

        updateBlocks();

        updateCollectibles();

        updatePowerups();

        checkFinish();

    }


    updateParticles();

    updateTexts();

    updateHUD();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
    .getElementById("score")
    .textContent=
        game.score.toLocaleString();


    document
    .getElementById("coins")
    .textContent=
        game.filament;


    document
    .getElementById("level")
    .textContent=
        "1-1";


    document
    .getElementById("lives")
    .textContent=
        "♥ ".repeat(
            Math.max(
                0,
                player.lives
            )
        ).trim();


    let power="Normal";

    if(player.big)
        power="Print Power";

    if(player.starTimer>0)
        power="3D Star";


    document
    .getElementById("power")
    .textContent=
        power;

}


/* =========================================================
   START
========================================================= */

const message=
    document.getElementById(
        "message"
    );

const messageText=
    document.getElementById(
        "messageText"
    );

const startButton=
    document.getElementById(
        "startButton"
    );


startButton.addEventListener(
    "click",
    () => {

        startAudio();


        /*
           Reset
        */

        game.started=true;
        game.over=false;

        game.score=0;
        game.filament=0;
        game.enemiesDefeated=0;


        player.x=100;
        player.y=350;

        player.vx=0;
        player.vy=0;

        player.lives=3;

        player.big=false;

        player.starTimer=0;

        player.invincible=0;


        world.cameraX=0;

        world.finished=false;


        particles=[];
        texts=[];


        createLevel();


        message.classList.add(
            "hidden"
        );


        beep(
            440,
            .1,
            "square"
        );

        setTimeout(
            () => beep(
                660,
                .1,
                "square"
            ),
            100
        );

    }
);


/* =========================================================
   LOOP
========================================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


createLevel();

updateHUD();

loop();

</script>
