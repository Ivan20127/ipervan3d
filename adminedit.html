<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan Print Wars PRO</title>

<style>
body{
margin:0;
overflow:hidden;
background:#0b1220;
font-family:Arial;
color:white;
}

canvas{
display:block;
background:linear-gradient(#0f172a,#020617);
}

/* UI */
#ui{
position:fixed;
top:10px;
left:10px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
font-size:14px;
}

/* MOBILE CONTROLS */
#controls{
position:fixed;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
box-sizing:border-box;
}

.btn{
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.1);
border:2px solid white;
color:white;
font-size:20px;
text-align:center;
line-height:80px;
user-select:none;
}

</style>
</head>

<body>

<div id="ui">
<b>PERVAN PRINT WARS PRO</b><br>
Level: <span id="lvl">1</span><br>
Lives: <span id="lives">3</span><br>
Power: <span id="power">None</span>
</div>

<canvas id="c" width="900" height="500"></canvas>

<!-- MOBILE -->
<div id="controls">
<div class="btn" id="left">⬅</div>
<div class="btn" id="jump">⤒</div>
<div class="btn" id="right">➡</div>
</div>

<script>

// ================= SOUND =================
const audio = new (window.AudioContext||window.webkitAudioContext)();

function sfx(f,t=0.1,type="sine"){
let o=audio.createOscillator();
let g=audio.createGain();
o.type=type;
o.frequency.value=f;
o.connect(g);
g.connect(audio.destination);
g.gain.value=0.2;
o.start();
g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+t);
o.stop(audio.currentTime+t);
}

const SFX={
jump:()=>sfx(300),
hit:()=>sfx(120,"square"),
fire:()=>sfx(180,"triangle"),
boss:()=>sfx(60,0.4,"sawtooth")
};

// ================= CANVAS =================
const c=document.getElementById("c");
const ctx=c.getContext("2d");

// ================= INPUT =================
let keys={};

addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// mobile
document.getElementById("left").ontouchstart=()=>keys["ArrowLeft"]=true;
document.getElementById("left").ontouchend=()=>keys["ArrowLeft"]=false;

document.getElementById("right").ontouchstart=()=>keys["ArrowRight"]=true;
document.getElementById("right").ontouchend=()=>keys["ArrowRight"]=false;

document.getElementById("jump").ontouchstart=()=>jump();

// ================= PLAYER =================
let player={
x:100,y:300,vx:0,vy:0,
w:18,h:40,
onGround:false,
hp:3,
lives:3,
jumpPower:10
};

// ================= REAL PRODUCTS =================
const products=[
"Gear Fidget","Dragon Fidget","Pig Keychain","Otter","Shark",
"Chameleon","Alligator","Knight Holder","Air Tank","Cactus"
];

// ================= LEVEL =================
let level=0;

// ================= ENEMIES =================
let enemies=[];

function spawnEnemies(){
enemies=[];
for(let i=0;i<3+level*2;i++){
enemies.push({
x:200+i*120,
y:100,
vx:Math.random()<0.5?-1.5:1.5,
type:Math.random()<0.3?"fly":"ground",
name:products[Math.floor(Math.random()*products.length)],
cooldown:Math.random()*100
});
}
}

spawnEnemies();

// ================= PLATFORM =================
const platforms=[
[0,450,900,50],
[200,380,150,10],
[450,320,150,10],
[700,260,150,10]
];

// ================= PHYSICS =================
function jump(){
if(player.onGround){
player.vy=-player.jumpPower;
player.onGround=false;
SFX.jump();
}
}

// ================= COLLISION =================
function hit(a,b){
return a.x<a.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y;
}

// ================= DAMAGE =================
function damage(){
player.hp--;
SFX.hit();

if(player.hp<=0){
player.lives--;
player.hp=3;

if(player.lives<=0){
alert("GAME OVER");
location.reload();
}
}
}

// ================= UPDATE =================
function update(){

// move
if(keys["ArrowLeft"])player.vx=-4;
else if(keys["ArrowRight"])player.vx=4;
else player.vx*=0.8;

// physics
player.vy+=0.5;
player.x+=player.vx;
player.y+=player.vy;

// ground
if(player.y>420){
player.y=420;
player.vy=0;
player.onGround=true;
}

// platforms
platforms.forEach(p=>{
let plat={x:p[0],y:p[1],w:p[2],h:p[3]};
if(hit(player,plat) && player.vy>0){
player.y=plat.y-player.h;
player.vy=0;
player.onGround=true;
}
});

// enemies AI
enemies.forEach(e=>{

// AI chase player
if(e.x<player.x)e.x+=e.vx;
else e.x-=e.vx;

// flying
if(e.type==="fly"){
e.y+=Math.sin(Date.now()/200)*2;
}

// FIRE / FILAMENT ATTACK
if(Math.random()<0.01){
SFX.fire();
projectiles.push({x:e.x,y:e.y,vx:player.x>e.x?3:-3});
}

// hit player
if(Math.abs(player.x-e.x)<20 && Math.abs(player.y-e.y)<20){
damage();
}

// stomp kill
if(player.vy>0 && player.y<e.y){
e.dead=true;
player.vy=-6;
}
});

enemies=enemies.filter(e=>!e.dead);

// next level
if(enemies.length===0){
level++;
if(level>4){
alert("YOU BEAT ALL PRINT LEVELS!");
level=0;
}
spawnEnemies();
}

// gravity cap
if(player.y>500)player.y=500;
}

// ================= DRAW =================
function draw(){

ctx.clearRect(0,0,900,500);

// platforms
ctx.fillStyle="#334155";
platforms.forEach(p=>{
ctx.fillRect(p[0],p[1],p[2],p[3]);
});

// player (stick figure)
ctx.strokeStyle="white";
ctx.lineWidth=3;

ctx.beginPath();
ctx.arc(player.x,player.y-20,10,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x,player.y-10);
ctx.lineTo(player.x,player.y+20);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x,player.y+20);
ctx.lineTo(player.x-10,player.y+40);
ctx.moveTo(player.x,player.y+20);
ctx.lineTo(player.x+10,player.y+40);
ctx.stroke();

// enemies = YOUR PRODUCTS
enemies.forEach(e=>{
ctx.fillStyle=e.type==="fly"?"#38bdf8":"#f97316";
ctx.fillRect(e.x,e.y,25,25);

ctx.fillStyle="white";
ctx.font="10px Arial";
ctx.fillText(e.name,e.x-20,e.y-5);
});

// UI update
document.getElementById("lvl").innerText=level+1;
document.getElementById("lives").innerText=player.lives;
}

// ================= LOOP =================
function loop(){
update();
draw();
requestAnimationFrame(loop);
}

// jump key
addEventListener("keydown",e=>{
if(e.key===" ")jump();
});

loop();

</script>

</body>
</html>
