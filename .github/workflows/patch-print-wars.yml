name: Patch Print Wars safely
on:
  push:
    branches: [print-wars-mobile-less-spawns-456]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the requested sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('adminedit.html')
          s=p.read_text(encoding='utf-8')

          # Reduce normal ground enemy spawns.
          old='''    for(\n        const e of data.enemies\n    ){\n\n        addEnemy(\n            e[0],\n            e[1]\n        );\n\n    }'''
          new='''    for(\n        let i=0;\n        i<data.enemies.length;\n        i++\n    ){\n        if(i%4===3) continue;\n        const e=data.enemies[i];\n        addEnemy(e[0],e[1]);\n    }'''
          if old not in s:
              raise SystemExit('Expected ground-enemy block not found; refusing to modify file.')
          s=s.replace(old,new,1)

          # Reduce flyer spawns and bonus flyers.
          old='''    for(\n        const f of (data.flyers||[])\n    ){\n\n        addFlyer(\n            f[0],\n            f[1],\n            f[2]||"flyer"\n        );\n\n    }'''
          new='''    const flyers=data.flyers||[];\n    for(let i=0;i<flyers.length;i++){\n        if(i%2===1) continue;\n        const f=flyers[i];\n        addFlyer(f[0],f[1],f[2]||"flyer");\n    }'''
          if old not in s:
              raise SystemExit('Expected flyer block not found; refusing to modify file.')
          s=s.replace(old,new,1)
          if 'Math.floor(number/2)' not in s:
              raise SystemExit('Expected bonus-flyer expression not found; refusing to modify file.')
          s=s.replace('Math.floor(number/2)','Math.floor(number/4)',1)

          # Add a self-contained Level 1 secret. It hooks into the existing player.invincible timer.
          secret='''\n/* Level 1 secret: move backward, then type 456. Lasts until refresh. */\n(function(){\n  let wentBack=false, code="", active=false;\n  addEventListener("keydown",function(e){\n    if(game.level!==1 || !game.levelStarted || game.over || active) return;\n    if(e.key==="ArrowLeft" || e.key==="a" || e.key==="A"){ wentBack=true; return; }\n    if(!wentBack || !/^\\d$/.test(e.key)) return;\n    code=(code+e.key).slice(-3);\n    if(code==="456"){\n      active=true;\n      window.__printWarsSecret456=true;\n      player.invincible=Number.MAX_SAFE_INTEGER;\n    }\n  });\n  setInterval(function(){\n    if(active) player.invincible=Number.MAX_SAFE_INTEGER;\n  },100);\n})();\n'''
          if 'window.__printWarsSecret456' not in s:
              pos=s.rfind('</script>')
              if pos<0: raise SystemExit('No closing script tag; refusing to modify file.')
              s=s[:pos]+secret+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Basic validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('adminedit.html').read_text(encoding='utf-8')
          required=['if(i%4===3) continue;','if(i%2===1) continue;','Math.floor(number/4)','window.__printWarsSecret456']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Validation failed: '+str(missing))
          if s.count('<script>') != s.count('</script>'): raise SystemExit('Unbalanced script tags')
          if s.count('<style>') != s.count('</style>'): raise SystemExit('Unbalanced style tags')
          print('Validation passed')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-print-wars.yml
          git add adminedit.html
          git diff --cached --check
          git commit -m 'Reduce Print Wars spawns and add Level 1 secret'
          git push
