<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pervan3-D - 3D Printed Products</title>
 <style>
   body {
     font-family: Arial, sans-serif;
     margin: 20px;
     text-align: center;
     background-color: #f9f9f9;
   }
   h1 {
     color: #333;
   }
   .product-grid {
     display: flex;
     flex-wrap: wrap;
     justify-content: center;
     gap: 20px;
   }
   .product {
     border: 1px solid #ddd;
     border-radius: 8px;
     padding: 15px;
     width: 300px;
     background-color: white;
     box-shadow: 0 2px 5px rgba(0,0,0,0.1);
   }
   img {
     max-width: 100%;
     border-radius: 8px;
   }
   button {
     background-color: #4CAF50;
     color: white;
     padding: 10px 20px;
     border: none;
     border-radius: 5px;
     cursor: pointer;
     font-size: 16px;
     margin-top: 10px;
   }
   button:hover {
     background-color: #45a049;
   }
 </style>

 <!-- Snipcart setup - PASTE YOUR KEY HERE -->
 <script async src="https://cdn.snipcart.com/themes/v3.3.3/default/snipcart.js"></script>
 <div hidden id="snipcart" data-api-key="YOUR_PUBLIC_TEST_KEY_HERE"></div>
</head>
<body>

 <h1>Welcome to Pervan3-D!</h1>
 <p>Custom 3D printed items made with love. Browse and buy below!</p>

 <div class="product-grid">

   <!-- Product 1 - Change this to your real item -->
   <div class="product">
     <img src="images/keychain.jpg" alt="Custom 3D Keychain">
     <h2>Custom Keychain</h2>
     <p>Personalized design, durable PLA plastic. $10.00</p>
     <button class="snipcart-add-item"
       data-item-id="keychain001"
       data-item-price="10.00"
       data-item-url="/"
       data-item-name="Custom Keychain"
       data-item-description="Fun personalized keychain"
       data-item-image="images/keychain.jpg">
       Add to Cart - $10
     </button>
   </div>

   <!-- Product 2 - Copy this whole block for more products -->
   <div class="product">
     <img src="images/vase.jpg" alt="3D Printed Vase">
     <h2>Modern Vase</h2>
     <p>Elegant design, available in multiple colors. $25.00</p>
     <button class="snipcart-add-item"
       data-item-id="vase001"
       data-item-price="25.00"
       data-item-url="/"
       data-item-name="Modern Vase"
       data-item-description="Decorative 3D printed vase"
       data-item-image="images/vase.jpg">
       Add to Cart - $25
     </button>
   </div>

   <!-- Add more <div class="product"> ... </div> here -->

 </div>

</body>
</html>
