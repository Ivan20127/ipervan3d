<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pervan 3-D - Admin Access</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    .box {
      background: #222;
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin: 0 0 30px;
      color: #ff6600;
      font-size: 1.9em;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.1em;
      border: 2px solid #444;
      border-radius: 6px;
      background: #333;
      color: white;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff6600;
      box-shadow: 0 0 0 3px rgba(255,102,0,0.3);
    }
    input:disabled {
      background: #222;
      cursor: not-allowed;
    }
    .eye-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.4em;
      color: #aaa;
      user-select: none;
    }
    .eye-icon:hover {
      color: #ff6600;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #ff6600;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    button:hover:not(:disabled) {
      background: #e65c00;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .error {
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 0.95em;
      min-height: 22px;
    }
    .note, .lockout-msg {
      font-size: 0.9em;
      margin-top: 20px;
    }
    .lockout-msg {
      color: #ffcc00;
      font-weight: bold;
      display: none;
    }
    #countdown {
      font-size: 1.3em;
      color: #ff6600;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Admin Access</h2>

  <div class="input-group">
    <input type="text" id="username" placeholder="Username" autocomplete="off">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Password" autocomplete="off">
    <span class="eye-icon" id="toggleEye">👁️</span>
  </div>

  <button id="loginBtn">Login</button>
  <div class="error" id="errorMsg"></div>
  <div class="note">Only authorized personnel allowed</div>
  <div class="lockout-msg" id="lockoutMsg">
    Too many failed attempts.<br>Locked out for <span id="countdown">5:00</span> minutes.
  </div>
</div>

<script>
// CHANGE THESE TO YOUR OWN CREDENTIALS!
const CORRECT_USERNAME = "Croatia";
const CORRECT_PASSWORD = "Ivanboy2012";

// LocalStorage keys
const ATTEMPT_KEY = 'adminLoginAttempts';
const LOCKOUT_KEY = 'adminLockoutTime';

// Elements
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const toggleEye     = document.getElementById('toggleEye');
const loginBtn      = document.getElementById('loginBtn');
const errorMsg      = document.getElementById('errorMsg');
const lockoutMsg    = document.getElementById('lockoutMsg');
const countdownEl   = document.getElementById('countdown');

// Toggle password visibility
toggleEye.addEventListener('click', () => {
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    toggleEye.textContent = '🙈';
  } else {
    passwordInput.type = 'password';
    toggleEye.textContent = '👁️';
  }
  passwordInput.focus();
});

// Check if currently locked out
function checkLockout() {
  const lockoutTime = localStorage.getItem(LOCKOUT_KEY);
  if (lockoutTime) {
    const remaining = parseInt(lockoutTime) - Date.now();
    if (remaining > 0) {
      lockoutMsg.style.display = 'block';
      loginBtn.disabled = true;
      usernameInput.disabled = true;
      passwordInput.disabled = true;
      startCountdown(remaining / 1000);
      return true;
    } else {
      localStorage.removeItem(LOCKOUT_KEY);
      localStorage.removeItem(ATTEMPT_KEY);
    }
  }
  return false;
}

// Countdown timer
function startCountdown(seconds) {
  let timeLeft = Math.floor(seconds);
  countdownEl.textContent = formatTime(timeLeft);

  const interval = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = formatTime(timeLeft);

    if (timeLeft <= 0) {
      clearInterval(interval);
      lockoutMsg.style.display = 'none';
      loginBtn.disabled = false;
      usernameInput.disabled = false;
      passwordInput.disabled = false;
      errorMsg.textContent = 'You can try again now.';
      errorMsg.style.color = '#28a745';
      localStorage.removeItem(ATTEMPT_KEY);
      localStorage.removeItem(LOCKOUT_KEY);
    }
  }, 1000);
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Attempt login
function attemptLogin() {
  if (checkLockout()) return;

  const enteredUsername = usernameInput.value.trim();
  const enteredPassword = passwordInput.value.trim();

  let attempts = parseInt(localStorage.getItem(ATTEMPT_KEY) || '0');

  if (enteredUsername === CORRECT_USERNAME && enteredPassword === CORRECT_PASSWORD) {
    // Success → reset attempts and redirect
    localStorage.removeItem(ATTEMPT_KEY);
    localStorage.removeItem(LOCKOUT_KEY);
    errorMsg.style.color = '#28a745';
    errorMsg.textContent = 'Logging in...';
    loginBtn.disabled = true;
    setTimeout(() => {
      window.location.href = 'adminedit.html';
    }, 800);
  } else {
    // Failed attempt
    attempts++;
    localStorage.setItem(ATTEMPT_KEY, attempts.toString());
    errorMsg.textContent = `Invalid credentials. Attempts left: ${3 - attempts}`;
    errorMsg.style.color = '#ff4d4d';

    if (attempts >= 3) {
      const lockoutUntil = Date.now() + 5 * 60 * 1000; // 5 minutes
      localStorage.setItem(LOCKOUT_KEY, lockoutUntil);
      lockoutMsg.style.display = 'block';
      loginBtn.disabled = true;
      usernameInput.disabled = true;
      passwordInput.disabled = true;
      startCountdown(300);
      errorMsg.textContent = 'Too many failed attempts. Locked for 5 minutes.';
    }

    passwordInput.value = '';
    usernameInput.value = '';
    usernameInput.focus();
  }
}

// Event listeners
loginBtn.addEventListener('click', attemptLogin);
passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') attemptLogin();
});

// Focus on load + check lockout
usernameInput.focus();
checkLockout();
</script>

</body>
</html>
