<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pervan 3-D - Admin Access</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    .box {
      background: #222;
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin: 0 0 30px;
      color: #ff6600;
      font-size: 1.9em;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.1em;
      border: 2px solid #444;
      border-radius: 6px;
      background: #333;
      color: white;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff6600;
      box-shadow: 0 0 0 3px rgba(255,102,0,0.3);
    }
    .eye-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.4em;
      color: #aaa;
      user-select: none;
    }
    .eye-icon:hover {
      color: #ff6600;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #ff6600;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    button:hover {
      background: #e65c00;
    }
    .error {
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 0.95em;
      min-height: 22px;
    }
    .note {
      font-size: 0.85em;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Admin Access</h2>

  <!-- Username Field -->
  <div class="input-group">
    <input
      type="text"
      id="username"
      placeholder="Username"
      autocomplete="off"
    >
  </div>

  <!-- Password Field -->
  <div class="input-group">
    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="off"
    >
    <span class="eye-icon" id="toggleEye">👁️</span>
  </div>

  <button id="loginBtn">Login</button>
  <div class="error" id="errorMsg"></div>
  <div class="note">Only authorized personnel allowed</div>
</div>

<script>
  // CHANGE THESE TO YOUR OWN CREDENTIALS!
  const CORRECT_USERNAME = "Croatia";         // ← Username is now "Croatia"
  const CORRECT_PASSWORD = "Ivanboy2012";     // ← Change this password if you want!

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const toggleEye     = document.getElementById('toggleEye');
  const loginBtn      = document.getElementById('loginBtn');
  const errorMsg      = document.getElementById('errorMsg');

  // Toggle password visibility
  toggleEye.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleEye.textContent = '🙈';
    } else {
      passwordInput.type = 'password';
      toggleEye.textContent = '👁️';
    }
    passwordInput.focus();
  });

  // Login function
  function attemptLogin() {
    const enteredUsername = usernameInput.value.trim();
    const enteredPassword = passwordInput.value.trim();

    if (enteredUsername === CORRECT_USERNAME && enteredPassword === CORRECT_PASSWORD) {
      errorMsg.style.color = '#28a745';
      errorMsg.textContent = 'Logging in...';
      loginBtn.disabled = true;

      // Small delay for better feel, then redirect
      setTimeout(() => {
        window.location.href = 'adminedit.html'; // ← Make sure this file exists!
      }, 600);
    } else {
      errorMsg.style.color = '#ff4d4d';
      errorMsg.textContent = 'Invalid username or password. Try again.';
      passwordInput.value = '';
      usernameInput.value = '';
      usernameInput.focus();
    }
  }

  // Button click
  loginBtn.addEventListener('click', attemptLogin);

  // Press Enter to login
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      attemptLogin();
    }
  });

  // Focus on username when page loads
  usernameInput.focus();
</script>

</body>
</html>
