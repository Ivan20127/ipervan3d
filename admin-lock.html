<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pervan 3-D - Admin Access</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    .box {
      background: #222;
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin: 0 0 30px;
      color: #ff6600;
      font-size: 1.9em;
    }
    .input-group {
      position: relative;
      margin-bottom: 25px;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 50px 14px 18px;
      font-size: 1.1em;
      border: 2px solid #444;
      border-radius: 6px;
      background: #333;
      color: white;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff6600;
      box-shadow: 0 0 0 3px rgba(255,102,0,0.3);
    }
    .eye-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.4em;
      color: #aaa;
      user-select: none;
    }
    .eye-icon:hover {
      color: #ff6600;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #ff6600;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #e65c00;
    }
    .error {
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 0.95em;
      min-height: 22px;
    }
    .note {
      font-size: 0.85em;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Admin Access</h2>

  <div class="input-group">
    <input 
      type="password" 
      id="password" 
      placeholder="Enter admin password"
      autocomplete="off"
    >
    <span class="eye-icon" id="toggleEye">👁️</span>
  </div>

  <button id="loginBtn">Login</button>
  <div class="error" id="errorMsg"></div>
  <div class="note">Only authorized personnel allowed</div>
</div>

<script>
  // CHANGE THIS PASSWORD TO WHATEVER YOU WANT
  const ADMIN_PASSWORD = "Ivanboy2012";

  // Toggle show/hide password
  const passwordInput = document.getElementById('password');
  const toggleEye = document.getElementById('toggleEye');

  toggleEye.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleEye.textContent = '🙈'; // hide icon
    } else {
      passwordInput.type = 'password';
      toggleEye.textContent = '👁️'; // show icon
    }
  });

  // Login function
  document.getElementById('loginBtn').addEventListener('click', () => {
    const entered = passwordInput.value.trim();

    if (entered === ADMIN_PASSWORD) {
      // Success → redirect to your real admin page
      window.location.href = 'adminedit.html'; // ← Change this if your admin file has a different name!
    } else {
      // Wrong password
      document.getElementById('errorMsg').textContent = 'Incorrect password. Try again.';
      passwordInput.value = ''; // clear field
      passwordInput.focus();
    }
  });

  // Optional: Allow pressing Enter to login
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('loginBtn').click();
    }
  });
</script>

</body>
</html>
