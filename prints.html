<body>


<!-- =========================
     HEADER
========================= -->

<header>


<a
href="index.html"
class="home-button"
>
🏠 Home
</a>


<button
class="dark-mode-button"
onclick="toggleDarkMode()"
id="darkModeButton"
>
🌙 Dark
</button>


<h1>
🖨️ Prints in Action
</h1>


<p>
Watch Pervan 3D prints being created
</p>

</header>


<!-- =========================
     INTRO
========================= -->

<section class="intro">

<h2>
🎥 Customer Prints
</h2>

<p>
See time-lapse videos of prints being made.
Search for a customer's name or product.
</p>

</section>


<!-- =========================
     SEARCH
========================= -->

<div class="search-container">

<input
type="text"
id="printSearch"
placeholder="🔍 Search by name or product..."
oninput="searchPrints()"
>

</div>


<!-- =========================

<section

id="prints"
>

Example structure to use later:

>

</div>


<script>

/* =========================
   SEARCH
========================= */

function searchPrints(){

const search =
document
.getElementById('printSearch')
.value
.toLowerCase()
.trim();


const cards =
document
.querySelectorAll('.print-card');


let visible = 0;


cards.forEach(card => {

const searchable =
(
card.getAttribute('data-search')
|| ''
)
.toLowerCase();


if(
searchable.includes(search)
){

card.style.display='';

visible++;

}else{

card.style.display='none';

}

});


const noResults =
document.getElementById('noResults');


/*
   Don't show "No prints found"
   when there aren't any prints yet.
*/

if(
cards.length > 0 &&
visible === 0
){

noResults.style.display='block';

}else{

noResults.style.display='none';

}

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode(){

document
.body
.classList
.toggle('dark');


const isDark =
document
.body
.classList
.contains('dark');


localStorage.setItem(
'pervan3d-dark-mode',
isDark
);


updateDarkButton();

}


/* =========================
   DARK MODE BUTTON
========================= */

function updateDarkButton(){

const button =
document
.getElementById(
'darkModeButton'
);


if(
document
.body
.classList
.contains('dark')
){

button.textContent =
'☀️ Light';

}else{

button.textContent =
'🌙 Dark';

}

}


/* =========================
   LOAD DARK MODE
========================= */

const savedDarkMode =
localStorage.getItem(
'pervan3d-dark-mode'
);


if(
savedDarkMode === 'true'
){

document
.body
.classList
.add('dark');

}


updateDarkButton();

</script>


</body>
