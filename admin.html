<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3-D Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .box {
    background: #222;
    padding: 25px;
    width: 100%;
    max-width: 400px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }

  h2 {
    text-align: center;
    margin-top: 0;
  }

  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: none;
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background: #ff6600;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 0;
    font-size: 1.05em;
  }

  input[type="checkbox"] {
    transform: scale(1.4);
  }

  .note {
    font-size: 0.8em;
    color: #aaa;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

  <button onclick="login()">Login</button>
</div>

  <h2>Color Inventory</h2>

  <label>Light Green <input type="checkbox" data-color="Light Green"></label>
  <label>Yellow <input type="checkbox" data-color="Yellow"></label>

  <div class="note">Toggles save automatically</div>
</div>
