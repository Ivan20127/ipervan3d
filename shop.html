<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3-D | Custom 3-D Printing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; color:#333; }
header { background:#111; color:white; padding:40px 20px; text-align:center; }
.button { padding:12px 24px; background:#ff6600; color:white; border:none; border-radius:4px; cursor:pointer; }
section { padding:40px 20px; max-width:1100px; margin:auto; }
.products { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
.card { background:white; padding:20px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,.1); text-align:center; }
select { width:100%; padding:6px; margin:6px 0; }
.cart { position:fixed; right:20px; bottom:20px; background:white; width:280px; padding:15px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,.2); }
</style>
</head>

<body>

<header>
<h1>Pervan 3-D</h1>
<p>Custom 3-D Printed Products</p>
</header>

<section>
<div class="products">

<div class="card">
<h3>Dragon Fidget</h3>
<select id="dragon-size">
<option value="Big">Big ($8)</option>
<option value="Small">Small ($5)</option>
</select>
<select id="dragon-color">
<option>Blue</option>
<option>Gold</option>
<option>Purple Copper (+$2)</option>
<option>Black</option>
</select>
<button class="button" onclick="addToCart('Dragon Fidget','dragon-size','dragon-color')">Add to Cart</button>
</div>

<div class="card">
<h3>Star Fidget</h3>
<select id="star-size">
<option value="Big">Big ($8)</option>
<option value="Small">Small ($5)</option>
</select>
<select id="star-color">
<option>Blue</option>
<option>Gold</option>
<option>Purple Copper (+$2)</option>
<option>Black</option>
</select>
<button class="button" onclick="addToCart('Star Fidget','star-size','star-color')">Add to Cart</button>
</div>

</div>
</section>

<div class="cart">
<h3>🛒 Cart</h3>
<ul id="cart-items"></ul>
<p><strong>Total: $<span id="total">0.00</span></strong></p>
<button class="button" onclick="checkout()">Checkout</button>
</div>

<script>
let total = 0;
let cart = [];

function addToCart(name, sizeId, colorId) {
  const size = document.getElementById(sizeId).value;
  const color = document.getElementById(colorId).value;

  let price = size === "Small" ? 5 : 8;
  if (color.includes("Purple Copper")) price += 2;

  cart.push(`${name} (${size}, ${color}) - $${price}`);
  total += price;

  const li = document.createElement("li");
  li.textContent = cart[cart.length - 1];
  document.getElementById("cart-items").appendChild(li);
  document.getElementById("total").textContent = total.toFixed(2);
}

function checkout() {
  if (total === 0) return alert("Cart empty");

  fetch("https://YOUR-SERVER-URL/send-text", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: `🧾 New Order\n${cart.join("\n")}\nTotal: $${total.toFixed(2)}`
    })
  });

  window.open("https://venmo.com/code?user_id=4394888250525052591", "_blank");
}
</script>

</body>
</html>
