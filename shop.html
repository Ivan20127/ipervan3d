<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3-D Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

header {
  background: #111;
  color: white;
  padding: 40px 20px;
  text-align: center;
  position: relative;
}

.secret-admin {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 18px;
  height: 18px;
  opacity: 0;
  cursor: pointer;
}

.button {
  margin: 6px;
  padding: 10px 18px;
  background: #ff6600;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 6px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  position: relative;
}

select, input {
  margin: 5px 0;
  padding: 6px;
}

.cart {
  background: white;
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.remove {
  color: red;
  cursor: pointer;
}

.admin-panel {
  display: none;
  background: #222;
  color: white;
  padding: 20px;
  max-width: 600px;
  margin: 20px auto;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>Pervan 3-D Shop</h1>
  <p>Custom 3-D Printed Fidgets</p>
  <div class="secret-admin" onclick="openAdmin()"></div>
</header>

<section class="products">

<div class="card">
  <h3>Dragon Fidget</h3>
  Size:<br>
  <select id="dragonSize">
    <option value="8">Big ($8)</option>
    <option value="5">Small ($5)</option>
  </select><br>
  Color:<br>
  <select id="dragonColor">
    <option>Red</option>
    <option>Blue</option>
    <option>Black</option>
    <option>Light Green</option>
    <option>Yellow</option>
    <option>Grey</option>
  </select><br>
  Qty:<br>
  <input type="number" id="dragonQty" value="1" min="1"><br>
  <button class="button" onclick="addToCart('Dragon Fidget', dragonSize.value, dragonQty.value, dragonColor.value)">Add to Cart</button>
</div>

<div class="card">
  <h3>Star Fidget</h3>
  Size:<br>
  <select id="starSize">
    <option value="8">Big ($8)</option>
    <option value="5">Small ($5)</option>
  </select><br>
  Color:<br>
  <select id="starColor">
    <option>Red</option>
    <option>Blue</option>
    <option>Black</option>
    <option>Light Green</option>
    <option>Yellow</option>
    <option>Grey</option>
  </select><br>
  Qty:<br>
  <input type="number" id="starQty" value="1" min="1"><br>
  <button class="button" onclick="addToCart('Star Fidget', starSize.value, starQty.value, starColor.value)">Add to Cart</button>
</div>

</section>

<div class="cart">
  <h3>🛒 Cart</h3>
  <input id="customerName" placeholder="Customer name (required)" style="width:100%">
  <ul id="cartItems"></ul>
  <strong>Total: $<span id="total">0.00</span></strong><br><br>
  <button class="button" onclick="checkout()">Pay with Venmo</button>
</div>

<div class="admin-panel" id="adminPanel">
  <h2>ADMIN PANEL</h2>
  <p>Password protected</p>
  <label>Dragon Available <input type="checkbox" id="dragonAvail" checked></label><br>
  <label>Star Available <input type="checkbox" id="starAvail" checked></label><br><br>
  <button class="button" onclick="saveAdmin()">Save Settings</button>
</div>

<script>
let total = 0;
const cartItems = document.getElementById("cartItems");
const totalEl = document.getElementById("total");

function addToCart(name, price, qty, color) {
  qty = parseInt(qty);
  price = parseFloat(price);
  const cost = price * qty;
  const li = document.createElement("li");
  li.textContent = `${name} (${color}) x${qty} - $${cost.toFixed(2)}`;
  const rm = document.createElement("span");
  rm.textContent = " ✖";
  rm.className = "remove";
  rm.onclick = () => {
    total -= cost;
    totalEl.textContent = total.toFixed(2);
    li.remove();
  };
  li.appendChild(rm);
  cartItems.appendChild(li);
  total += cost;
  totalEl.textContent = total.toFixed(2);
}

function checkout() {
  const name = customerName.value.trim();
  if (!name) return alert("Name required");
  if (total === 0) return alert("Cart empty");

  let note = `Order (${name}): `;
  document.querySelectorAll("#cartItems li").forEach(li => {
    note += li.textContent.replace(" ✖","") + " | ";
  });

  window.open(`https://venmo.com/?txn=pay&recipients=@Pervan3D&amount=${total.toFixed(2)}&note=${encodeURIComponent(note)}`);
}

/* ===== ADMIN ===== */
function openAdmin() {
  const pass = prompt("Admin Password:");
  if (pass === "Ivanboy2012") {
    adminPanel.style.display = "block";
    loadAdmin();
  } else {
    alert("Wrong password");
  }
}

function saveAdmin() {
  localStorage.setItem("pervanAdmin", JSON.stringify({
    dragon: dragonAvail.checked,
    star: starAvail.checked
  }));
  alert("Saved. Refresh page.");
}

function loadAdmin() {
  const s = JSON.parse(localStorage.getItem("pervanAdmin"));
  if (!s) return;
  dragonAvail.checked = s.dragon;
  starAvail.checked = s.star;
}

loadAdmin();
</script>

</body>
</html>
