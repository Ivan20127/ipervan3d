<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3D Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333;}
header{background:#111;color:#fff;padding:40px 20px;text-align:center;position:relative;}
header h1{margin:0;font-size:2.5em;}
.back-btn{position:absolute;top:20px;left:20px;padding:10px 20px;background:#444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;text-decoration:none;transition:.3s;}
.back-btn:hover{background:#666;}
.button{margin:6px;padding:10px 18px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
.button:hover:not(:disabled){background:#c82333;}
.button:disabled{background:#999;cursor:not-allowed;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1100px;margin:auto;padding:40px 20px;}
.card{background:#fff;padding:20px;border-radius:6px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.1);position:relative;}
.card img{width:100%;height:220px;object-fit:contain;border-radius:6px;margin-bottom:12px;}
.card h3{margin:10px 0;}
select,input[type=number],input[type=text]{margin:5px 0;padding:6px;width:100%;max-width:180px;}
.status-badge{padding:6px 12px;border-radius:20px;font-size:.9em;font-weight:bold;display:inline-block;margin:10px 0;}
.in-stock{background:#28a745;color:#fff;}
.out-of-stock{background:#dc3545;color:#fff;}
.price{font-size:1.4em;font-weight:bold;color:#ff6600;margin:10px 0;}
.sold-out-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-size:1.8em;font-weight:bold;pointer-events:none;z-index:2;}
.cart{background:#fff;width:100%;max-width:500px;margin:40px auto;padding:20px;border-radius:8px;box-shadow:0 5px 15px rgba(0,0,0,.2);font-size:.9em;}
.cart li{margin-bottom:6px;}
.remove{color:red;cursor:pointer;margin-left:6px;}
</style>
</head>
<body>

<header>
<h1>Pervan 3D Shop</h1>
<p>Custom 3-D Printed Fidgets & More</p>
<a href="index.html" class="back-btn">← Back to Home</a>
</header>

<section class="products" id="products"></section>

<div class="cart">
<h3>🛒 Cart</h3>
<input id="customerName" placeholder="Customer name (required)" required style="width:100%;margin-bottom:8px;">
<ul id="cart-items"></ul>
<p><strong>Total: $<span id="total">0.00</span></strong></p>
<button class="button" onclick="checkout()">Pay with Venmo</button>
</div>

<script>
// ======== ADMIN SETTINGS / LOCAL STORAGE ========
let defaultProducts=[
  {name:"Dragon Fidget",smallPrice:5,bigPrice:8,image:"",available:true,sizes:true},
  {name:"Star Fidget",smallPrice:5,bigPrice:8,image:"",available:true,sizes:true},
  {name:"Gear Fidget",price:2,image:"",available:true},
  {name:"Cactus Toothpick Holder",price:20,image:"",available:true}
];

let adminSettings=JSON.parse(localStorage.getItem('pervanSettings')) || {products: defaultProducts};
localStorage.setItem('pervanSettings', JSON.stringify(adminSettings));

// ======== COLORS ========
const colors=["Red","Blue","Black","Light Green","Yellow","Grey","Copper Purple (+$2)"];

// ======== DOM ELEMENTS ========
const productsContainer=document.getElementById("products");
const cartItems=document.getElementById("cart-items");
const totalDisplay=document.getElementById("total");
let total=0;

// ======== RENDER PRODUCTS ========
function renderProducts(){
  productsContainer.innerHTML="";
  adminSettings.products.forEach((p,i)=>{
    const card=document.createElement("div");
    card.className="card"; card.id=`product-${i}`;
    let html=`<img src="${p.image}" alt="${p.name}"><h3>${p.name}</h3>
      <p class="price">${p.smallPrice&&p.bigPrice?`$${p.smallPrice} – $${p.bigPrice}`:`$${p.price||""}`}</p>
      <div id="availability-${i}"></div>`;
    if(p.sizes) html+=`Size:<br><select id="size-${i}"><option value="Big">Big (+$3)</option><option value="Small">Small</option></select><br>`;
    html+=`Color:<br><select id="color-${i}">${colors.map(c=>`<option>${c}</option>`)}</select><br>
      Qty:<br><input type="number" id="qty-${i}" value="1" min="1" style="width:60px;"><br>
      <button class="button" id="btn-${i}">Add to Cart</button>`;
    card.innerHTML=html;
    productsContainer.appendChild(card);
    
    document.getElementById(`btn-${i}`).onclick=()=>addToCart(i);
    updateStatus(i);
  });
}
