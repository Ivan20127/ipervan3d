<script>
  let total = 0;
  let cart = [];

  const cartItems = document.getElementById("cart-items");
  const totalDisplay = document.getElementById("total");

  function addToCart(name, size, color) {
    let price = 0;

    // Base prices
    if (name === "Dragon Fidget" || name === "Star Fidget") {
      price = (size === "Small") ? 5 : 8;
    } else if (name === "Name") {
      price = 3;
    } else if (name === "Tree Fidget") {
      price = 5;
    }

    // Purple Copper upcharge
    if (color.includes("Purple Copper")) {
      price += 2;
    }

    const item = {
      name,
      size: size || "Standard",
      color,
      price
    };

    cart.push(item);
    renderCart();
  }

  function removeItem(index) {
    total -= cart[index].price;
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    cartItems.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {
      total += item.price;

      const li = document.createElement("li");
      li.innerHTML = `
        ${item.name} (${item.size}, ${item.color}) - $${item.price.toFixed(2)}
        <button onclick="removeItem(${index})"
          style="margin-left:6px; background:#c00; color:white; border:none; border-radius:4px; cursor:pointer;">
          ✖
        </button>
      `;

      cartItems.appendChild(li);
    });

    totalDisplay.textContent = total.toFixed(2);
  }

  function checkout() {
    const customerName = document.getElementById("customer-name").value.trim();

    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    if (customerName === "") {
      alert("Please enter your name before checking out.");
      return;
    }

    // Build Venmo note
    let note = `Pervan3D Order - ${customerName}: `;
    cart.forEach(item => {
      note += `${item.name} (${item.size}, ${item.color}) | `;
    });
    note += `Total: $${total.toFixed(2)}`;

    const venmoURL =
      "https://venmo.com/code?user_id=4394888250525052591&note=" +
      encodeURIComponent(note);

    alert(`Thanks ${customerName}! You’ll now be redirected to Venmo.`);

    window.open(venmoURL, "_blank");
  }
</script>
