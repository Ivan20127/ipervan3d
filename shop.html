<script>
  let total = 0;
  const cartItems = document.getElementById("cart-items");
  const totalDisplay = document.getElementById("total");

  function addToCart(name, size, color) {
    let price = 0;

    if (name === "Dragon Fidget" || name === "Star Fidget") {
      price = (size === "Small") ? 5 : 8;
    } else if (name === "Name") {
      price = 3;
    } else if (name === "Tree Fidget") {
      price = 5;
    }

    if (color === "Purple Copper") {
      price += 2;
    }

    const li = document.createElement("li");
    li.textContent = `${name} (${size || "Standard"}, ${color}) - $${price.toFixed(2)}`;
    cartItems.appendChild(li);

    total += price;
    totalDisplay.textContent = total.toFixed(2);
  }

  function checkout() {
    if (total === 0) {
      alert("Your cart is empty.");
      return;
    }

    // Build order description (same cart logic you already use)
    let orderNote = "Pervan 3-D Order: ";
    const items = document.querySelectorAll("#cart-items li");

    items.forEach((item, index) => {
      orderNote += item.textContent;
      if (index !== items.length - 1) {
        orderNote += " | ";
      }
    });

    const amount = total.toFixed(2);

    // Venmo link with auto-filled amount + note
    window.open(
      `https://venmo.com/?txn=pay&recipients=YOUR_VENMO_USERNAME&amount=${amount}&note=${encodeURIComponent(orderNote)}`,
      "_blank"
    );
  }
</script>
