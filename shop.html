<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3D Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
header { background:#111; color:white; padding:40px 20px; text-align:center; position:relative; }
header h1 { margin:0; }
.back-btn { position:absolute; top:20px; left:20px; padding:10px 20px; background:#444; color:white; text-decoration:none; border-radius:6px; }
.colors-banner { width:100%; height:250px; overflow:hidden; }
.colors-banner img { width:100%; height:100%; object-fit:cover; }

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.card {
  background:white;
  padding:20px;
  border-radius:6px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.card img { width:100%; height:220px; object-fit:contain; margin-bottom:10px; }
.price { color:#ff6600; font-weight:bold; font-size:1.2em; }

select, input { width:100%; max-width:190px; padding:6px; margin:6px 0; }

.button {
  background:#dc3545;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
}

.cart {
  background:white;
  max-width:500px;
  margin:40px auto;
  padding:20px;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.remove { color:red; cursor:pointer; margin-left:8px; }
</style>
</head>

<body>

<header>
  <h1>Pervan 3D Shop</h1>
  <p>3D Printed Fidgets & Gifts</p>
  <a href="index.html" class="back-btn">← Back</a>
</header>

<div class="colors-banner">
  <img src="colors.png">
</div>

<section class="products">

<!-- DRAGON -->
<div class="card">
<img src="dragon.png">
<h3>Dragon Fidget</h3>
<p class="price">$5 – $8</p>

<select id="dragonSize">
  <option value="Small">Small</option>
  <option value="Big">Big (+$3)</option>
</select>

<select class="color"></select>
<input type="number" id="dragonQty" value="1" min="1">
<button class="button" onclick="addFidget('Dragon Fidget','dragonSize',this)">Add to Cart</button>
</div>

<!-- STAR -->
<div class="card">
<img src="star.png">
<h3>Star Fidget</h3>
<p class="price">$5 – $8</p>

<select id="starSize">
  <option value="Small">Small</option>
  <option value="Big">Big (+$3)</option>
</select>

<select class="color"></select>
<input type="number" id="starQty" value="1" min="1">
<button class="button" onclick="addFidget('Star Fidget','starSize',this)">Add to Cart</button>
</div>

<!-- GEAR -->
<div class="card">
<img src="gear.png">
<h3>Gear Fidget</h3>
<p class="price">$2</p>

<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Gear Fidget',2,this)">Add to Cart</button>
</div>

<!-- CACTUS -->
<div class="card">
<img src="cactus.png">
<h3>Cactus Toothpick Holder</h3>
<p class="price">$15</p>

<select class="color"></select>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addCactus(this)">Add to Cart</button>
</div>

<!-- NAMES -->
<div class="card">
<img src="names.png">
<h3>Names</h3>
<p class="price">$3</p>

<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Names',3,this)">Add to Cart</button>
</div>

<!-- TEACHER -->
<div class="card">
<img src="teacher.png">
<h3>Teacher Gift</h3>
<p class="price">$6</p>

<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Teacher Gift',6,this)">Add to Cart</button>
</div>

<!-- HEART -->
<div class="card">
<img src="heart.png">
<h3>Heart Dish</h3>
<p class="price">$6</p>

<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Heart Dish',6,this)">Add to Cart</button>
</div>

</section>

<div class="cart">
<h3>🛒 Cart</h3>
<input id="customerName" placeholder="Customer name required">
<ul id="cart"></ul>
<p><strong>Total: $<span id="total">0.00</span></strong></p>
<button class="button" onclick="checkout()">Pay with Venmo</button>
</div>

<script>
const colors = [
  "Red","Blue","Black","Light Green","Yellow","Grey",
  "Candy Red","Champagne","White","Titan Grey","Candy Green","Brown",
  "Black Gold Green (+$2)",
  "Blue Orange Green (+$2)",
  "Copper Purple Green (+$2)",
  "Multi Color Rose (+$2)",
  "Multi Color Blue (+$2)"
];

document.querySelectorAll(".color").forEach(sel=>{
  colors.forEach(c=>{
    const o=document.createElement("option");
    o.textContent=c;
    sel.appendChild(o);
  });
});

let total=0;
const cart=document.getElementById("cart");
const totalEl=document.getElementById("total");

const upcharge=c=>c.includes("+$2")?2:0;

function addFidget(name,sizeId,btn){
  const card=btn.parentElement;
  const size=card.querySelector("#"+sizeId).value;
  const color=card.querySelector(".color").value;
  const qty=card.querySelector("input").value;
  let price=(size==="Big"?8:5)+upcharge(color);
  addItem(name,`${size}, ${color}`,price,qty);
}

function addFixed(name,base,btn){
  const card=btn.parentElement;
  const color=card.querySelector(".color").value;
  const qty=card.querySelector("input").value;
  addItem(name,color,base+upcharge(color),qty);
}

function addCactus(btn){
  const card=btn.parentElement;
  const colors=[...card.querySelectorAll(".color")].map(s=>s.value);
  const qty=card.querySelector("input").value;
  let price=15+colors.reduce((a,c)=>a+upcharge(c),0);
  addItem("Cactus Toothpick Holder",`Cactus: ${colors[0]}, Base: ${colors[1]}`,price,qty);
}

function addItem(name,details,price,qty){
  qty=parseInt(qty);
  const t=price*qty;
  total+=t;
  const li=document.createElement("li");
  li.innerHTML=`${name} (${details}) x${qty} - $${t.toFixed(2)} <span class="remove">✖</span>`;
  li.querySelector(".remove").onclick=()=>{cart.removeChild(li);total-=t;totalEl.textContent=total.toFixed(2);}
  cart.appendChild(li);
  totalEl.textContent=total.toFixed(2);
}

function checkout(){
  if(!cart.children.length) return alert("Cart is empty");
  if(!customerName.value.trim()) return alert("Enter your name");
  let note=`Pervan 3D Order (${customerName.value}): `;
  [...cart.children].forEach((li,i,a)=>{note+=li.textContent.replace("✖","");if(i<a.length-1)note+=" | ";});
  window.open(`https://venmo.com/?txn=pay&recipients=@Pervan3D&amount=${total.toFixed(2)}&note=${encodeURIComponent(note)}`);
}
</script>

</body>
</html>
