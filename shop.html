<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pervan 3-D | Custom 3-D Printing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #111;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .button {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      background: #ff6600;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }

    .cart {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: white;
      width: 280px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      font-size: 0.9em;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Pervan 3-D</h1>
  <p>Custom 3-D Printed Parts, Models, and Prototypes</p>
  <a href="index.html" class="button">⬅ Back to Main Page</a>
</header>

<section>
  <h2>Products for Sale</h2>
  <div class="products">

    <!-- Dragon Fidget -->
    <div class="card">
      <img src="images/dragon-fidget.jpg" alt="Dragon Fidget">
      <h3>Dragon Fidget</h3>
      <p><strong>$8.00</strong></p>

      <select id="dragon-color">
        <option value="Blue">Blue</option>
        <option value="Gold">Gold</option>
        <option value="Red">Red</option>
        <option value="Purple">Purple (+$2)</option>
        <option value="Copper">Copper (+$2)</option>
        <option value="Light Green">Light Green</option>
        <option value="Black">Black</option>
      </select>

      <button class="button"
        onclick="addToCart('Dragon Fidget', 8, document.getElementById('dragon-color').value)">
        Add to Cart
      </button>
    </div>

    <!-- Star Fidget -->
    <div class="card">
      <img src="images/star-fidget.jpg" alt="Star Fidget">
      <h3>Star Fidget</h3>
      <p><strong>$5.00</strong></p>

      <select id="star-color">
        <option value="Blue">Blue</option>
        <option value="Gold">Gold</option>
        <option value="Red">Red</option>
        <option value="Purple">Purple (+$2)</option>
        <option value="Copper">Copper (+$2)</option>
        <option value="Light Green">Light Green</option>
        <option value="Black">Black</option>
      </select>

      <button class="button"
        onclick="addToCart('Star Fidget', 5, document.getElementById('star-color').value)">
        Add to Cart
      </button>
    </div>

  </div>
</section>

<!-- CART -->
<div class="cart">
  <h3>🛒 Cart</h3>
  <ul id="cart-items"></ul>
  <p><strong>Total: $<span id="total">0.00</span></strong></p>
  <button class="button" style="width:100%;" onclick="checkout()">Checkout</button>
  <p style="font-size:0.8em;">Pay via Venmo after checkout.</p>
</div>

<footer>
  © 2026 Pervan 3-D. All rights reserved.
</footer>

<script>
  let total = 0;
  const cartItems = document.getElementById("cart-items");
  const totalDisplay = document.getElementById("total");

  function addToCart(name, basePrice, color) {
    let price = basePrice;
    let upcharge = "";

    if (color === "Purple" || color === "Copper") {
      price += 2;
      upcharge = " (+$2 premium color)";
    }

    const li = document.createElement("li");
    li.textContent = `${name} - ${color}${upcharge}: $${price.toFixed(2)}`;
    cartItems.appendChild(li);

    total += price;
    totalDisplay.textContent = total.toFixed(2);
  }

  function checkout() {
    if (total === 0) {
      alert("Your cart is empty.");
      return;
    }

    let summary = "Order Summary:\n\n";
    document.querySelectorAll("#cart-items li").forEach(item => {
      summary += "- " + item.textContent + "\n";
    });

    summary += "\nTotal: $" + total.toFixed(2);
    summary += "\n\nPlease send payment via Venmo.";
    summary += "\nInclude item names and colors in the note.";

    alert(summary);
  }
</script>

</body>
</html>
