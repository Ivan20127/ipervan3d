<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pervan 3D Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
header { background:#111; color:white; padding:40px 20px; text-align:center; position:relative; }
header h1 { margin:0; }
.back-btn { position:absolute; top:20px; left:20px; padding:10px 20px; background:#444; color:white; text-decoration:none; border-radius:6px; }

.colors-banner img { width:100%; height:100%; object-fit:cover; }

.products {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.card {
background:white;
padding:20px;
border-radius:6px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.card img { width:100%; height:220px; object-fit:contain; margin-bottom:10px; }

.price { color:#ff6600; font-weight:bold; font-size:1.2em; }

select,input {
width:100%;
max-width:190px;
padding:6px;
margin:6px 0;
}

.button {
background:#dc3545;
color:white;
border:none;
padding:10px 18px;
border-radius:4px;
cursor:pointer;
font-weight:bold;
}

.cart {
background:white;
max-width:500px;
margin:40px auto;
padding:20px;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.remove { color:red; cursor:pointer; margin-left:8px; }
</style>
</head>

<body>

<header>
<h1>Pervan 3D Shop</h1>
<p>3D Printed Fidgets & Gifts</p>
<a href="index.html" class="back-btn">← Back</a>
</header>

<div class="colors-banner">
<img src="colors.png">
</div>

<section class="products">

<!-- DRAGON -->
<div class="card">
<img src="dragon.png">
<h3>Dragon Fidget</h3>
<p class="price">$5–$8</p>
<select id="dragonSize"><option>Small</option><option>Big</option></select>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFidget('Dragon Fidget','dragonSize',this)">Add to Cart</button>
</div>

<!-- STAR -->
<div class="card">
<img src="star.png">
<h3>Star Fidget</h3>
<p class="price">$5–$8</p>
<select id="starSize"><option>Small</option><option>Big</option></select>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFidget('Star Fidget','starSize',this)">Add to Cart</button>
</div>

<!-- GEAR -->
<div class="card">
<img src="gearfidget.png">
<h3>Gear Fidget</h3>
<p class="price">$2</p>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Gear Fidget',2,this)">Add to Cart</button>
</div>

<!-- CACTUS -->
<div class="card">
<img src="cactus.png">
<h3>Cactus Toothpick Holder</h3>
<p class="price">$15</p>
<select class="color"></select>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addTwoColor('Cactus Toothpick Holder',15,this,'Cactus','Base')">Add to Cart</button>
</div>

<!-- NAMES -->
<div class="card">
<img src="names.png">
<h3>Names</h3>
<p class="price">$3</p>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Names',3,this)">Add to Cart</button>
</div>

<!-- TEACHER -->
<div class="card">
<img src="teachergift.png">
<h3>Teacher Gift</h3>
<p class="price">$6</p>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Teacher Gift',6,this)">Add to Cart</button>
</div>

<!-- HEART -->
<div class="card">
<img src="heartdish.png">
<h3>Heart Dish</h3>
<p class="price">$6</p>
<select class="color"></select>
<input type="number" value="1" min="1">
<button class="button" onclick="addFixed('Heart Dish',6,this)">Add to Cart</button>
</div>

<!-- SHIPPING OPTIONS -->
<div class="cart">
<h3>Delivery Method</h3>
<label><input type="radio" name="ship" value="0" checked> Local Drop-Off (Free if nearby)</label><br>
<label><input type="radio" name="ship" value="6"> Shipping ($6 Flat)</label>
</div>

<div class="cart">
<h3>🛒 Cart</h3>
<input id="customerName" placeholder="Customer name required">
<input id="customerPhone" placeholder="Phone number required">
<input id="customerAddress" placeholder="Address required">
<ul id="cart"></ul>
<p><strong>Total: $<span id="total">0.00</span></strong></p>
<button class="button" onclick="checkout()">Pay with Venmo</button>
</div>

<script>
const colors=[
"Red","Blue","Black","Light Green","Yellow","Grey",
"Candy Red","Champagne","White","Titan Grey","Candy Green","Brown",
"Black Gold Green (+$2)","Blue Orange Green (+$2)",
"Copper Purple Green (+$2)","Multi Color Rose (+$2)","Multi Color Blue (+$2)"
];

document.querySelectorAll(".color").forEach(sel=>{
colors.forEach(c=>{
let o=document.createElement("option");
o.textContent=c;
sel.appendChild(o);
});
});

let total=0;
const cart=document.getElementById("cart");
const totalEl=document.getElementById("total");

const upcharge=c=>c.includes("+$2")?2:0;

function addFidget(name,sizeId,btn){
const card=btn.parentElement;
const size=card.querySelector("#"+sizeId).value;
const color=card.querySelector(".color").value;
const qty=parseInt(card.querySelector("input").value);
let price=(size==="Big"?8:5)+upcharge(color);
addItem(`${color} ${name} (${size})`,price,qty);
}

function addFixed(name,base,btn){
const card=btn.parentElement;
const color=card.querySelector(".color").value;
const qty=parseInt(card.querySelector("input").value);
addItem(`${color} ${name}`,base+upcharge(color),qty);
}

function addTwoColor(name,base,btn,l1,l2){
const card=btn.parentElement;
const c=[...card.querySelectorAll(".color")].map(s=>s.value);
const qty=parseInt(card.querySelector("input").value);
let price=base+c.reduce((a,x)=>a+upcharge(x),0);
addItem(`${name} (${l1}:${c[0]}, ${l2}:${c[1]})`,price,qty);
}

function addItem(label,price,qty){
const t=price*qty;
total+=t;
const li=document.createElement("li");
li.innerHTML=`${label} x${qty} - $${t.toFixed(2)} <span class="remove">✖</span>`;
li.querySelector(".remove").onclick=()=>{
cart.removeChild(li);
total-=t;
updateTotal();
};
cart.appendChild(li);
updateTotal();
}

function updateTotal(){
let ship=parseFloat(document.querySelector("input[name='ship']:checked").value);
totalEl.textContent=(total+ship).toFixed(2);
}

document.querySelectorAll("input[name='ship']").forEach(r=>{
r.onchange=updateTotal;
});

function checkout(){
if(!cart.children.length) return alert("Cart empty");
if(!customerName.value.trim()) return alert("Enter name");
if(!customerPhone.value.trim()) return alert("Enter phone");
if(!customerAddress.value.trim()) return alert("Enter address");

let shipType=document.querySelector("input[name='ship']:checked").value=="6"?"Shipping $6":"Local Drop-Off";

let note=`Pervan 3D Order
Name: ${customerName.value}
Phone: ${customerPhone.value}
Address: ${customerAddress.value}

Items:
`;

[...cart.children].forEach(li=>{
note+=li.textContent.replace("✖","")+"\n";
});

note+=`\nDelivery: ${shipType}`;

let ship=parseFloat(document.querySelector("input[name='ship']:checked").value);
let finalTotal=total+ship;

window.open(
`https://venmo.com/?txn=pay&recipients=@Pervan3D&amount=${finalTotal.toFixed(2)}&note=${encodeURIComponent(note)}`
);
}
</script>

</body>
</html>
